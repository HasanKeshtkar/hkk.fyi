# Local PostgreSQL for development and tests: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinic_dev
    ports:
      - "127.0.0.1:5432:5432" # loopback only: never expose the dev DB to the network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
