# Tests for the clinic app (clinic/). The static site itself has no build or tests.
name: clinic

on:
  push:
    paths: ['clinic/**', '.github/workflows/clinic.yml']
  pull_request:
    paths: ['clinic/**', '.github/workflows/clinic.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinic
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/clinic_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/clinic_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clinic/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: clinic/test-results/
          retention-days: 7

  # The production image, run the way Liara runs it (as root, backup disk mounted): it starts,
  # serves the app, and can back up and restore with the PostgreSQL tools it ships.
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_image_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clinic clinic
      - name: Start the container
        run: |
          mkdir -p "$RUNNER_TEMP/backups"
          docker run -d --name app --network host \
            -v "$RUNNER_TEMP/backups:/app/backups" \
            -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/clinic_image_test \
            -e APP_ORIGIN=http://localhost:3000 \
            -e BACKUP_DIR=/app/backups \
            clinic
          for i in $(seq 1 30); do curl -fsS localhost:3000/healthz && break; sleep 1; done
          curl -fsS localhost:3000/healthz
      - name: Smoke test
        run: |
          set -ex
          curl -fsS localhost:3000/ | grep -q '<html'
          curl -fsS localhost:3000/manifest.webmanifest | grep -q '"start_url": "/"'
          curl -fsS localhost:3000/sw.js | grep -q 'const PRECACHE = \["/"'
          # The server runs as the unprivileged user, not root.
          docker exec app sh -c 'ps -o user,args | grep "[d]ist/server.mjs"' | grep -q '^node'
          docker exec app pg_dump --version
          docker exec -e SEED_DOCTOR_PASSWORD=doctor-pass-123 -e SEED_SECRETARY_PASSWORD=secretary-pass-123 app node dist/seed.mjs
          docker exec -u node app node dist/backup.mjs
          FILE=$(ls "$RUNNER_TEMP/backups" | grep '^clinic-.*\.dump$' | head -1)
          docker exec -u node app psql postgres://postgres:postgres@127.0.0.1:5432/clinic_image_test -c "delete from weekly_schedule"
          docker exec -u node app node dist/restore.mjs "/app/backups/$FILE" --yes
          test "$(docker exec app psql postgres://postgres:postgres@127.0.0.1:5432/clinic_image_test -Atc 'select count(*) from weekly_schedule')" = 7
          ls -l "$RUNNER_TEMP/backups"
      - if: always()
        run: docker logs app
