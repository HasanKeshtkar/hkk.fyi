# The clinic app (clinic/): tests on every push; a push that passes them goes live on Cloudflare.
# The static site itself has no build or tests.
name: clinic

on:
  push:
    paths: ['clinic/**', '.github/workflows/clinic.yml']
  pull_request:
    paths: ['clinic/**', '.github/workflows/clinic.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clinic/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web
      # The app runs on the real Workers runtime (wrangler dev) for both test suites.
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # The Worker bundles and its configuration is valid.
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: clinic/test-results/
          retention-days: 7

  # Needs the repository secrets CLOUDFLARE_API_TOKEN, SEED_DOCTOR_PASSWORD and
  # SEED_SECRETARY_PASSWORD (see clinic/README.md). Until the token is there, it does nothing.
  # Only the clinic's release branch goes live; every other branch is only tested.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/ccr-be786f2b-2eug68'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: clinic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clinic/package-lock.json
      - name: Is Cloudflare connected, and is this the newest app?
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare is not connected yet (no CLOUDFLARE_API_TOKEN secret): nothing to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Never put an older app over a newer one: skip only if a newer commit on the branch
          # changes the app (its own run deploys it). Commits that touch other files do not count.
          git fetch --quiet --depth=1 origin "$GITHUB_REF_NAME"
          set +e
          # (paths from the repository root: this step runs in clinic/)
          git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- :/clinic :/.github/workflows/clinic.yml
          changed=$?
          set -e
          if [ "$changed" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$changed" -ne 1 ]; then
            echo "::error::Could not compare with the newest commit of $GITHUB_REF_NAME."
            exit 1
          elif [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            # A re-run (e.g. to apply a new password) of a run that is no longer the newest.
            echo "::error::This is not the newest version of the app: re-run the newest clinic run in Actions instead."
            exit 1
          else
            echo "::warning::A newer commit changes the app; its own run deploys it. Not deploying $GITHUB_SHA."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cf.outputs.ready == 'true'
        run: npm ci && npm run build:web
      - name: Deploy to Cloudflare
        if: steps.cf.outputs.ready == 'true'
        env:
          TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SEED_DOCTOR_PASSWORD: ${{ secrets.SEED_DOCTOR_PASSWORD }}
          SEED_SECRETARY_PASSWORD: ${{ secrets.SEED_SECRETARY_PASSWORD }}
        run: |
          umask 077
          # Just the token, even if the secret was pasted with spaces, extra lines or the
          # "Authorization: Bearer" test command around it. The value itself is never printed.
          CLOUDFLARE_API_TOKEN=$(node -e '
            const found = [...new Set(process.env.TOKEN_SECRET.match(/[A-Za-z0-9_-]{40,}/g) ?? [])];
            if (found.length !== 1) {
              console.error(`::error::The CLOUDFLARE_API_TOKEN secret should hold only the Cloudflare API token, on one line (found ${found.length} token-like values). Paste it again in Settings > Secrets and variables > Actions.`);
              process.exit(1);
            }
            process.stdout.write(found[0]);
          ')
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN
          # The two passwords go up as Worker secrets (never in a file in the repository or a log).
          # Spaces or line breaks pasted around one are dropped; one the server would refuse
          # stops the deploy here, so a password change never silently does nothing.
          node -e '
            const s = {};
            for (const k of ["SEED_DOCTOR_PASSWORD", "SEED_SECRETARY_PASSWORD"]) {
              const v = (process.env[k] ?? "").trim();
              if (v === "") continue;
              if (v.length < 8 || /[\r\n]/.test(v)) {
                console.error(`::error::The ${k} secret must be one line of at least 8 characters. Set it again in Settings > Secrets and variables > Actions, then re-run.`);
                process.exit(1);
              }
              s[k] = v;
            }
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(s));
          '
          # A new id for every run and re-run: the server re-checks the passwords once per id, and
          # "Re-run all jobs" of the newest run (or a commit to clinic/redeploy.txt) applies a changed one.
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" --var "DEPLOY_ID:$GITHUB_SHA.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Is it up?
        if: steps.cf.outputs.ready == 'true'
        run: |
          ORIGIN=$(node -e 'const t = require("fs").readFileSync("wrangler.jsonc", "utf8").replace(/^\s*\/\/.*$/gm, ""); console.log(JSON.parse(t).vars.APP_ORIGIN.split(",")[0])')
          for i in $(seq 1 30); do
            if curl -fsS "$ORIGIN/healthz"; then echo; echo "live at $ORIGIN"; exit 0; fi
            sleep 10
          done
          echo "::warning::$ORIGIN does not answer yet (a new domain's certificate can take a few minutes)."
