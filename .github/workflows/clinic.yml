# Tests for the clinic app (clinic/). The static site itself has no build or tests.
name: clinic

on:
  push:
    paths: ['clinic/**', '.github/workflows/clinic.yml']
  pull_request:
    paths: ['clinic/**', '.github/workflows/clinic.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinic
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/clinic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clinic/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
