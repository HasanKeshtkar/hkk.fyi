wrap:nowrap;margin:0}\n.circ{display:block;margin:0 auto;width:100%;height:auto;max-width:var(--cw,36em);flex:0 1 auto}\n.figs .circ{margin:0;max-width:none;flex:1.9 1 0;min-width:0}\n.figs .tdr,.figs .vsfig{max-width:none;flex:1 1 0;min-width:0;height:auto}\n.sol{border-top:1px solid var(--line);padding-top:.35em;display:flex;flex-direction:column}\n.sol .eq{font-size:1.2em;line-height:1.9;margin:.18em 0;text-align:center}\n.eq{font-family:var(--math)}\n.sol .eq b{font-size:.85em}\nsub,sup{line-height:0}\n.fr{line-height:1.2;margin:0 .12em}\n.fr>span:first-child{border-bottom:.075em solid currentColor;padding:0 .2em .05em}\n.fr>span:last-child{padding:.05em .2em 0}\n.box{display:inline-block;vertical-align:middle;line-height:1.3;border:2px solid var(--acc);border-radius:.35em;padding:.12em .45em;margin:.12em 0;white-space:nowrap}\n.sol table{font-size:.9em;margin:.45em auto}\n.sol th,.sol td{padding:.28em .75em}\n.sol th{font-size:.92em}\n.sol h3{font-size:1em;margin:.6em 0 .05em}\n.sol .note{font-size:.85em;margin:.2em 0}\n.sol>p{margin:.2em 0}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\" style=\"--lw:40%;--cw:36.5em\">\n\u003cdiv class=\"top\">\n  \u003ch1>Example · Reactive loads\u003c/h1>\n  \u003cspan class=\"given\">2 V step, R\u003csub>s\u003c/sub> = 50 Ω · Z\u003csub>0\u003c/sub> = 50 Ω, t\u003csub>d\u003c/sub> = 1 ns\u003c/span>\n  \u003cbutton class=\"case\" data-c=\"0\">(a) C\u003c/button>\n  \u003cbutton class=\"case\" data-c=\"1\">(b) L\u003c/button>\n\u003c/div>\n\u003cdiv class=\"main\">\n\u003csection class=\"left\">\n\u003cp class=\"stmt\">A 2-V step source with source resistance \u003ci>R\u003c/i>\u003csub>s\u003c/sub> = 50 Ω is connected at \u003ci>t\u003c/i> = 0 to a lossless 50-Ω line with one-way delay \u003ci>t\u003c/i>\u003csub>d\u003c/sub> = 1 ns. The line is terminated in \u003cb>(a)\u003c/b> a capacitor \u003ci>C\u003c/i> = 20 pF, or \u003cb>(b)\u003c/b> an inductor \u003ci>L\u003c/i> = 50 nH. The line and the load are initially uncharged. Find and sketch the load voltage \u003ci>V\u003c/i>\u003csub>L\u003c/sub>(\u003ci>t\u003c/i>) and the source-end voltage \u003ci>V\u003c/i>\u003csub>s\u003c/sub>(\u003ci>t\u003c/i>) for 0 ≤ \u003ci>t\u003c/i> ≤ 6 ns.\u003c/p>\n\u003csvg class=\"circ\" viewBox=\"0 0 690 215\" font-family=\"system-ui,sans-serif\">\n  \u003cg stroke=\"#141821\" stroke-width=\"2\" fill=\"none\">\n    \u003ccircle cx=\"50\" cy=\"118\" r=\"24\"/>\n    \u003cpath d=\"M40 126 H50 V108 H60\" stroke-width=\"1.8\"/>\n    \u003cpath d=\"M50 94 V52 H78 l5 -8 l10 16 l10 -16 l10 16 l10 -16 l5 8 H140\"/>\n    \u003cpath d=\"M50 142 V178 H140\"/>\n    \u003cpath d=\"M140 52 H500\" stroke-width=\"3\"/>\u003cpath d=\"M140 178 H500\" stroke-width=\"3\"/>\n    \u003cpath d=\"M500 52 H550\"/>\u003cpath d=\"M500 178 H550\"/>\n  \u003c/g>\n  \u003cg fill=\"#fff\" stroke=\"#141821\" stroke-width=\"2\">\u003ccircle cx=\"140\" cy=\"52\" r=\"4\"/>\u003ccircle cx=\"140\" cy=\"178\" r=\"4\"/>\u003ccircle cx=\"500\" cy=\"52\" r=\"4\"/>\u003ccircle cx=\"500\" cy=\"178\" r=\"4\"/>\u003c/g>\n  \u003c!-- (a) capacitor -->\n  \u003cg class=\"ld\" data-c=\"0\" stroke=\"#141821\" stroke-width=\"2\" fill=\"none\">\n    \u003cpath d=\"M550 52 V106 M530 106 H570 M530 124 H570 M550 124 V178\"/>\n  \u003c/g>\n  \u003cg class=\"ld\" data-c=\"0\" font-size=\"15\" font-style=\"italic\">\u003ctext x=\"580\" y=\"120\">C = 20 pF\u003c/text>\u003c/g>\n  \u003c!-- (b) inductor -->\n  \u003cg class=\"ld\" data-c=\"1\" stroke=\"#141821\" stroke-width=\"2\" fill=\"none\">\n    \u003cpath d=\"M550 52 V80 a8 8 0 0 1 0 16 a8 8 0 0 1 0 16 a8 8 0 0 1 0 16 a8 8 0 0 1 0 16 V178\"/>\n  \u003c/g>\n  \u003cg class=\"ld\" data-c=\"1\" font-size=\"15\" font-style=\"italic\">\u003ctext x=\"570\" y=\"120\">L = 50 nH\u003c/text>\u003c/g>\n  \u003ctext x=\"50\" y=\"86\" text-anchor=\"middle\" font-size=\"15\">+\u003c/text>\n  \u003ctext x=\"50\" y=\"160\" text-anchor=\"middle\" font-size=\"15\">−\u003c/text>\n  \u003ctext x=\"22\" y=\"112\" font-size=\"14\" text-anchor=\"end\">2 V\u003c/text>\n  \u003ctext x=\"22\" y=\"132\" font-size=\"14\" text-anchor=\"end\">0\u003c/text>\n  \u003ctext x=\"98\" y=\"34\" text-anchor=\"middle\" font-size=\"14\">50 Ω\u003c/text>\n  \u003ctext x=\"160\" y=\"82\" font-size=\"16\">+\u003c/text>\n  \u003ctext x=\"156\" y=\"122\" font-size=\"16\" font-style=\"italic\">V\u003ctspan font-size=\"12\" dy=\"4\">s\u003c/tspan>\u003c/text>\n  \u003ctext x=\"161\" y=\"160\" font-size=\"18\">−\u003c/text>\n  \u003ctext x=\"320\" y=\"40\" text-anchor=\"middle\" font-size=\"16\">Z₀ = 50 Ω, t\u003ctspan font-size=\"12\" dy=\"4\">d\u003c/tspan>\u003ctspan dy=\"-4\"> = 1 ns\u003c/tspan>\u003c/text>\n  \u003ctext x=\"512\" y=\"82\" font-size=\"16\">+\u003c/text>\n  \u003ctext x=\"508\" y=\"122\" font-size=\"16\" font-style=\"italic\">V\u003ctspan font-size=\"12\" dy=\"4\">L\u003c/tspan>\u003c/text>\n  \u003ctext x=\"513\" y=\"160\" font-size=\"18\">−\u003c/text>\n\u003c/svg>\n\u003cdiv class=\"sol\">\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003ci>V\u003c/i>\u003csup>+\u003c/sup> = 2 · \u003cspan class=\"fr\">\u003cspan>50\u003c/span>\u003cspan>50 + 50\u003c/span>\u003c/span> = 1 V,\u003c/span> \u003cspan class=\"sg arr\">\u003ci>Γ\u003c/i>\u003csub>s\u003c/sub> = 0 (no re-reflection)\u003c/span> \u003cspan class=\"sg gap lbl\">load sees Thevenin:\u003c/span> \u003cspan class=\"sg arr\">2\u003ci>V\u003c/i>\u003csup>+\u003c/sup> = 2 V behind \u003ci>Z\u003c/i>\u003csub>0\u003c/sub> = 50 Ω, for \u003ci>t\u003c/i> &gt; \u003ci>t\u003c/i>\u003csub>d\u003c/sub>\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003ci>V\u003c/i>\u003csup>−\u003c/sup> = \u003ci>V\u003c/i>\u003csub>L\u003c/sub> − \u003ci>V\u003c/i>\u003csup>+\u003c/sup>\u003c/span> \u003cspan class=\"sg gap\">\u003cspan class=\"box\">\u003ci>V\u003c/i>\u003csub>s\u003c/sub>(\u003ci>t\u003c/i>) = \u003ci>V\u003c/i>\u003csub>L\u003c/sub>(\u003ci>t\u003c/i> − \u003ci>t\u003c/i>\u003csub>d\u003c/sub>)\u003c/span> for \u003ci>t\u003c/i> &gt; 2\u003ci>t\u003c/i>\u003csub>d\u003c/sub>,\u003c/span> \u003cspan class=\"sg arr\">\u003ci>V\u003c/i>\u003csub>s\u003c/sub> = 1 V for 0 &lt; \u003ci>t\u003c/i> &lt; 2\u003ci>t\u003c/i>\u003csub>d\u003c/sub>\u003c/span>\u003c/div>\n\u003cp class=\"note\">s = t − t\u003csub>d\u003c/sub> (ns), time since the step reached the load.\u003c/p>\n\n\u003ch3>(a) C = 20 pF\u003c/h3>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003ci>τ\u003c/i> = \u003ci>Z\u003c/i>\u003csub>0\u003c/sub>\u003ci>C\u003c/i> = 1 ns\u003c/span> \u003cspan class=\"sg gap\">\u003cspan class=\"box\">\u003ci>V\u003c/i>\u003csub>L\u003c/sub> = 2(1 − \u003ci>e\u003c/i>\u003csup>−\u003ci>s\u003c/i>/\u003ci>τ\u003c/i>\u003c/sup>)\u003c/span>\u003c/span> \u003cspan class=\"sg gap\">\u003ci>Γ\u003c/i>(0\u003csup>+\u003c/sup>) = −1 (C = short)\u003c/span>\u003c/div>\n\n\u003ch3>(b) L = 50 nH\u003c/h3>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003ci>τ\u003c/i> = \u003cspan class=\"fr\">\u003cspan>\u003ci>L\u003c/i>\u003c/span>\u003cspan>\u003ci>Z\u003c/i>\u003csub>0\u003c/sub>\u003c/span>\u003c/span> = 1 ns\u003c/span> \u003cspan class=\"sg gap\">\u003cspan class=\"box\">\u003ci>V\u003c/i>\u003csub>L\u003c/sub> = 2\u003ci>e\u003c/i>\u003csup>−\u003ci>s\u003c/i>/\u003ci>τ\u003c/i>\u003c/sup>\u003c/span>\u003c/span> \u003cspan class=\"sg gap\">\u003ci>Γ\u003c/i>(0\u003csup>+\u003c/sup>) = +1 (L = open)\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"right\">\n\u003cdiv class=\"bar\">\n  \u003cbutton id=\"bPrev\">◀\u003c/button>\n  \u003cbutton id=\"bPlay\" style=\"min-width:44px\">▶\u003c/button>\n  \u003cbutton id=\"bNext\">▶|\u003c/button>\n  \u003cinput type=\"range\" id=\"ts\" min=\"0\" max=\"6\" step=\"0.001\" value=\"0\">\n  \u003cspan id=\"tr\">t = 0.000 ns\u003c/span>\n\u003c/div>\n\u003cdiv class=\"cv line\">\u003ccanvas id=\"cLine\">\u003c/canvas>\u003c/div>\n\u003cdiv class=\"two\">\n  \u003cdiv class=\"cv\" style=\"flex:470 1 0\">\u003ccanvas id=\"cBounce\" style=\"cursor:ns-resize\">\u003c/canvas>\u003c/div>\n  \u003cdiv class=\"col\">\n    \u003cdiv class=\"cv\" style=\"flex:232 1 0\">\u003ccanvas class=\"tp\" data-k=\"1\" style=\"cursor:ew-resize\">\u003c/canvas>\u003c/div>\n    \u003cdiv class=\"cv\" style=\"flex:232 1 0\">\u003ccanvas class=\"tp\" data-k=\"0\" style=\"cursor:ew-resize\">\u003c/canvas>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c/section>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  /* shrink/grow the left column so statement + figure + solution always fit without scrolling */\n  const L = document.querySelector(\".left\");\n  function fits(){ return L.scrollHeight \u003c= L.clientHeight + 1 && L.scrollWidth \u003c= L.clientWidth + 1; }\n  function fit(){\n    let lo = 9, hi = 23;\n    for (let i = 0; i \u003c 14; i++){ const m = (lo + hi)/2; L.style.fontSize = m + \"px\"; if (fits()) lo = m; else hi = m; }\n    L.style.fontSize = lo + \"px\";\n    document.documentElement.dataset.fs = lo.toFixed(2);\n  }\n  window.__fit = fit;\n  fit();\n  if (document.fonts){ document.fonts.ready.then(() => { fit(); window.dispatchEvent(new Event(\"resize\")); }); }\n  window.addEventListener(\"resize\", fit);\n  /* slide navigation keys go to the deck */\n  const NAV = [\"PageDown\",\"PageUp\",\"ArrowDown\",\"ArrowUp\",\"Home\",\"End\",\"f\",\"F\",\"l\",\"L\"];\n  document.addEventListener(\"keydown\", e => {\n    if (!NAV.includes(e.key) || e.ctrlKey || e.metaKey || e.altKey) return;\n    e.preventDefault(); e.stopImmediatePropagation();\n    parent.postMessage({deckKey: e.key}, \"*\");\n  }, true);\n})();\n\u003c/script>\n\u003cscript>\n/* laser pointer: glowing red dot + short fading trail that follows the mouse (toggle with L) */\n(function(){\n  const cv = document.createElement(\"canvas\");\n  cv.style.cssText = \"position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:2147483647\";\n  const st = document.createElement(\"style\");\n  st.textContent = \"html.laser-on, html.laser-on *{cursor:none !important}\";\n  document.head.appendChild(st);\n  const add = () => document.body.appendChild(cv);\n  document.body ? add() : addEventListener(\"DOMContentLoaded\", add);\n  const ctx = cv.getContext(\"2d\");\n  let on = true, pts = [], cur = null, raf = 0, W = 0, H = 0;\n  const TRAIL = 260;\n  function size(){ const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = Math.round(W*d); cv.height = Math.round(H*d); ctx.setTransform(d, 0, 0, d, 0, 0); }\n  size(); addEventListener(\"resize\", () => { size(); draw(); });\n  function dot(x, y){\n    const g = ctx.createRadialGradient(x, y, 0, x, y, 20);\n    g.addColorStop(0, \"rgba(255,40,40,.55)\"); g.addColorStop(.45, \"rgba(255,30,30,.22)\"); g.addColorStop(1, \"rgba(255,0,0,0)\");\n    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill();\n    ctx.fillStyle = \"#ff1f1f\"; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill();\n    ctx.fillStyle = \"rgba(255,235,235,.95)\"; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 7); ctx.fill();\n  }\n  function draw(){\n    raf = 0;\n    ctx.clearRect(0, 0, W, H);\n    if (!on) return;\n    const now = performance.now();\n    pts = pts.filter(p => now - p.t \u003c TRAIL);\n    ctx.lineCap = \"round\"; ctx.lineJoin = \"round\";\n    for (let i = 1; i \u003c pts.length; i++){\n      const a = 1 - (now - pts[i].t)/TRAIL;\n      ctx.strokeStyle = `rgba(255,30,30,${(.55*a).toFixed(3)})`; ctx.lineWidth = 1 + 7*a;\n      ctx.beginPath(); ctx.moveTo(pts[i-1].x, pts[i-1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();\n    }\n    if (cur) dot(cur.x, cur.y);\n    if (pts.length > 1) raf = requestAnimationFrame(draw);\n  }\n  const kick = () => { if (!raf) raf = requestAnimationFrame(draw); };\n  addEventListener(\"pointermove\", e => {\n    if (!on) return;\n    cur = {x: e.clientX, y: e.clientY}; pts.push({x: cur.x, y: cur.y, t: performance.now()}); kick();\n  }, true);\n  const hide = () => { cur = null; pts = []; kick(); };\n  document.addEventListener(\"mouseleave\", hide);\n  document.addEventListener(\"mouseout\", e => { if (!e.relatedTarget || e.relatedTarget.tagName === \"IFRAME\") hide(); });\n  window.__laser = v => { on = v; document.documentElement.classList.toggle(\"laser-on\", on); if (!on) hide(); kick(); };\n  window.__laser(true);\n  addEventListener(\"message\", e => { if (e.data && typeof e.data.laser === \"boolean\") window.__laser(e.data.laser); });\n})();\n\u003c/script>\n\u003cscript>\n/* bounce-diagram amplitude labels: placed along their own wave line, never on top of another label or a crossing */\nlet PQL_ = [];\nfunction PQ_(ctx, s, xa, ya, xb, yb, col, fs, ymax){ PQL_.push({s, xa, ya, xb, yb, col, fs, ymax}); }\nfunction PQF_(ctx){\n  const segs = PQL_.map(it => { let xb = it.xb, yb = it.yb; if (yb > it.ymax){ const f = (it.ymax - it.ya)/(yb - it.ya); xb = it.xa + (xb - it.xa)*f; yb = it.ymax; } return [it.xa, it.ya, xb, yb]; });\n  const hit = (r, s) => { // Liang-Barsky segment / rectangle test\n    let t0 = 0, t1 = 1; const dx = s[2] - s[0], dy = s[3] - s[1];\n    for (const [p, q] of [[-dx, s[0] - r.x0], [dx, r.x1 - s[0]], [-dy, s[1] - r.y0], [dy, r.y1 - s[1]]]){\n      if (Math.abs(p) \u003c 1e-12){ if (q \u003c 0) return false; continue; }\n      const t = q/p; if (p \u003c 0){ if (t > t1) return false; if (t > t0) t0 = t; } else { if (t \u003c t0) return false; if (t \u003c t1) t1 = t; } }\n    return true; };\n  const F = [0.5, 0.38, 0.62, 0.28, 0.72, 0.44, 0.56, 0.2, 0.8, 0.33, 0.67];\n  const placed = [];\n  PQL_.forEach((it, i) => {\n    ctx.font = `600 ${it.fs}px system-ui,sans-serif`;\n    const w = ctx.measureText(it.s).width + 10, h = it.fs + 7;\n    let best = null, bestS = Infinity;\n    for (const f of F){\n      const cx = it.xa + (it.xb - it.xa)*f, cy = it.ya + (it.yb - it.ya)*f;\n      if (cy + h/2 > it.ymax + 3) continue;\n      const r = {x0: cx - w/2 - 2, x1: cx + w/2 + 2, y0: cy - h/2 - 2, y1: cy + h/2 + 2};\n      let sc = 0;\n      for (const q of placed){ const ox = Math.min(r.x1, q.x1) - Math.max(r.x0, q.x0), oy = Math.min(r.y1, q.y1) - Math.max(r.y0, q.y0); if (ox > 0 && oy > 0) sc += 1000 + ox*oy; }\n      segs.forEach((s, j) => { if (j !== i && hit(r, s)) sc += 60; });\n      sc += Math.abs(f - 0.5)*20;\n      if (sc \u003c bestS){ bestS = sc; best = {cx, cy, r}; }\n    }\n    if (!best) return;\n    placed.push(best.r); pill(ctx, it.s, best.cx, best.cy, it.col, \"center\", it.fs);\n  });\n  PQL_ = [];\n}\n\u003c/script>\n\u003cscript>\n/* z-diagram for branched networks: every line gets its own panel, so profiles never sit on top of each other */\nfunction GLINE_(cfg){\n  const {ctx, w, h} = setup(document.getElementById(\"cLine\"));\n  const order = cfg.order, D = cfg.D || (() => 1), lo = cfg.lo, hi = cfg.hi, st = cfg.st;\n  const fm = v => { if (Math.abs(v) \u003c 5e-10) return \"0\";\n    if (cfg.fmt === \"frac\") for (let d = 1; d \u003c= 729; d++){ const n = Math.round(Math.abs(v)*d);\n      if (Math.abs(n/d - Math.abs(v)) \u003c 1e-9){ const s = n + (d > 1 ? \"/\" + d : \"\"); if (s.length \u003c= 7) return (v \u003c 0 ? \"−\" : \"\") + s; break; } }\n    return (+v.toFixed(4)).toString().replace(\"-\", \"−\"); };\n  const sgn = v => (v > 0 ? \"+\" : \"\") + fm(v);\n  const panelOf = ln => ln;\n  // rows needed for travelling-front labels (max simultaneous fronts in one panel over the whole run)\n  let rows = 1;\n  for (let j = 0; j \u003c= 300; j++){ const cnt = {}; for (const f of fronts(j/300*TMAX)){ cnt[f.ln] = (cnt[f.ln] || 0) + 1; rows = Math.max(rows, cnt[f.ln]); } }\n  rows += 1;\n  const L = 50, Rm = cfg.rm || 14, B = 44, gap = 30, Tm = 14 + 24*rows;\n  const totD = order.reduce((s, ln) => s + D(ln), 0), unit = (w - L - Rm - gap*(order.length - 1))/totD;\n  const px = {}, pw = {}; let xx = L;\n  for (const ln of order){ px[ln] = xx; pw[ln] = unit*D(ln); xx += pw[ln] + gap; }\n  const y = v => Tm + (hi - v)/(hi - lo)*(h - Tm - B);\n  const tint = c => { if (c === \"#141821\") return \"rgba(36,86,214,.12)\"; const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},.14)`; };\n  // y axis labels + per-panel grid\n  ctx.font = \"12px system-ui,sans-serif\"; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\"; ctx.fillStyle = \"#6a7180\";\n  for (let v = lo; v \u003c= hi + 1e-9; v += st) ctx.fillText((+v.toFixed(3)).toString().replace(\"-\", \"−\"), L - 8, y(v));\n  for (const ln of order){\n    const x0 = px[ln], x1 = x0 + pw[ln], col = cfg.col(ln);\n    for (let v = lo; v \u003c= hi + 1e-9; v += st){ ctx.strokeStyle = Math.abs(v) \u003c 1e-9 ? \"#a3a9b6\" : \"#eceef3\"; ctx.lineWidth = Math.abs(v) \u003c 1e-9 ? 1.3 : 1;\n      ctx.beginPath(); ctx.moveTo(x0, y(v)); ctx.lineTo(x1, y(v)); ctx.stroke(); }\n    // profile\n    const N = 500, pts = []; for (let j = 0; j \u003c= N; j++) pts.push(V(ln, j/N, S.t));\n    const path = first => { first ? ctx.lineTo(x0, y(pts[0])) : ctx.moveTo(x0, y(pts[0]));\n      for (let j = 1; j \u003c= N; j++){ const xj = x0 + j/N*pw[ln]; if (Math.abs(pts[j] - pts[j-1]) > 1e-12) ctx.lineTo(xj, y(pts[j-1])); ctx.lineTo(xj, y(pts[j])); } };\n    ctx.beginPath(); ctx.moveTo(x0, y(0)); path(true); ctx.lineTo(x1, y(0)); ctx.closePath(); ctx.fillStyle = tint(col); ctx.fill();\n    ctx.beginPath(); path(); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();\n    // boundaries\n    ctx.strokeStyle = col; ctx.lineWidth = 3;\n    for (const xb of [x0, x1]){ ctx.beginPath(); ctx.moveTo(xb, Tm - 4); ctx.lineTo(xb, h - B + 4); ctx.stroke(); }\n    // plateau labels\n    ctx.font = \"600 13.5px system-ui,sans-serif\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"bottom\"; ctx.fillStyle = col;\n    let s0 = 0;\n    for (let j = 1; j \u003c= N + 1; j++){\n      if (j === N + 1 || Math.abs(pts[j] - pts[s0]) > 1e-12){\n        const a = s0/N, b = (j - 1)/N, tw = ctx.measureText(fm(pts[s0])).width;\n        if ((b - a)*pw[ln] > tw + 10) ctx.fillText(fm(pts[s0]), x0 + (a + b)/2*pw[ln], y(pts[s0]) - 5);\n        s0 = j;\n      }\n    }\n    // node names + title\n    const nd = cfg.nodes(ln);\n    ctx.textBaseline = \"top\";\n    [0, 1].forEach(e => {\n      const o = cfg.out.find(q => q.ln === ln && q.x === e);\n      let t = nd[e], fs = 12.5;\n      ctx.fillStyle = o ? o.c : \"#141821\";\n      if (o) t = (nd[e] ? nd[e] + \":  \" : \"\") + o.n + \" = \" + fm(V(ln, e, S.t)) + \" V\";\n      do { ctx.font = (o ? \"700 \" : \"600 \") + fs + \"px system-ui,sans-serif\"; fs -= 0.5; } while (o && ctx.measureText(t).width > pw[ln]*0.78 && fs > 9);\n      ctx.textAlign = e ? \"right\" : \"left\"; ctx.fillText(t, e ? x1 - 3 : x0 + 3, h - B + 6);\n    });\n    ctx.font = \"600 13px system-ui,sans-serif\"; ctx.fillStyle = col === \"#141821\" ? \"#4a5160\" : col; ctx.textAlign = \"center\";\n    ctx.fillText(cfg.name(ln), x0 + pw[ln]/2, h - B + 24);\n  }\n  // travelling fronts: each label goes to the first header row where it collides with nothing\n  const taken = [];\n  for (const f of fronts(S.t)){\n    const col = f.dir > 0 ? \"#2456d6\" : \"#d4442a\", xf = px[f.ln] + f.x*pw[f.ln];\n    const s = (cfg.pre ? cfg.pre(f.ln) : \"\") + sgn(f.amp) + \" V\";\n    ctx.font = \"600 12.5px system-ui,sans-serif\"; const pwd = ctx.measureText(s).width + 10;\n    let xp = xf + f.dir*34, al = f.dir > 0 ? \"left\" : \"right\";\n    if (f.dir > 0 && xp + pwd > w - 2){ xp = xf - 6; al = \"right\"; }\n    if (f.dir \u003c 0 && xp - pwd \u003c 2){ xp = xf + 6; al = \"left\"; }\n    const lo_ = Math.min(xf, al === \"left\" ? xp : xp - pwd) - 4, hi_ = Math.max(xf + f.dir*30, al === \"left\" ? xp + pwd : xp) + 4;\n    let r = 0; while (r \u003c rows - 1 && taken.some(q => q.r === r && q.a \u003c hi_ && lo_ \u003c q.b)) r++;\n    taken.push({r, a: lo_, b: hi_});\n    const ya = Tm - 14 - 24*r;\n    ctx.setLineDash([5, 4]); ctx.strokeStyle = col; ctx.lineWidth = 1.5;\n    ctx.beginPath(); ctx.moveTo(xf, ya); ctx.lineTo(xf, h - B); ctx.stroke(); ctx.setLineDash([]);\n    arrow(ctx, xf, ya, xf + f.dir*28, ya, col);\n    pill(ctx, s, xp, ya, col, al, 12.5);\n  }\n  // output readouts (dots; values are written under the node names)\n  for (const o of cfg.out){\n    const v = V(o.ln, o.x, S.t), xo = px[o.ln] + o.x*pw[o.ln];\n    ctx.fillStyle = o.c; ctx.beginPath(); ctx.arc(xo, y(v), 5.5, 0, 7); ctx.fill(); ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2; ctx.stroke();\n  }\n}\n\u003c/script>\n\n\u003cscript>\n/* reflection-coefficient headers for the bounce diagrams: arrow = direction of the incident wave */\nfunction GFR_(x){\n  if (Math.abs(x) \u003c 1e-9) return \"0\";\n  const s = x > 0 ? \"+\" : \"−\", a = Math.abs(x);\n  for (let d = 1; d \u003c= 64; d++){ const n = Math.round(a*d); if (Math.abs(n/d - a) \u003c 1e-9) return s + n + (d > 1 ? \"/\" + d : \"\"); }\n  return s + (+a.toFixed(3));\n}\nfunction GHDR_(ctx, items, Tm){\n  ctx.save();\n  for (let it of items){\n    const y = it.dir > 0 ? Tm - 31 : Tm - 11, col = it.dir > 0 ? \"#2456d6\" : \"#d4442a\", maxW = it.w - 6;\n    let fs = 15.5, tw = 0, al = 22, txt = it.t;\n    const fit = t => { for (fs = 15.5; fs > 9; fs -= 0.5){ ctx.font = \"700 \" + fs + \"px system-ui,sans-serif\"; tw = ctx.measureText(t).width; al = Math.round(fs*1.2); if (tw + al + 8 \u003c= maxW) break; } };\n    fit(txt);\n    if (fs \u003c 12.5 && txt.startsWith(\"Γ = \")){ txt = txt.slice(4); fit(txt); }\n    it = Object.assign({}, it, {t: txt});\n    ctx.strokeStyle = \"#b9bfca\"; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);\n    ctx.beginPath(); ctx.moveTo(it.x, Tm - 42); ctx.lineTo(it.x, Tm); ctx.stroke(); ctx.setLineDash([]);\n    const xb = it.x - it.dir*2, xa = xb - it.dir*al;\n    ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = 2.4;\n    ctx.beginPath(); ctx.moveTo(xa, y); ctx.lineTo(xb - it.dir*6, y); ctx.stroke();\n    ctx.beginPath(); ctx.moveTo(xb, y); ctx.lineTo(xb - it.dir*10, y - 5.5); ctx.lineTo(xb - it.dir*10, y + 5.5); ctx.closePath(); ctx.fill();\n    ctx.textBaseline = \"middle\"; ctx.textAlign = it.dir > 0 ? \"right\" : \"left\";\n    ctx.fillText(it.t, xa - it.dir*5, y + 1);\n  }\n  ctx.restore();\n}\n\u003c/script>\n\u003cscript>\n\"use strict\";\nconst TD = 1, TMAX = 6, EPS = 1e-9;\nconst CS = [\n  {name:\"C\", col:\"#2456d6\", VL: s => 2*(1 - Math.exp(-s)), g0:\"Γ(0⁺) = −1\", lab:\"2(1 − e^(−s/τ))\"},\n  {name:\"L\", col:\"#d4442a\", VL: s => 2*Math.exp(-s), g0:\"Γ(0⁺) = +1\", lab:\"2e^(−s/τ)\"}\n];\nconst C = {fwd:\"#2456d6\", bwd:\"#d4442a\", tot:\"#141821\", mut:\"#6a7180\", grid:\"#eceef3\", axis:\"#a3a9b6\", vs:\"#7a3fd1\"};\nconst S = {c:0, t:0, playing:false, speed:0.5};\nconst EV = [0, 1, 2, 3, 4, 5, 6];\n\n/* ---------- waveforms (V+ = 1 V, matched source ⇒ single reflection) ---------- */\nconst VLs = s => s >= -EPS ? CS[S.c].VL(Math.max(s, 0)) : 0;     // load voltage, s = time since arrival\nconst Rf  = s => s >= -EPS ? VLs(s) - 1 : 0;                      // reflected wave launched at load\nconst V   = (z, t) => (t >= z*TD - EPS ? 1 : 0) + Rf(t - TD - (1 - z)*TD);\nconst VR  = (z, t) => Rf(t - TD - (1 - z)*TD);\nconst VL  = t => VLs(t - TD), VS = t => V(0, t);\n\n/* ---------- helpers ---------- */\nfunction dec(x, dp = 3){ if (Math.abs(x) \u003c 5e-10) x = 0; return (+x.toFixed(dp)).toString().replace(\"-\", \"−\"); }\nfunction setup(c){\n  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;\n  c.width = Math.round(w*dpr); c.height = Math.round(h*dpr);\n  const ctx = c.getContext(\"2d\"); ctx.setTransform(dpr,0,0,dpr,0,0); return {ctx, w, h};\n}\nfunction yAxis(ctx, r, y, x0, x1, fs = 12){\n  ctx.font = fs + \"px system-ui,sans-serif\"; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\";\n  for (let v = r.lo; v \u003c= r.hi + 1e-9; v += r.st){\n    ctx.strokeStyle = Math.abs(v) \u003c 1e-9 ? C.axis : C.grid; ctx.lineWidth = Math.abs(v) \u003c 1e-9 ? 1.4 : 1;\n    ctx.beginPath(); ctx.moveTo(x0, y(v)); ctx.lineTo(x1, y(v)); ctx.stroke();\n    ctx.fillStyle = C.mut; ctx.fillText(dec(v, 2), x0 - 6, y(v));\n  }\n}\nfunction pill(ctx, s, x, y, col, al = \"center\", fs = 13){\n  ctx.font = `600 ${fs}px system-ui,sans-serif`;\n  const w = ctx.measureText(s).width + 10, h = fs + 7, x0 = al === \"center\" ? x - w/2 : al === \"left\" ? x : x - w;\n  ctx.fillStyle = \"#fff\"; ctx.strokeStyle = col; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.roundRect(x0, y - h/2, w, h, 5); ctx.fill(); ctx.stroke();\n  ctx.fillStyle = col; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(s, x0 + w/2, y + .5);\n}\nfunction arrow(ctx, x1, y1, x2, y2, col){\n  ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();\n  const a = Math.atan2(y2 - y1, x2 - x1);\n  ctx.beginPath(); ctx.moveTo(x2, y2);\n  ctx.lineTo(x2 - 11*Math.cos(a - .42), y2 - 11*Math.sin(a - .42));\n  ctx.lineTo(x2 - 11*Math.cos(a + .42), y2 - 11*Math.sin(a + .42)); ctx.fill();\n}\n\n/* ---------- line view ---------- */\nfunction drawLine(){\n  const {ctx, w, h} = setup(document.getElementById(\"cLine\"));\n  const L = 56, Rm = 130, Tm = 50, B = 30, r = {lo:-1, hi:2.5, st:0.5};\n  const X = z => L + z*(w - L - Rm), y = v => Tm + (r.hi - v)/(r.hi - r.lo)*(h - Tm - B);\n  yAxis(ctx, r, y, L, w - Rm);\n  ctx.strokeStyle = C.tot; ctx.lineWidth = 3;\n  for (const z of [0, 1]){ ctx.beginPath(); ctx.moveTo(X(z), Tm - 4); ctx.lineTo(X(z), h - B + 4); ctx.stroke(); }\n  ctx.font = \"13px system-ui,sans-serif\"; ctx.fillStyle = C.mut; ctx.textAlign = \"center\"; ctx.textBaseline = \"top\";\n  ctx.fillText(\"z = 0 (source)\", X(0), h - B + 8); ctx.fillText(\"z = ℓ (load \" + CS[S.c].name + \")\", X(1), h - B + 8);\n  const N = 600, prof = fn => { ctx.beginPath(); let pv = fn(0); ctx.moveTo(X(0), y(pv));\n    for (let j = 1; j \u003c= N; j++){ const z = j/N, v = fn(z); if (Math.abs(v - pv) > .2) ctx.lineTo(X(z), y(pv)); ctx.lineTo(X(z), y(v)); pv = v; } };\n  prof(z => V(z, S.t)); ctx.lineTo(X(1), y(0)); ctx.lineTo(X(0), y(0)); ctx.closePath(); ctx.fillStyle = \"rgba(36,86,214,.11)\"; ctx.fill();\n  if (S.t > TD){ prof(z => VR(z, S.t)); ctx.strokeStyle = C.bwd; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);\n    ctx.font = \"600 12.5px system-ui,sans-serif\"; ctx.fillStyle = C.bwd; ctx.textAlign = \"left\"; ctx.textBaseline = \"top\"; ctx.fillText(\"- - reflected wave V⁻\", X(0) + 8, Tm + 4); }\n  prof(z => V(z, S.t)); ctx.strokeStyle = C.tot; ctx.lineWidth = 3; ctx.stroke();\n  const ya = Tm - 22;\n  const front = (xf, dir, col, txt) => {\n    ctx.setLineDash([5, 4]); ctx.strokeStyle = col; ctx.lineWidth = 1.4;\n    ctx.beginPath(); ctx.moveTo(xf, ya); ctx.lineTo(xf, h - B); ctx.stroke(); ctx.setLineDash([]);\n    arrow(ctx, xf, ya, xf + dir*34, ya, col); pill(ctx, txt, xf + dir*40, ya, col, dir > 0 ? \"left\" : \"right\", 12.5);\n  };\n  if (S.t \u003c TD) front(X(S.t/TD), 1, C.fwd, \"V⁺ = 1 V\");\n  else if (S.t \u003c 2*TD) front(X(1 - (S.t - TD)/TD), -1, C.bwd, CS[S.c].g0);\n  ctx.font = \"600 14px system-ui,sans-serif\"; ctx.textAlign = \"left\"; ctx.textBaseline = \"middle\";\n  const vl = VL(S.t); ctx.fillStyle = CS[S.c].col; ctx.fillText(\"V_L = \" + dec(vl) + \" V\", X(1) + 10, y(vl));\n  ctx.beginPath(); ctx.arc(X(1), y(vl), 5.5, 0, 7); ctx.fill();\n  ctx.fillStyle = C.vs; ctx.beginPath(); ctx.arc(X(0), y(VS(S.t)), 5.5, 0, 7); ctx.fill();\n}\n\n/* ---------- lattice ---------- */\nlet BG;\nfunction drawBounce(){\n  const {ctx, w, h} = setup(document.getElementById(\"cBounce\"));\n  const L = 56, Rm = 20, Tm = 60, B = 14;\n  const x = z => L + z*(w - L - Rm), y = t => Tm + t/TMAX*(h - Tm - B);\n  BG = {y0: Tm, y1: h - B};\n  ctx.font = \"12px system-ui,sans-serif\"; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\";\n  for (const t of EV){ ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x(0), y(t)); ctx.lineTo(x(1), y(t)); ctx.stroke();\n    ctx.fillStyle = C.mut; ctx.fillText(t + \" ns\", L - 6, y(t)); }\n  ctx.strokeStyle = C.tot; ctx.lineWidth = 3;\n  for (const z of [0, 1]){ ctx.beginPath(); ctx.moveTo(x(z), y(0)); ctx.lineTo(x(z), y(TMAX)); ctx.stroke(); }\n  ctx.font = \"12px system-ui,sans-serif\"; ctx.fillStyle = C.mut; ctx.textAlign = \"center\"; ctx.textBaseline = \"bottom\";\n  GHDR_(ctx, [{x:x(0), dir:-1, t:\"Γs = 0\", w:x(1) - x(0)}, {x:x(1), dir:1, t:\"load \" + CS[S.c].name + \": \" + CS[S.c].g0, w:x(1) - x(0)}], Tm);\n  const seg = (za, ta, zb, tb, col, lbl) => {\n    ctx.strokeStyle = col; ctx.globalAlpha = .22; ctx.lineWidth = 2;\n    ctx.beginPath(); ctx.moveTo(x(za), y(ta)); ctx.lineTo(x(zb), y(tb)); ctx.stroke(); ctx.globalAlpha = 1;\n    if (S.t > ta){ const tp = Math.min(S.t, tb), zp = za + (zb - za)*(tp - ta)/(tb - ta);\n      ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x(za), y(ta)); ctx.lineTo(x(zp), y(tp)); ctx.stroke(); }\n    pill(ctx, lbl, x((za + zb)/2), y((ta + tb)/2), col, \"center\", 12);\n  };\n  seg(0, 0, 1, TD, C.fwd, \"V⁺ = 1\");\n  seg(1, TD, 0, 2*TD, C.bwd, \"V⁻ = V_L(s) − 1\");\n  ctx.font = \"12.5px system-ui,sans-serif\"; ctx.fillStyle = C.mut; ctx.textAlign = \"center\"; ctx.textBaseline = \"top\";\n  ctx.fillText(\"absorbed at source — nothing more travels\", x(.5), y(2.3));\n  ctx.fillText(\"V_L(s) = \" + CS[S.c].lab, x(.5), y(2.3) + 20);\n  const yt = y(S.t);\n  ctx.strokeStyle = \"#e0262f\"; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);\n  ctx.beginPath(); ctx.moveTo(x(0), yt); ctx.lineTo(x(1), yt); ctx.stroke(); ctx.setLineDash([]);\n  const dot = (z, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x(z), yt, 6, 0, 7); ctx.fill(); ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2; ctx.stroke(); };\n  if (S.t \u003c TD) dot(S.t/TD, C.fwd); else if (S.t \u003c 2*TD) dot(1 - (S.t - TD)/TD, C.bwd);\n}\n\n/* ---------- time plots ---------- */\nlet TG;\nfunction plotT(c, k){\n  const {ctx, w, h} = setup(c), fn = k ? VL : VS, col = k ? CS[S.c].col : C.vs, r = {lo:0, hi:2.5, st:0.5};\n  const L = 48, Rm = 16, Tm = 24, B = 32;\n  const x = t => L + t/TMAX*(w - L - Rm), y = v => Tm + (r.hi - v)/(r.hi - r.lo)*(h - Tm - B);\n  TG = {x0: L, x1: w - Rm};\n  yAxis(ctx, r, y, L, w - Rm, 11.5);\n  ctx.font = \"11.5px system-ui,sans-serif\"; ctx.fillStyle = C.mut; ctx.textAlign = \"center\"; ctx.textBaseline = \"top\";\n  for (const t of EV){ ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x(t), Tm); ctx.lineTo(x(t), h - B); ctx.stroke();\n    ctx.fillText(t + (t === TMAX ? \" ns\" : \"\"), x(t), h - B + 4); }\n  const path = () => { ctx.beginPath(); let pv = fn(0); ctx.moveTo(x(0), y(pv));\n    for (let j = 1; j \u003c= 1500; j++){ const t = j/1500*TMAX, v = fn(t); if (Math.abs(v - pv) > .2) ctx.lineTo(x(t), y(pv)); ctx.lineTo(x(t), y(v)); pv = v; } };\n  ctx.strokeStyle = col; ctx.globalAlpha = .22; ctx.lineWidth = 3; path(); ctx.stroke(); ctx.globalAlpha = 1;\n  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, x(S.t), h); ctx.clip(); ctx.lineWidth = 3.2; path(); ctx.stroke(); ctx.restore();\n  ctx.font = \"600 14px system-ui,sans-serif\"; ctx.fillStyle = col; ctx.textAlign = \"left\"; ctx.textBaseline = \"top\";\n  ctx.fillText(k ? \"V_L(t)\" : \"V_s(t) = V_L(t − t_d)  for t > 2t_d\", L + 6, 2);\n  const xc = x(S.t), v = fn(S.t);\n  ctx.strokeStyle = \"#e0262f\"; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);\n  ctx.beginPath(); ctx.moveTo(xc, Tm); ctx.lineTo(xc, h - B); ctx.stroke(); ctx.setLineDash([]);\n  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(xc, y(v), 5, 0, 7); ctx.fill(); ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2; ctx.stroke();\n  pill(ctx, dec(v) + \" V\", xc + (xc \u003c w - 110 ? 10 : -10), y(v) - 16, col, xc \u003c w - 110 ? \"left\" : \"right\", 12);\n}\n\n/* ---------- ui ---------- */\nconst $ = id => document.getElementById(id);\nfunction render(){\n  $(\"tr\").textContent = \"t = \" + S.t.toFixed(3) + \" ns\"; $(\"ts\").value = S.t;\n  $(\"bPlay\").textContent = S.playing ? \"❚❚\" : \"▶\";\n  document.querySelectorAll(\".case\").forEach(b => b.classList.toggle(\"on\", +b.dataset.c === S.c));\n  document.querySelectorAll(\".ld\").forEach(g => g.style.display = +g.dataset.c === S.c ? \"\" : \"none\");\n  drawLine(); drawBounce();\n  document.querySelectorAll(\".tp\").forEach(c => plotT(c, +c.dataset.k));\n}\nfunction setT(t){ S.t = Math.min(Math.max(t, 0), TMAX); render(); }\nlet last = null;\nfunction tick(ts){\n  if (!S.playing){ last = null; return; }\n  if (last !== null){ let t = S.t + (ts - last)/1000*S.speed; if (t >= TMAX){ t = TMAX; S.playing = false; } S.t = t; render(); }\n  last = ts; requestAnimationFrame(tick);\n}\nfunction play(on){ S.playing = on === undefined ? !S.playing : on; if (S.playing){ if (S.t >= TMAX - 1e-6) S.t = 0; requestAnimationFrame(tick); } render(); }\nconst next = () => { play(false); const e = EV.find(t => t > S.t + 1e-6); setT(e === undefined ? TMAX : e); };\nconst prev = () => { play(false); const e = [...EV].reverse().find(t => t \u003c S.t - 1e-6); setT(e === undefined ? 0 : e); };\nconst setCase = c => { S.c = c; render(); };\n$(\"bPlay\").onclick = () => play(); $(\"bNext\").onclick = next; $(\"bPrev\").onclick = prev;\n$(\"ts\").oninput = e => { play(false); setT(+e.target.value); };\ndocument.querySelectorAll(\".case\").forEach(b => b.onclick = () => setCase(+b.dataset.c));\nfunction drag(c, fn){\n  let d = false; const go = e => { const r = c.getBoundingClientRect(); fn(e.clientX - r.left, e.clientY - r.top); };\n  c.addEventListener(\"pointerdown\", e => { d = true; play(false); c.setPointerCapture(e.pointerId); go(e); });\n  c.addEventListener(\"pointermove\", e => d && go(e)); c.addEventListener(\"pointerup\", () => d = false);\n}\ndrag($(\"cBounce\"), (x, y) => setT((y - BG.y0)/(BG.y1 - BG.y0)*TMAX));\ndocument.querySelectorAll(\".tp\").forEach(c => drag(c, x => setT((x - TG.x0)/(TG.x1 - TG.x0)*TMAX)));\ndocument.addEventListener(\"keydown\", e => {\n  if (e.code === \"Space\"){ e.preventDefault(); play(); }\n  else if (e.key === \"ArrowRight\"){ e.preventDefault(); e.shiftKey ? setT(S.t + .01) : next(); }\n  else if (e.key === \"ArrowLeft\"){ e.preventDefault(); e.shiftKey ? setT(S.t - .01) : prev(); }\n  else if (e.key === \"1\" || e.key === \"2\") setCase(+e.key - 1);\n});\nwindow.addEventListener(\"resize\", render);\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n",
"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Example · Series shorted stub\u003c/title>\n\u003cstyle>\n:root{--ink:#141821;--mut:#6a7180;--line:#e4e6ec;--acc:#2456d6;--math:\"Cambria Math\",\"STIX Two Math\",\"Times New Roman\",serif}\n*{box-sizing:border-box}\nbody{margin:0;background:#fff;color:var(--ink);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\n.wrap{max-width:1300px;margin:0 auto;padding:22px 28px 60px}\n.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}\nh1{font-size:22px;margin:0 12px 0 0}\n.given{color:var(--mut);font-size:15px}\n.stmt{font-size:17px;margin:0 0 12px;max-width:1000px}\n.stmt i{font-family:var(--math)}\n.circ{display:block;margin:0 auto 10px;width:100%;max-width:660px}\nbutton{font:inherit;font-size:15px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;color:var(--ink)}\nbutton:hover{background:#f3f4f7}\n.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}\n#ts{flex:1;accent-color:var(--acc)}\n#tr{font-variant-numeric:tabular-nums;font-weight:600;min-width:118px;text-align:right}\ncanvas{display:block;width:100%}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}\n.col{display:flex;flex-direction:column;gap:6px}\n@media(max-width:900px){.two{grid-template-columns:1fr}}\nhr{border:0;border-top:1px solid var(--line);margin:30px 0 22px}\n.eq{font-family:var(--math);font-size:20px;text-align:center;margin:8px 0;line-height:2.2}\n.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 3px}\n.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}\n.fr>span:last-child{padding:0 4px}\n.box{border:2px solid var(--acc);border-radius:7px;padding:2px 12px}\n.note{font-size:14.5px;color:var(--mut);text-align:c splay:flex;align-items:center;justify-content:center;gap:1.2em;flex-wrap:nowrap;margin:0}\n.circ{display:block;margin:0 auto;width:100%;height:auto;max-width:var(--cw,36em);flex:0 1 auto}\n.figs .circ{margin:0;max-width:none;flex:1.9 1 0;min-width:0}\n.figs .tdr,.figs .vsfig{max-width:none;flex:1 1 0;min-width:0;height:auto}\n.sol{border-top:1px solid var(--line);padding-top:.35em;display:flex;flex-direction:column}\n.sol .eq{font-size:1.2em;line-height:1.9;margin:.18em 0;text-align:center}\n.eq{font-family:var(--math)}\n.sol .eq b{font-size:.85em}\nsub,sup{line-height:0}\n.fr{line-height:1.2;margin:0 .12em}\n.fr>span:first-child{border-bottom:.075em solid currentColor;padding:0 .2em .05em}\n.fr>span:last-child{padding:.05em .2em 0}\n.box{display:inline-block;vertical-align:middle;line-height:1.3;border:2px solid var(--acc);border-radius:.35em;padding:.12em .45em;margin:.12em 0;white-space:nowrap}\n.sol table{font-size:.9em;margin:.45em auto}\n.sol th,.sol td{padding:.28em .75em}\n.sol th{font-size:.92em}\n.sol h3{font-size:1em;margin:.6em 0 .05em}\n.sol .note{font-size:.85em;margin:.2em 0}\n.sol>p{margin:.2em 0}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\" style=\"--lw:40%;--cw:38.8em\">\n\u003cdiv class=\"top\">\n  \u003ch1>Example · Series shorted stub\u003c/h1>\n  \u003cspan class=\"given\">2 V step, R\u003csub>s\u003c/sub> = 50 Ω · all lines Z\u003csub>0\u003c/sub> = 50 Ω, delay t\u003csub>d\u003c/sub> · R\u003csub>L\u003c/sub> = 50 Ω\u003c/span>\n\u003c/div>\n\u003cdiv class=\"main\">\n\u003csection class=\"left\">\n\u003cp class=\"stmt\">A 2-V step source with source resistance \u003ci>R\u003c/i>\u003csub>s\u003c/sub> = 50 Ω drives a 50-Ω line of one-way delay \u003ci>t\u003c/i>\u003csub>d\u003c/sub>. At the end of this line, a short-circuited 50-Ω stub (delay \u003ci>t\u003c/i>\u003csub>d\u003c/sub>) is connected \u003cb>in series\u003c/b> with the upper conductor, followed by a second 50-Ω line (delay \u003ci>t\u003c/i>\u003csub>d\u003c/sub>) terminated in \u003ci>R\u003c/i>\u003csub>L\u003c/sub> = 50 Ω. All lines are initially uncharged and the source switches on at \u003ci>t\u003c/i> = 0. Sketch the load voltage \u003ci>V\u003c/i>\u003csub>L\u003c/sub>(\u003ci>t\u003c/i>) for 0 ≤ \u003ci>t\u003c/i> ≤ 7\u003ci>t\u003c/i>\u003csub>d\u003c/sub>.\u003c/p>\n\u003csvg class=\"circ\" viewBox=\"0 0 700 300\" font-family=\"system-ui,sans-serif\">\n  \u003cg stroke=\"#141821\" stroke-width=\"2\" fill=\"none\">\n    \u003ccircle cx=\"50\" cy=\"215\" r=\"24\"/>\n    \u003cpath d=\"M40 223 H50 V205 H60\" stroke-width=\"1.8\"/>\n    \u003cpath d=\"M50 191 V150 H78 l5 -8 l10 16 l10 -16 l10 16 l10 -16 l5 8 H146\"/>\n    \u003cpath d=\"M50 239 V280 H146\"/>\n    \u003cpath d=\"M154 150 H330\" stroke-width=\"3\"/>\n    \u003cpath d=\"M370 150 H596\" stroke-width=\"3\"/>\n    \u003cpath d=\"M154 280 H596\" stroke-width=\"3\"/>\n    \u003cpath d=\"M330 150 V40\" stroke-width=\"3\"/>\u003cpath d=\"M370 150 V40\" stroke-width=\"3\"/>\n    \u003cpath d=\"M330 40 H370\" stroke-width=\"3\"/>\n    \u003cpath d=\"M600 150 H630 V180 l10 6 l-20 10 l20 10 l-20 10 l20 10 l-20 10 l10 6 V280 H600\"/>\n  \u003c/g>\n  \u003cg fill=\"#fff\" stroke=\"#141821\" stroke-width=\"2\">\n    \u003ccircle cx=\"150\" cy=\"150\" r=\"4\"/>\u003ccircle cx=\"150\" cy=\"280\" r=\"4\"/>\n    \u003ccircle cx=\"330\" cy=\"150\" r=\"4\"/>\u003ccircle cx=\"370\" cy=\"150\" r=\"4\"/>\n    \u003ccircle cx=\"600\" cy=\"150\" r=\"4\"/>\u003ccircle cx=\"600\" cy=\"280\" r=\"4\"/>\n  \u003c/g>\n  \u003ctext x=\"50\" y=\"185\" text-anchor=\"middle\" font-size=\"15\">+\u003c/text>\n  \u003ctext x=\"50\" y=\"257\" text-anchor=\"middle\" font-size=\"15\">−\u003c/text>\n  \u003ctext x=\"22\" y=\"211\" font-size=\"14\" text-anchor=\"end\">2 V\u003c/text>\n  \u003ctext x=\"22\" y=\"230\" font-size=\"14\" text-anchor=\"end\">0\u003c/text>\n  \u003ctext x=\"98\" y=\"132\" text-anchor=\"middle\" font-size=\"14\">50 Ω\u003c/text>\n  \u003ctext x=\"240\" y=\"220\" text-anchor=\"middle\" font-size=\"15\">50 Ω, t\u003ctspan font-size=\"11\" dy=\"3\">d\u003c/tspan>\u003c/text>\n  \u003ctext x=\"485\" y=\"220\" text-anchor=\"middle\" font-size=\"15\">50 Ω, t\u003ctspan font-size=\"11\" dy=\"3\">d\u003c/tspan>\u003c/text>\n  \u003ctext x=\"385\" y=\"90\" font-size=\"15\">50 Ω, t\u003ctspan font-size=\"11\" dy=\"3\">d\u003c/tspan>\u003c/text>\n  \u003ctext x=\"385\" y=\"110\" font-size=\"13\" fill=\"#6a7180\">series stub\u003c/text>\n  \u003ctext x=\"350\" y=\"30\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6a7180\">short\u003c/text>\n  \u003ctext x=\"652\" y=\"226\" font-size=\"14\">50 Ω\u003c/text>\n  \u003ctext x=\"612\" y=\"176\" font-size=\"15\">+\u003c/text>\n  \u003ctext x=\"604\" y=\"226\" font-size=\"15\" font-style=\"italic\" text-anchor=\"end\">V\u003ctspan font-size=\"11\" dy=\"4\">L\u003c/tspan>\u003c/text>\n  \u003ctext x=\"612\" y=\"272\" font-size=\"16\">−\u003c/text>\n\u003c/svg>\n\u003cdiv class=\"sol\">\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003ci>V\u003c/i>\u003csup>+\u003c/sup> = 2 · \u003cspan class=\"fr\">\u003cspan>50\u003c/span>\u003cspan>50 + 50\u003c/span>\u003c/span> = 1 V\u003c/span> \u003cspan class=\"sg gap\">\u003ci>Γ\u003c/i>\u003csub>s\u003c/sub> = \u003ci>Γ\u003c/i>\u003csub>L\u003c/sub> = 0\u003c/span> \u003cspan class=\"sg gap\">short:&ensp;\u003ci>Γ\u003c/i> = −1\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap lbl\">series junction — any line sees the other two \u003cb style=\"font-family:system-ui;font-weight:600\">in series\u003c/b>:\u003c/span> \u003cspan class=\"sg arr\">50 + 50 = 100 Ω\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003ci>Γ\u003c/i> = \u003cspan class=\"fr\">\u003cspan>100 − 50\u003c/span>\u003cspan>100 + 50\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan>1\u003c/span>\u003cspan>3\u003c/span>\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">from line 1:&ensp;(1 + \u003ci>Γ\u003c/i>)\u003ci>V\u003c/i>\u003csup>+\u003c/sup> = \u003cspan class=\"fr\">\u003cspan>4\u003c/span>\u003cspan>3\u003c/span>\u003c/span> splits equally\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003cspan class=\"fr\">\u003cspan>2\u003c/span>\u003cspan>3\u003c/span>\u003c/span> V into stub, \u003cspan class=\"fr\">\u003cspan>2\u003c/span>\u003cspan>3\u003c/span>\u003c/span> V into line 2\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">from stub (wave \u003ci>u\u003c/i>):&ensp;Δ\u003ci>v\u003c/i>\u003csub>2\u003c/sub> = −\u003cspan class=\"fr\">\u003cspan>2\u003c/span>\u003cspan>3\u003c/span>\u003c/span>\u003ci>u\u003c/i>,\u003c/span> \u003cspan class=\"sg arr\">Δ\u003ci>v\u003c/i>\u003csub>1\u003c/sub> = +\u003cspan class=\"fr\">\u003cspan>2\u003c/span>\u003cspan>3\u003c/span>\u003c/span>\u003ci>u\u003c/i>,\u003c/span> \u003cspan class=\"sg arr\">reflected \u003cspan class=\"fr\">\u003cspan>1\u003c/span>\u003cspan>3\u003c/span>\u003c/span>\u003ci>u\u003c/i>\u003c/span>\u003c/div>\n\u003cp class=\"note\">Stub voltage sign: V\u003csub>1\u003c/sub> = V\u003csub>stub\u003c/sub> + V\u003csub>2\u003c/sub> at the junction (KVL), same current in all three lines.\u003c/p>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">stub returns:&ensp;\u003ci>u\u003c/i> = −\u003cspan class=\"fr\">\u003cspan>2\u003c/span>\u003cspan>3\u003c/span>\u003c/span> (3\u003ci>t\u003c/i>\u003csub>d\u003c/sub>)\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;+\u003cspan class=\"fr\">\u003cspan>4\u003c/span>\u003cspan>9\u003c/span>\u003c/span> to load;\u003c/span> \u003cspan class=\"sg gap\">\u003ci>u\u003c/i> = +\u003cspan class=\"fr\">\u003cspan>2\u003c/span>\u003cspan>9\u003c/span>\u003c/span> (5\u003ci>t\u003c/i>\u003csub>d\u003c/sub>)\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;−\u003cspan class=\"fr\">\u003cspan>4\u003c/span>\u003cspan>27\u003c/span>\u003c/span> to load\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"right\">\n\u003cdiv class=\"bar\">\n  \u003cbutton id=\"bPrev\">◀\u003c/button>\n  \u003cbutton id=\"bPlay\" style=\"min-width:44px\">▶\u003c/button>\n  \u003cbutton id=\"bNext\">▶|\u003c/button>\n  \u003cinput type=\"range\" id=\"ts\" min=\"0\" max=\"7\" step=\"0.001\" value=\"0\">\n  \u003cspan id=\"tr\">t = 0.000 t\u003csub>d\u003c/sub>\u003c/span>\n\u003c/div>\n\u003cdiv class=\"cv line\">\u003ccanvas id=\"cLine\">\u003c/canvas>\u003c/div>\n\u003cdiv class=\"two\">\n  \u003cdiv class=\"cv\" style=\"flex:500 1 0\">\u003ccanvas id=\"cBounce\" style=\"cursor:ns-resize\">\u003c/canvas>\u003c/div>\n  \u003cdiv class=\"col\">\n    \u003cdiv class=\"cv\" style=\"flex:247 1 0\">\u003ccanvas class=\"tp\" data-k=\"0\" style=\"cursor:ew-resize\">\u003c/canvas>\u003c/div>\n    \u003cdiv class=\"cv\" style=\"flex:247 1 0\">\u003ccanvas class=\"tp\" data-k=\"1\" style=\"cursor:ew-resize\">\u003c/canvas>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c/section>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  /* shrink/grow the left column so statement + figure + solution always fit without scrolling */\n  const L = document.querySelector(\".left\");\n  function fits(){ return L.scrollHeight \u003c= L.clientHeight + 1 && L.scrollWidth \u003c= L.clientWidth + 1; }\n  function fit(){\n    let lo = 9, hi = 23;\n    for (let i = 0; i \u003c 14; i++){ const m = (lo + hi)/2; L.style.fontSize = m + \"px\"; if (fits()) lo = m; else hi = m; }\n    L.style.fontSize = lo + \"px\";\n    document.documentElement.dataset.fs = lo.toFixed(2);\n  }\n  window.__fit = fit;\n  fit();\n  if (document.fonts){ document.fonts.ready.then(() => { fit(); window.dispatchEvent(new Event(\"resize\")); }); }\n  window.addEventListener(\"resize\", fit);\n  /* slide navigation keys go to the deck */\n  const NAV = [\"PageDown\",\"PageUp\",\"ArrowDown\",\"ArrowUp\",\"Home\",\"End\",\"f\",\"F\",\"l\",\"L\"];\n  document.addEventListener(\"keydown\", e => {\n    if (!NAV.includes(e.key) || e.ctrlKey || e.metaKey || e.altKey) return;\n    e.preventDefault(); e.stopImmediatePropagation();\n    parent.postMessage({deckKey: e.key}, \"*\");\n  }, true);\n})();\n\u003c/script>\n\u003cscript>\n/* laser pointer: glowing red dot + short fading trail that follows the mouse (toggle with L) */\n(function(){\n  const cv = document.createElement(\"canvas\");\n  cv.style.cssText = \"position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:2147483647\";\n  const st = document.createElement(\"style\");\n  st.textContent = \"html.laser-on, html.laser-on *{cursor:none !important}\";\n  document.head.appendChild(st);\n  const add = () => document.body.appendChild(cv);\n  document.body ? add() : addEventListener(\"DOMContentLoaded\", add);\n  const ctx = cv.getContext(\"2d\");\n  let on = true, pts = [], cur = null, raf = 0, W = 0, H = 0;\n  const TRAIL = 260;\n  function size(){ const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = Math.round(W*d); cv.height = Math.round(H*d); ctx.setTransform(d, 0, 0, d, 0, 0); }\n  size(); addEventListener(\"resize\", () => { size(); draw(); });\n  function dot(x, y){\n    const g = ctx.createRadialGradient(x, y, 0, x, y, 20);\n    g.addColorStop(0, \"rgba(255,40,40,.55)\"); g.addColorStop(.45, \"rgba(255,30,30,.22)\"); g.addColorStop(1, \"rgba(255,0,0,0)\");\n    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill();\n    ctx.fillStyle = \"#ff1f1f\"; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill();\n    ctx.fillStyle = \"rgba(255,235,235,.95)\"; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 7); ctx.fill();\n  }\n  function draw(){\n    raf = 0;\n    ctx.clearRect(0, 0, W, H);\n    if (!on) return;\n    const now = performance.now();\n    pts = pts.filter(p => now - p.t \u003c TRAIL);\n    ctx.lineCap = \"round\"; ctx.lineJoin = \"round\";\n    for (let i = 1; i \u003c pts.length; i++){\n      const a = 1 - (now - pts[i].t)/TRAIL;\n      ctx.strokeStyle = `rgba(255,30,30,${(.55*a).toFixed(3)})`; ctx.lineWidth = 1 + 7*a;\n      ctx.beginPath(); ctx.moveTo(pts[i-1].x, pts[i-1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();\n    }\n    if (cur) dot(cur.x, cur.y);\n    if (pts.length > 1) raf = requestAnimationFrame(draw);\n  }\n  const kick = () => { if (!raf) raf = requestAnimationFrame(draw); };\n  addEventListener(\"pointermove\", e => {\n    if (!on) return;\n    cur = {x: e.clientX, y: e.clientY}; pts.push({x: cur.x, y: cur.y, t: performance.now()}); kick();\n  }, true);\n  const hide = () => { cur = null; pts = []; kick(); };\n  document.addEventListener(\"mouseleave\", hide);\n  document.addEventListener(\"mouseout\", e => { if (!e.relatedTarget || e.relatedTarget.tagName === \"IFRAME\") hide(); });\n  window.__laser = v => { on = v; document.documentElement.classList.toggle(\"laser-on\", on); if (!on) hide(); kick(); };\n  window.__laser(true);\n  addEventListener(\"message\", e => { if (e.data && typeof e.data.laser === \"boolean\") window.__laser(e.data.laser); });\n})();\n\u003c/script>\n\u003cscript>\n/* bounce-diagram amplitude labels: placed along their own wave line, never on top of another label or a crossing */\nlet PQL_ = [];\nfunction PQ_(ctx, s, xa, ya, xb, yb, col, fs, ymax){ PQL_.push({s, xa, ya, xb, yb, col, fs, ymax}); }\nfunction PQF_(ctx){\n  const segs = PQL_.map(it => { let xb = it.xb, yb = it.yb; if (yb > it.ymax){ const f = (it.ymax - it.ya)/(yb - it.ya); xb = it.xa + (xb - it.xa)*f; yb = it.ymax; } return [it.xa, it.ya, xb, yb]; });\n  const hit = (r, s) => { // Liang-Barsky segment / rectangle test\n    let t0 = 0, t1 = 1; const dx = s[2] - s[0], dy = s[3] - s[1];\n    for (const [p, q] of [[-dx, s[0] - r.x0], [dx, r.x1 - s[0]], [-dy, s[1] - r.y0], [dy, r.y1 - s[1]]]){\n      if (Math.abs(p) \u003c 1e-12){ if (q \u003c 0) return false; continue; }\n      const t = q/p; if (p \u003c 0){ if (t > t1) return false; if (t > t0) t0 = t; } else { if (t \u003c t0) return false; if (t \u003c t1) t1 = t; } }\n    return true; };\n  const F = [0.5, 0.38, 0.62, 0.28, 0.72, 0.44, 0.56, 0.2, 0.8, 0.33, 0.67];\n  const placed = [];\n  PQL_.forEach((it, i) => {\n    ctx.font = `600 ${it.fs}px system-ui,sans-serif`;\n    const w = ctx.measureText(it.s).width + 10, h = it.fs + 7;\n    let best = null, bestS = Infinity;\n    for (const f of F){\n      const cx = it.xa + (it.xb - it.xa)*f, cy = it.ya + (it.yb - it.ya)*f;\n      if (cy + h/2 > it.ymax + 3) continue;\n      const r = {x0: cx - w/2 - 2, x1: cx + w/2 + 2, y0: cy - h/2 - 2, y1: cy + h/2 + 2};\n      let sc = 0;\n      for (const q of placed){ const ox = Math.min(r.x1, q.x1) - Math.max(r.x0, q.x0), oy = Math.min(r.y1, q.y1) - Math.max(r.y0, q.y0); if (ox > 0 && oy > 0) sc += 1000 + ox*oy; }\n      segs.forEach((s, j) => { if (j !== i && hit(r, s)) sc += 60; });\n      sc += Math.abs(f - 0.5)*20;\n      if (sc \u003c bestS){ bestS = sc; best = {cx, cy, r}; }\n    }\n    if (!best) return;\n    placed.push(best.r); pill(ctx, it.s, best.cx, best.cy, it.col, \"center\", it.fs);\n  });\n  PQL_ = [];\n}\n\u003c/script>\n\u003cscript>\n/* z-diagram for branched networks: every line gets its own panel, so profiles never sit on top of each other */\nfunction GLINE_(cfg){\n  const {ctx, w, h} = setup(document.getElementById(\"cLine\"));\n  const order = cfg.order, D = cfg.D || (() => 1), lo = cfg.lo, hi = cfg.hi, st = cfg.st;\n  const fm = v => { if (Math.abs(v) \u003c 5e-10) return \"0\";\n    if (cfg.fmt === \"frac\") for (let d = 1; d \u003c= 729; d++){ const n = Math.round(Math.abs(v)*d);\n      if (Math.abs(n/d - Math.abs(v)) \u003c 1e-9){ const s = n + (d > 1 ? \"/\" + d : \"\"); if (s.length \u003c= 7) return (v \u003c 0 ? \"−\" : \"\") + s; break; } }\n    return (+v.toFixed(4)).toString().replace(\"-\", \"−\"); };\n  const sgn = v => (v > 0 ? \"+\" : \"\") + fm(v);\n  const panelOf = ln => ln;\n  // rows needed for travelling-front labels (max simultaneous fronts in one panel over the whole run)\n  let rows = 1;\n  for (let j = 0; j \u003c= 300; j++){ const cnt = {}; for (const f of fronts(j/300*TMAX)){ cnt[f.ln] = (cnt[f.ln] || 0) + 1; rows = Math.max(rows, cnt[f.ln]); } }\n  rows += 1;\n  const L = 50, Rm = cfg.rm || 14, B = 44, gap = 30, Tm = 14 + 24*rows;\n  const totD = order.reduce((s, ln) => s + D(ln), 0), unit = (w - L - Rm - gap*(order.length - 1))/totD;\n  const px = {}, pw = {}; let xx = L;\n  for (const ln of order){ px[ln] = xx; pw[ln] = unit*D(ln); xx += pw[ln] + gap; }\n  const y = v => Tm + (hi - v)/(hi - lo)*(h - Tm - B);\n  const tint = c => { if (c === \"#141821\") return \"rgba(36,86,214,.12)\"; const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},.14)`; };\n  // y axis labels + per-panel grid\n  ctx.font = \"12px system-ui,sans-serif\"; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\"; ctx.fillStyle = \"#6a7180\";\n  for (let v = lo; v \u003c= hi + 1e-9; v += st) ctx.fillText((+v.toFixed(3)).toString().replace(\"-\", \"−\"), L - 8, y(v));\n  for (const ln of order){\n    const x0 = px[ln], x1 = x0 + pw[ln], col = cfg.col(ln);\n    for (let v = lo; v \u003c= hi + 1e-9; v += st){ ctx.strokeStyle = Math.abs(v) \u003c 1e-9 ? \"#a3a9b6\" : \"#eceef3\"; ctx.lineWidth = Math.abs(v) \u003c 1e-9 ? 1.3 : 1;\n      ctx.beginPath(); ctx.moveTo(x0, y(v)); ctx.lineTo(x1, y(v)); ctx.stroke(); }\n    // profile\n    const N = 500, pts = []; for (let j = 0; j \u003c= N; j++) pts.push(V(ln, j/N, S.t));\n    const path = first => { first ? ctx.lineTo(x0, y(pts[0])) : ctx.moveTo(x0, y(pts[0]));\n      for (let j = 1; j \u003c= N; j++){ const xj = x0 + j/N*pw[ln]; if (Math.abs(pts[j] - pts[j-1]) > 1e-12) ctx.lineTo(xj, y(pts[j-1])); ctx.lineTo(xj, y(pts[j])); } };\n    ctx.beginPath(); ctx.moveTo(x0, y(0)); path(true); ctx.lineTo(x1, y(0)); ctx.closePath(); ctx.fillStyle = tint(col); ctx.fill();\n    ctx.beginPath(); path(); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();\n    // boundaries\n    ctx.strokeStyle = col; ctx.lineWidth = 3;\n    for (const xb of [x0, x1]){ ctx.beginPath(); ctx.moveTo(xb, Tm - 4); ctx.lineTo(xb, h - B + 4); ctx.stroke(); }\n    // plateau labels\n    ctx.font = \"600 13.5px system-ui,sans-serif\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"bottom\"; ctx.fillStyle = col;\n    let s0 = 0;\n    for (let j = 1; j \u003c= N + 1; j++){\n      if (j === N + 1 || Math.abs(pts[j] - pts[s0]) > 1e-12){\n        const a = s0/N, b = (j - 1)/N, tw = ctx.measureText(fm(pts[s0])).width;\n        if ((b - a)*pw[ln] > tw + 10) ctx.fillText(fm(pts[s0]), x0 + (a + b)/2*pw[ln], y(pts[s0]) - 5);\n        s0 = j;\n      }\n    }\n    // node names + title\n    const nd = cfg.nodes(ln);\n    ctx.textBaseline = \"top\";\n    [0, 1].forEach(e => {\n      const o = cfg.out.find(q => q.ln === ln && q.x === e);\n      let t = nd[e], fs = 12.5;\n      ctx.fillStyle = o ? o.c : \"#141821\";\n      if (o) t = (nd[e] ? nd[e] + \":  \" : \"\") + o.n + \" = \" + fm(V(ln, e, S.t)) + \" V\";\n      do { ctx.font = (o ? \"700 \" : \"600 \") + fs + \"px system-ui,sans-serif\"; fs -= 0.5; } while (o && ctx.measureText(t).width > pw[ln]*0.78 && fs > 9);\n      ctx.textAlign = e ? \"right\" : \"left\"; ctx.fillText(t, e ? x1 - 3 : x0 + 3, h - B + 6);\n    });\n    ctx.font = \"600 13px system-ui,sans-serif\"; ctx.fillStyle = col === \"#141821\" ? \"#4a5160\" : col; ctx.textAlign = \"center\";\n    ctx.fillText(cfg.name(ln), x0 + pw[ln]/2, h - B + 24);\n  }\n  // travelling fronts: each label goes to the first header row where it collides with nothing\n  const taken = [];\n  for (const f of fronts(S.t)){\n    const col = f.dir > 0 ? \"#2456d6\" : \"#d4442a\", xf = px[f.ln] + f.x*pw[f.ln];\n    const s = (cfg.pre ? cfg.pre(f.ln) : \"\") + sgn(f.amp) + \" V\";\n    ctx.font = \"600 12.5px system-ui,sans-serif\"; const pwd = ctx.measureText(s).width + 10;\n    let xp = xf + f.dir*34, al = f.dir > 0 ? \"left\" : \"right\";\n    if (f.dir > 0 && xp + pwd > w - 2){ xp = xf - 6; al = \"right\"; }\n    if (f.dir \u003c 0 && xp - pwd \u003c   if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (["PageDown","PageUp","ArrowDown","ArrowUp","Home","End","f","F","l","L"].includes(e.key)){ e.preventDefault(); key(e.key); }
  else if (["ArrowLeft","ArrowRight"," ","1","2","3"].includes(e.key)){
    /* focus was on the deck bar: hand the key to the current slide */
    e.preventDefault();
    try { const w = frames[cur].contentWindow; w.focus();
      w.document.dispatchEvent(new w.KeyboardEvent("keydown", {key: e.key, code: e.code, shiftKey: e.shiftKey, bubbles: true})); } catch (err) {}
  }
});
document.getElementById("pv").onclick = () => go(cur - 1);
document.getElementById("nx").onclick = () => go(cur + 1);
document.getElementById("lz").onclick = () => { setLaser(!laserOn); go(cur); };
document.getElementById("fs").onclick = () => { fullscreen(); go(cur); };
document.addEventListener("fullscreenchange", () => go(cur));
go((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
<script>
/* laser pointer: glowing red dot + short fading trail that follows the mouse (toggle with L) */
(function(){
  const cv = document.createElement("canvas");
  cv.style.cssText = "position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:2147483647";
  const st = document.createElement("style");
  st.textContent = "html.laser-on, html.laser-on *{cursor:none !important}";
  document.head.appendChild(st);
  const add = () => document.body.appendChild(cv);
  document.body ? add() : addEventListener("DOMContentLoaded", add);
  const ctx = cv.getContext("2d");
  let on = true, pts = [], cur = null, raf = 0, W = 0, H = 0;
  const TRAIL = 260;
  function size(){ const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = Math.round(W*d); cv.height = Math.round(H*d); ctx.setTransform(d, 0, 0, d, 0, 0); }
  size(); addEventListener("resize", () => { size(); draw(); });
  function dot(x, y){
    const g = ctx.createRadialGradient(x, y, 0, x, y, 20);
    g.addColorStop(0, "rgba(255,40,40,.55)"); g.addColorStop(.45, "rgba(255,30,30,.22)"); g.addColorStop(1, "rgba(255,0,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill();
    ctx.fillStyle = "#ff1f1f"; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,235,235,.95)"; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 7); ctx.fill();
  }
  function draw(){
    raf = 0;
    ctx.clearRect(0, 0, W, H);
    if (!on) return;
    const now = performance.now();
    pts = pts.filter(p => now - p.t < TRAIL);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (let i = 1; i < pts.length; i++){
      const a = 1 - (now - pts[i].t)/TRAIL;
      ctx.strokeStyle = `rgba(255,30,30,${(.55*a).toFixed(3)})`; ctx.lineWidth = 1 + 7*a;
      ctx.beginPath(); ctx.moveTo(pts[i-1].x, pts[i-1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
    }
    if (cur) dot(cur.x, cur.y);
    if (pts.length > 1) raf = requestAnimationFrame(draw);
  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(draw); };
  addEventListener("pointermove", e => {
    if (!on) return;
    cur = {x: e.clientX, y: e.clientY}; pts.push({x: cur.x, y: cur.y, t: performance.now()}); kick();
  }, true);
  const hide = () => { cur = null; pts = []; kick(); };
  document.addEventListener("mouseleave", hide);
  document.addEventListener("mouseout", e => { if (!e.relatedTarget || e.relatedTarget.tagName === "IFRAME") hide(); });
  window.__laser = v => { on = v; document.documentElement.classList.toggle("laser-on", on); if (!on) hide(); kick(); };
  window.__laser(true);
  addEventListener("message", e => { if (e.data && typeof e.data.laser === "boolean") window.__laser(e.data.laser); });
})();
</script>
