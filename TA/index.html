r(--math);font-size:1.06em}\n.figs{display:flex;align-items:center;justify-content:center;gap:1.2em;flex-wrap:nowrap;margin:0}\n.circ{display:block;margin:0 auto;width:100%;height:auto;max-width:var(--cw,36em);flex:0 1 auto}\n.figs .circ{margin:0;max-width:none;flex:1.9 1 0;min-width:0}\n.figs .tdr,.figs .vsfig{max-width:none;flex:1 1 0;min-width:0;height:auto}\n.sol{border-top:1px solid var(--line);padding-top:.35em;display:flex;flex-direction:column}\n.sol .eq{font-size:1.2em;line-height:1.9;margin:.18em 0;text-align:center}\n.eq{font-family:var(--math)}\n.sol .eq b{font-size:.85em}\nsub,sup{line-height:0}\n.fr{line-height:1.2;margin:0 .12em}\n.fr>span:first-child{border-bottom:.075em solid currentColor;padding:0 .2em .05em}\n.fr>span:last-child{padding:.05em .2em 0}\n.box{display:inline-block;vertical-align:middle;line-height:1.3;border:2px solid var(--acc);border-radius:.35em;padding:.12em .45em;margin:.12em 0;white-space:nowrap}\n.sol table{font-size:.9em;margin:.45em auto}\n.sol th,.sol td{padding:.28em .75em}\n.sol th{font-size:.92em}\n.sol h3{font-size:1em;margin:.6em 0 .05em}\n.sol .note{font-size:.85em;margin:.2em 0}\n.sol>p{margin:.2em 0}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\" style=\"--lw:44%;--cw:37.6em\">\n\u003cdiv class=\"top\">\n  \u003ch1>2-10 · Time-domain reflectometry (TDR)\u003c/h1>\n  \u003cspan class=\"given\">3 V step, R\u003csub>s\u003c/sub> = 100 Ω · unknowns: Z\u003csub>01\u003c/sub>, Z\u003csub>02\u003c/sub>, t\u003csub>d1\u003c/sub>, t\u003csub>d2\u003c/sub>, R\u003csub>L\u003c/sub>\u003c/span>\n\u003c/div>\n\u003cdiv class=\"main\">\n\u003csection class=\"left\">\n\u003cp class=\"stmt\">Two transmission lines of different characteristic impedances and time delays terminated by a resistive load are being tested by a TDR. \u003cb>(a)\u003c/b> Given the TDR display of the source-end voltage due to a 3-V, 100 Ω step excitation starting at \u003ci>t\u003c/i> = 0, find the characteristic impedances (\u003ci>Z\u003c/i>\u003csub>01\u003c/sub> and \u003ci>Z\u003c/i>\u003csub>02\u003c/sub>) and the time delays (\u003ci>t\u003c/i>\u003csub>d1\u003c/sub> and \u003ci>t\u003c/i>\u003csub>d2\u003c/sub>) of both lines, and the unknown load \u003ci>R\u003c/i>\u003csub>L\u003c/sub>. \u003cb>(b)\u003c/b> Using the values found in part (a), find the time and magnitude of the next change in the source-end voltage \u003ci>V\u003c/i>\u003csub>s\u003c/sub>(\u003ci>t\u003c/i>), and sketch it on the display.\u003c/p>\n\u003cdiv class=\"figs\">\n\u003csvg class=\"circ\" viewBox=\"0 0 700 215\" font-family=\"system-ui,sans-serif\">\n  \u003cg stroke=\"#141821\" stroke-width=\"2\" fill=\"none\">\n    \u003ccircle cx=\"50\" cy=\"118\" r=\"24\"/>\n    \u003cpath d=\"M40 126 H50 V108 H60\" stroke-width=\"1.8\"/>\n    \u003cpath d=\"M50 94 V52 H78 l5 -8 l10 16 l10 -16 l10 16 l10 -16 l5 8 H140\"/>\n    \u003cpath d=\"M50 142 V178 H140\"/>\n    \u003cpath d=\"M140 52 H330\" stroke-width=\"3\"/>\u003cpath d=\"M140 178 H330\" stroke-width=\"3\"/>\n    \u003cpath d=\"M330 52 H610\" stroke-width=\"3\"/>\u003cpath d=\"M330 178 H610\" stroke-width=\"3\"/>\n    \u003cpath d=\"M610 52 H650 V82 l10 6 l-20 10 l20 10 l-20 10 l20 10 l-20 10 l10 6 V178 H610\"/>\n  \u003c/g>\n  \u003cg fill=\"#fff\" stroke=\"#141821\" stroke-width=\"2\">\n    \u003ccircle cx=\"140\" cy=\"52\" r=\"4\"/>\u003ccircle cx=\"140\" cy=\"178\" r=\"4\"/>\n    \u003ccircle cx=\"330\" cy=\"52\" r=\"4\"/>\u003ccircle cx=\"330\" cy=\"178\" r=\"4\"/>\n  \u003c/g>\n  \u003ctext x=\"50\" y=\"86\" text-anchor=\"middle\" font-size=\"15\">+\u003c/text>\n  \u003ctext x=\"50\" y=\"160\" text-anchor=\"middle\" font-size=\"15\">−\u003c/text>\n  \u003ctext x=\"22\" y=\"112\" font-size=\"14\" text-anchor=\"end\">3 V\u003c/text>\n  \u003ctext x=\"22\" y=\"132\" font-size=\"14\" text-anchor=\"end\">0\u003c/text>\n  \u003ctext x=\"98\" y=\"34\" text-anchor=\"middle\" font-size=\"15\">100 Ω\u003c/text>\n  \u003ctext x=\"160\" y=\"82\" font-size=\"16\">+\u003c/text>\n  \u003ctext x=\"156\" y=\"122\" font-size=\"16\" font-style=\"italic\">V\u003ctspan font-size=\"12\" dy=\"4\">s\u003c/tspan>\u003c/text>\n  \u003ctext x=\"161\" y=\"160\" font-size=\"18\">−\u003c/text>\n  \u003ctext x=\"235\" y=\"40\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\">Z\u003ctspan font-size=\"12\" dy=\"4\">01\u003c/tspan>\u003ctspan dy=\"-4\">, t\u003c/tspan>\u003ctspan font-size=\"12\" dy=\"4\">d1\u003c/tspan>\u003c/text>\n  \u003ctext x=\"470\" y=\"40\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\">Z\u003ctspan font-size=\"12\" dy=\"4\">02\u003c/tspan>\u003ctspan dy=\"-4\">, t\u003c/tspan>\u003ctspan font-size=\"12\" dy=\"4\">d2\u003c/tspan>\u003c/text>\n  \u003ctext x=\"674\" y=\"124\" font-size=\"17\" font-style=\"italic\">R\u003ctspan font-size=\"12\" dy=\"4\">L\u003c/tspan>\u003c/text>\n\u003c/svg>\n\u003csvg class=\"tdr\" viewBox=\"0 0 380 190\" font-family=\"system-ui,sans-serif\">\n  \u003cg stroke=\"#141821\" stroke-width=\"1.6\" fill=\"none\">\n    \u003cpath d=\"M40 160 H360\" />\u003cpath d=\"M354 156 l6 4 l-6 4\"/>\n    \u003cpath d=\"M50 170 V20\"/>\u003cpath d=\"M46 26 l4 -6 l4 6\"/>\n    \u003cpath d=\"M50 160 V60 H122 V110 H230 V85 H262\" stroke-width=\"2.4\"/>\n    \u003cpath d=\"M262 85 H300\" stroke-dasharray=\"6 5\" stroke-width=\"2.2\"/>\n  \u003c/g>\n  \u003cg stroke=\"#9aa1af\" stroke-dasharray=\"3 3\">\u003cpath d=\"M122 110 V160\"/>\u003cpath d=\"M230 110 V160\"/>\u003c/g>\n  \u003ctext x=\"62\" y=\"24\" font-size=\"14\" font-style=\"italic\">V\u003ctspan font-size=\"10\" dy=\"3\">s\u003c/tspan>\u003ctspan dy=\"-3\">(t)\u003c/tspan>\u003c/text>\n  \u003ctext x=\"86\" y=\"80\" text-anchor=\"middle\" font-size=\"13\">1.5 V\u003c/text>\n  \u003ctext x=\"176\" y=\"104\" text-anchor=\"middle\" font-size=\"13\">1 V\u003c/text>\n  \u003ctext x=\"262\" y=\"78\" text-anchor=\"middle\" font-size=\"13\">1.25 V\u003c/text>\n  \u003ctext x=\"122\" y=\"178\" text-anchor=\"middle\" font-size=\"13\">3\u003c/text>\n  \u003ctext x=\"230\" y=\"178\" text-anchor=\"middle\" font-size=\"13\">7.5\u003c/text>\n  \u003ctext x=\"340\" y=\"178\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\">t (ns)\u003c/text>\n\u003c/svg>\n\u003c/div>\n\u003cdiv class=\"sol\">\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003cb style=\"font-family:system-ui\">(a)\u003c/b>&ensp;\u003ci>V\u003c/i>\u003csub>s\u003c/sub>(0\u003csup>+\u003c/sup>) = 3\u003cspan class=\"fr\">\u003cspan>\u003ci>Z\u003c/i>\u003csub>01\u003c/sub>\u003c/span>\u003cspan>\u003ci>Z\u003c/i>\u003csub>01\u003c/sub> + 100\u003c/span>\u003c/span> = 1.5\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003cspan class=\"box\">\u003ci>Z\u003c/i>\u003csub>01\u003c/sub> = 100 Ω\u003c/span> &nbsp;(\u003ci>Γ\u003c/i>\u003csub>s\u003c/sub> = 0)\u003c/span> \u003cspan class=\"sg gap\">2\u003ci>t\u003c/i>\u003csub>d1\u003c/sub> = 3 ns\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003cspan class=\"box\">\u003ci>t\u003c/i>\u003csub>d1\u003c/sub> = 1.5 ns\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003ci>Γ\u003c/i>\u003csub>12\u003c/sub> = \u003cspan class=\"fr\">\u003cspan>1 − 1.5\u003c/span>\u003cspan>1.5\u003c/span>\u003c/span> = −\u003cspan class=\"fr\">\u003cspan>1\u003c/span>\u003cspan>3\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan>\u003ci>Z\u003c/i>\u003csub>02\u003c/sub> − 100\u003c/span>\u003cspan>\u003ci>Z\u003c/i>\u003csub>02\u003c/sub> + 100\u003c/span>\u003c/span>\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003cspan class=\"box\">\u003ci>Z\u003c/i>\u003csub>02\u003c/sub> = 50 Ω\u003c/span>\u003c/span> \u003cspan class=\"sg gap\">2(\u003ci>t\u003c/i>\u003csub>d1\u003c/sub> + \u003ci>t\u003c/i>\u003csub>d2\u003c/sub>) = 7.5 ns\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003cspan class=\"box\">\u003ci>t\u003c/i>\u003csub>d2\u003c/sub> = 2.25 ns\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">Δ\u003ci>V\u003c/i>\u003csub>s\u003c/sub> = 1.5 · \u003ci>τ\u003c/i>\u003csub>12\u003c/sub>\u003ci>Γ\u003c/i>\u003csub>L\u003c/sub>\u003ci>τ\u003c/i>\u003csub>21\u003c/sub> = 1.5 · \u003cspan class=\"fr\">\u003cspan>2\u003c/span>\u003cspan>3\u003c/span>\u003c/span> · \u003ci>Γ\u003c/i>\u003csub>L\u003c/sub> · \u003cspan class=\"fr\">\u003cspan>4\u003c/span>\u003cspan>3\u003c/span>\u003c/span> = 0.25\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003ci>Γ\u003c/i>\u003csub>L\u003c/sub> = \u003cspan class=\"fr\">\u003cspan>3\u003c/span>\u003cspan>16\u003c/span>\u003c/span>\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003cspan class=\"box\">\u003ci>R\u003c/i>\u003csub>L\u003c/sub> = 50\u003cspan class=\"fr\">\u003cspan>1 + 3/16\u003c/span>\u003cspan>1 − 3/16\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan>950\u003c/span>\u003cspan>13\u003c/span>\u003c/span> ≈ 73.1 Ω\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003cb style=\"font-family:system-ui\">(b)\u003c/b>&ensp;\u003ci>t\u003c/i> = 7.5 + 2\u003ci>t\u003c/i>\u003csub>d2\u003c/sub> = \u003cspan class=\"box\">12 ns\u003c/span>\u003c/span> \u003cspan class=\"sg gap\">Δ\u003ci>V\u003c/i>\u003csub>s\u003c/sub> = 1 · \u003ci>Γ\u003c/i>\u003csub>L\u003c/sub>\u003ci>Γ\u003c/i>\u003csub>21\u003c/sub>\u003ci>Γ\u003c/i>\u003csub>L\u003c/sub>\u003ci>τ\u003c/i>\u003csub>21\u003c/sub> = \u003cspan class=\"fr\">\u003cspan>3\u003c/span>\u003cspan>16\u003c/span>\u003c/span>·\u003cspan class=\"fr\">\u003cspan>1\u003c/span>\u003cspan>3\u003c/span>\u003c/span>·\u003cspan class=\"fr\">\u003cspan>3\u003c/span>\u003cspan>16\u003c/span>\u003c/span>·\u003cspan class=\"fr\">\u003cspan>4\u003c/span>\u003cspan>3\u003c/span>\u003c/span> = \u003cspan class=\"box\">+\u003cspan class=\"fr\">\u003cspan>1\u003c/span>\u003cspan>64\u003c/span>\u003c/span> ≈ 0.0156 V\u003c/span>\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"right\">\n\u003cdiv class=\"bar\">\n  \u003cbutton id=\"bPrev\">◀\u003c/button>\n  \u003cbutton id=\"bPlay\" style=\"min-width:44px\">▶\u003c/button>\n  \u003cbutton id=\"bNext\">▶|\u003c/button>\n  \u003cinput type=\"range\" id=\"ts\" min=\"0\" max=\"13.5\" step=\"0.001\" value=\"0\">\n  \u003cspan id=\"tr\">t = 0.000 ns\u003c/span>\n\u003c/div>\n\u003cdiv class=\"cv line\">\u003ccanvas id=\"cLine\">\u003c/canvas>\u003c/div>\n\u003cdiv class=\"two\">\n  \u003cdiv class=\"cv\" style=\"flex:520 1 0\">\u003ccanvas id=\"cBounce\" style=\"cursor:ns-resize\">\u003c/canvas>\u003c/div>\n  \u003cdiv class=\"cv\" style=\"flex:520 1 0\">\u003ccanvas id=\"cVs\" class=\"tp\" style=\"cursor:ew-resize\">\u003c/canvas>\u003c/div>\n\u003c/div>\n\n\u003c/section>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  /* shrink/grow the left column so statement + figure + solution always fit without scrolling */\n  const L = document.querySelector(\".left\");\n  function fits(){ return L.scrollHeight \u003c= L.clientHeight + 1 && L.scrollWidth \u003c= L.clientWidth + 1; }\n  function fit(){\n    let lo = 9, hi = 23;\n    for (let i = 0; i \u003c 14; i++){ const m = (lo + hi)/2; L.style.fontSize = m + \"px\"; if (fits()) lo = m; else hi = m; }\n    L.style.fontSize = lo + \"px\";\n    document.documentElement.dataset.fs = lo.toFixed(2);\n  }\n  window.__fit = fit;\n  fit();\n  if (document.fonts){ document.fonts.ready.then(() => { fit(); window.dispatchEvent(new Event(\"resize\")); }); }\n  window.addEventListener(\"resize\", fit);\n  /* slide navigation keys go to the deck */\n  const NAV = [\"PageDown\",\"PageUp\",\"ArrowDown\",\"ArrowUp\",\"Home\",\"End\",\"f\",\"F\",\"l\",\"L\"];\n  document.addEventListener(\"keydown\", e => {\n    if (!NAV.includes(e.key) || e.ctrlKey || e.metaKey || e.altKey) return;\n    e.preventDefault(); e.stopImmediatePropagation();\n    parent.postMessage({deckKey: e.key}, \"*\");\n  }, true);\n})();\n\u003c/script>\n\u003cscript>\n/* laser pointer: glowing red dot + short fading trail that follows the mouse (toggle with L) */\n(function(){\n  const cv = document.createElement(\"canvas\");\n  cv.style.cssText = \"position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:2147483647\";\n  const st = document.createElement(\"style\");\n  st.textContent = \"html.laser-on, html.laser-on *{cursor:none !important}\";\n  document.head.appendChild(st);\n  const add = () => document.body.appendChild(cv);\n  document.body ? add() : addEventListener(\"DOMContentLoaded\", add);\n  const ctx = cv.getContext(\"2d\");\n  let on = true, pts = [], cur = null, raf = 0, W = 0, H = 0;\n  const TRAIL = 260;\n  function size(){ const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = Math.round(W*d); cv.height = Math.round(H*d); ctx.setTransform(d, 0, 0, d, 0, 0); }\n  size(); addEventListener(\"resize\", () => { size(); draw(); });\n  function dot(x, y){\n    const g = ctx.createRadialGradient(x, y, 0, x, y, 20);\n    g.addColorStop(0, \"rgba(255,40,40,.55)\"); g.addColorStop(.45, \"rgba(255,30,30,.22)\"); g.addColorStop(1, \"rgba(255,0,0,0)\");\n    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill();\n    ctx.fillStyle = \"#ff1f1f\"; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill();\n    ctx.fillStyle = \"rgba(255,235,235,.95)\"; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 7); ctx.fill();\n  }\n  function draw(){\n    raf = 0;\n    ctx.clearRect(0, 0, W, H);\n    if (!on) return;\n    const now = performance.now();\n    pts = pts.filter(p => now - p.t \u003c TRAIL);\n    ctx.lineCap = \"round\"; ctx.lineJoin = \"round\";\n    for (let i = 1; i \u003c pts.length; i++){\n      const a = 1 - (now - pts[i].t)/TRAIL;\n      ctx.strokeStyle = `rgba(255,30,30,${(.55*a).toFixed(3)})`; ctx.lineWidth = 1 + 7*a;\n      ctx.beginPath(); ctx.moveTo(pts[i-1].x, pts[i-1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();\n    }\n    if (cur) dot(cur.x, cur.y);\n    if (pts.length > 1) raf = requestAnimationFrame(draw);\n  }\n  const kick = () => { if (!raf) raf = requestAnimationFrame(draw); };\n  addEventListener(\"pointermove\", e => {\n    if (!on) return;\n    cur = {x: e.clientX, y: e.clientY}; pts.push({x: cur.x, y: cur.y, t: performance.now()}); kick();\n  }, true);\n  const hide = () => { cur = null; pts = []; kick(); };\n  document.addEventListener(\"mouseleave\", hide);\n  document.addEventListener(\"mouseout\", e => { if (!e.relatedTarget || e.relatedTarget.tagName === \"IFRAME\") hide(); });\n  window.__laser = v => { on = v; document.documentElement.classList.toggle(\"laser-on\", on); if (!on) hide(); kick(); };\n  window.__laser(true);\n  addEventListener(\"message\", e => { if (e.data && typeof e.data.laser === \"boolean\") window.__laser(e.data.laser); });\n})();\n\u003c/script>\n\u003cscript>\n/* bounce-diagram amplitude labels: placed along their own wave line, never on top of another label or a crossing */\nlet PQL_ = [];\nfunction PQ_(ctx, s, xa, ya, xb, yb, col, fs, ymax){ PQL_.push({s, xa, ya, xb, yb, col, fs, ymax}); }\nfunction PQF_(ctx){\n  const segs = PQL_.map(it => { let xb = it.xb, yb = it.yb; if (yb > it.ymax){ const f = (it.ymax - it.ya)/(yb - it.ya); xb = it.xa + (xb - it.xa)*f; yb = it.ymax; } return [it.xa, it.ya, xb, yb]; });\n  const hit = (r, s) => { // Liang-Barsky segment / rectangle test\n    let t0 = 0, t1 = 1; const dx = s[2] - s[0], dy = s[3] - s[1];\n    for (const [p, q] of [[-dx, s[0] - r.x0], [dx, r.x1 - s[0]], [-dy, s[1] - r.y0], [dy, r.y1 - s[1]]]){\n      if (Math.abs(p) \u003c 1e-12){ if (q \u003c 0) return false; continue; }\n      const t = q/p; if (p \u003c 0){ if (t > t1) return false; if (t > t0) t0 = t; } else { if (t \u003c t0) return false; if (t \u003c t1) t1 = t; } }\n    return true; };\n  const F = [0.5, 0.38, 0.62, 0.28, 0.72, 0.44, 0.56, 0.2, 0.8, 0.33, 0.67];\n  const placed = [];\n  PQL_.forEach((it, i) => {\n    ctx.font = `600 ${it.fs}px system-ui,sans-serif`;\n    const w = ctx.measureText(it.s).width + 10, h = it.fs + 7;\n    let best = null, bestS = Infinity;\n    for (const f of F){\n      const cx = it.xa + (it.xb - it.xa)*f, cy = it.ya + (it.yb - it.ya)*f;\n      if (cy + h/2 > it.ymax + 3) continue;\n      const r = {x0: cx - w/2 - 2, x1: cx + w/2 + 2, y0: cy - h/2 - 2, y1: cy + h/2 + 2};\n      let sc = 0;\n      for (const q of placed){ const ox = Math.min(r.x1, q.x1) - Math.max(r.x0, q.x0), oy = Math.min(r.y1, q.y1) - Math.max(r.y0, q.y0); if (ox > 0 && oy > 0) sc += 1000 + ox*oy; }\n      segs.forEach((s, j) => { if (j !== i && hit(r, s)) sc += 60; });\n      sc += Math.abs(f - 0.5)*20;\n      if (sc \u003c bestS){ bestS = sc; best = {cx, cy, r}; }\n    }\n    if (!best) return;\n    placed.push(best.r); pill(ctx, it.s, best.cx, best.cy, it.col, \"center\", it.fs);\n  });\n  PQL_ = [];\n}\n\u003c/script>\n\u003cscript>\n/* z-diagram for branched networks: every line gets its own panel, so profiles never sit on top of each other */\nfunction GLINE_(cfg){\n  const {ctx, w, h} = setup(document.getElementById(\"cLine\"));\n  const order = cfg.order, D = cfg.D || (() => 1), lo = cfg.lo, hi = cfg.hi, st = cfg.st;\n  const fm = v => { if (Math.abs(v) \u003c 5e-10) return \"0\";\n    if (cfg.fmt === \"frac\") for (let d = 1; d \u003c= 729; d++){ const n = Math.round(Math.abs(v)*d);\n      if (Math.abs(n/d - Math.abs(v)) \u003c 1e-9){ const s = n + (d > 1 ? \"/\" + d : \"\"); if (s.length \u003c= 7) return (v \u003c 0 ? \"−\" : \"\") + s; break; } }\n    return (+v.toFixed(4)).toString().replace(\"-\", \"−\"); };\n  const sgn = v => (v > 0 ? \"+\" : \"\") + fm(v);\n  const panelOf = ln => ln;\n  // rows needed for travelling-front labels (max simultaneous fronts in one panel over the whole run)\n  let rows = 1;\n  for (let j = 0; j \u003c= 300; j++){ const cnt = {}; for (const f of fronts(j/300*TMAX)){ cnt[f.ln] = (cnt[f.ln] || 0) + 1; rows = Math.max(rows, cnt[f.ln]); } }\n  rows += 1;\n  const L = 50, Rm = cfg.rm || 14, B = 44, gap = 30, Tm = 14 + 24*rows;\n  const totD = order.reduce((s, ln) => s + D(ln), 0), unit = (w - L - Rm - gap*(order.length - 1))/totD;\n  const px = {}, pw = {}; let xx = L;\n  for (const ln of order){ px[ln] = xx; pw[ln] = unit*D(ln); xx += pw[ln] + gap; }\n  const y = v => Tm + (hi - v)/(hi - lo)*(h - Tm - B);\n  const tint = c => { if (c === \"#141821\") return \"rgba(36,86,214,.12)\"; const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},.14)`; };\n  // y axis labels + per-panel grid\n  ctx.font = \"12px system-ui,sans-serif\"; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\"; ctx.fillStyle = \"#6a7180\";\n  for (let v = lo; v \u003c= hi + 1e-9; v += st) ctx.fillText((+v.toFixed(3)).toString().replace(\"-\", \"−\"), L - 8, y(v));\n  for (const ln of order){\n    const x0 = px[ln], x1 = x0 + pw[ln], col = cfg.col(ln);\n    for (let v = lo; v \u003c= hi + 1e-9; v += st){ ctx.strokeStyle = Math.abs(v) \u003c 1e-9 ? \"#a3a9b6\" : \"#eceef3\"; ctx.lineWidth = Math.abs(v) \u003c 1e-9 ? 1.3 : 1;\n      ctx.beginPath(); ctx.moveTo(x0, y(v)); ctx.lineTo(x1, y(v)); ctx.stroke(); }\n    // profile\n    const N = 500, pts = []; for (let j = 0; j \u003c= N; j++) pts.push(V(ln, j/N, S.t));\n    const path = first => { first ? ctx.lineTo(x0, y(pts[0])) : ctx.moveTo(x0, y(pts[0]));\n      for (let j = 1; j \u003c= N; j++){ const xj = x0 + j/N*pw[ln]; if (Math.abs(pts[j] - pts[j-1]) > 1e-12) ctx.lineTo(xj, y(pts[j-1])); ctx.lineTo(xj, y(pts[j])); } };\n    ctx.beginPath(); ctx.moveTo(x0, y(0)); path(true); ctx.lineTo(x1, y(0)); ctx.closePath(); ctx.fillStyle = tint(col); ctx.fill();\n    ctx.beginPath(); path(); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();\n    // boundaries\n    ctx.strokeStyle = col; ctx.lineWidth = 3;\n    for (const xb of [x0, x1]){ ctx.beginPath(); ctx.moveTo(xb, Tm - 4); ctx.lineTo(xb, h - B + 4); ctx.stroke(); }\n    // plateau labels\n    ctx.font = \"600 13.5px system-ui,sans-serif\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"bottom\"; ctx.fillStyle = col;\n    let s0 = 0;\n    for (let j = 1; j \u003c= N + 1; j++){\n      if (j === N + 1 || Math.abs(pts[j] - pts[s0]) > 1e-12){\n        const a = s0/N, b = (j - 1)/N, tw = ctx.measureText(fm(pts[s0])).width;\n        if ((b - a)*pw[ln] > tw + 10) ctx.fillText(fm(pts[s0]), x0 + (a + b)/2*pw[ln], y(pts[s0]) - 5);\n        s0 = j;\n      }\n    }\n    // node names + title\n    const nd = cfg.nodes(ln);\n    ctx.textBaseline = \"top\";\n    [0, 1].forEach(e => {\n      const o = cfg.out.find(q => q.ln === ln && q.x === e);\n      let t = nd[e], fs = 12.5;\n      ctx.fillStyle = o ? o.c : \"#141821\";\n      if (o) t = (nd[e] ? nd[e] + \":  \" : \"\") + o.n + \" = \" + fm(V(ln, e, S.t)) + \" V\";\n      do { ctx.font = (o ? \"700 \" : \"600 \") + fs + \"px system-ui,sans-serif\"; fs -= 0.5; } while (o && ctx.measureText(t).width > pw[ln]*0.78 && fs > 9);\n      ctx.textAlign = e ? \"right\" : \"left\"; ctx.fillText(t, e ? x1 - 3 : x0 + 3, h - B + 6);\n    });\n    ctx.font = \"600 13px system-ui,sans-serif\"; ctx.fillStyle = col === \"#141821\" ? \"#4a5160\" : col; ctx.textAlign = \"center\";\n    ctx.fillText(cfg.name(ln), x0 + pw[ln]/2, h - B + 24);\n  }\n  // travelling fronts: each label goes to the first header row where it collides with nothing\n  const taken = [];\n  for (const f of fronts(S.t)){\n    const col = f.dir > 0 ? \"#2456d6\" : \"#d4442a\", xf = px[f.ln] + f.x*pw[f.ln];\n    const s = (cfg.pre ? cfg.pre(f.ln) : \"\") + sgn(f.amp) + \" V\";\n    ctx.font = \"600 12.5px system-ui,sans-serif\"; const pwd = ctx.measureText(s).width + 10;\n    let xp = xf + f.dir*34, al = f.dir > 0 ? \"left\" : \"right\";\n    if (f.dir > 0 && xp + pwd > w - 2){ xp = xf - 6; al = \"right\"; }\n    if (f.dir \u003c 0 && xp - pwd \u003c 2){ xp = xf + 6; al = \"left\"; }\n    const lo_ = Math.min(xf, al === \"left\" ? xp : xp - pwd) - 4, hi_ = Math.max(xf + f.dir*30, al === \"left\" ? xp + pwd : xp) + 4;\n    let r = 0; while (r \u003c rows - 1 && taken.some(q => q.r === r && q.a \u003c hi_ && lo_ \u003c q.b)) r++;\n    taken.push({r, a: lo_, b: hi_});\n    const ya = Tm - 14 - 24*r;\n    ctx.setLineDash([5, 4]); ctx.strokeStyle = col; ctx.lineWidth = 1.5;\n    ctx.beginPath(); ctx.moveTo(xf, ya); ctx.lineTo(xf, h - B); ctx.stroke(); ctx.setLineDash([]);\n    arrow(ctx, xf, ya, xf + f.dir*28, ya, col);\n    pill(ctx, s, xp, ya, col, al, 12.5);\n  }\n  // output readouts (dots; values are written under the node names)\n  for (const o of cfg.out){\n    const v = V(o.ln, o.x, S.t), xo = px[o.ln] + o.x*pw[o.ln];\n    ctx.fillStyle = o.c; ctx.beginPath(); ctx.arc(xo, y(v), 5.5, 0, 7); ctx.fill(); ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2; ctx.stroke();\n  }\n}\n\u003c/script>\n\n\u003cscript>\n/* reflection-coefficient headers for the bounce diagrams: arrow = direction of the incident wave */\nfunction GFR_(x){\n  if (Math.abs(x) \u003c 1e-9) return \"0\";\n  const s = x > 0 ? \"+\" : \"−\", a = Math.abs(x);\n  for (let d = 1; d \u003c= 64; d++){ const n = Math.round(a*d); if (Math.abs(n/d - a) \u003c 1e-9) return s + n + (d > 1 ? \"/\" + d : \"\"); }\n  return s + (+a.toFixed(3));\n}\nfunction GHDR_(ctx, items, Tm){\n  ctx.save();\n  for (let it of items){\n    const y = it.dir > 0 ? Tm - 31 : Tm - 11, col = it.dir > 0 ? \"#2456d6\" : \"#d4442a\", maxW = it.w - 6;\n    let fs = 15.5, tw = 0, al = 22, txt = it.t;\n    const fit = t => { for (fs = 15.5; fs > 9; fs -= 0.5){ ctx.font = \"700 \" + fs + \"px system-ui,sans-serif\"; tw = ctx.measureText(t).width; al = Math.round(fs*1.2); if (tw + al + 8 \u003c= maxW) break; } };\n    fit(txt);\n    if (fs \u003c 12.5 && txt.startsWith(\"Γ = \")){ txt = txt.slice(4); fit(txt); }\n    it = Object.assign({}, it, {t: txt});\n    ctx.strokeStyle = \"#b9bfca\"; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);\n    ctx.beginPath(); ctx.moveTo(it.x, Tm - 42); ctx.lineTo(it.x, Tm); ctx.stroke(); ctx.setLineDash([]);\n    const xb = it.x - it.dir*2, xa = xb - it.dir*al;\n    ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = 2.4;\n    ctx.beginPath(); ctx.moveTo(xa, y); ctx.lineTo(xb - it.dir*6, y); ctx.stroke();\n    ctx.beginPath(); ctx.moveTo(xb, y); ctx.lineTo(xb - it.dir*10, y - 5.5); ctx.lineTo(xb - it.dir*10, y + 5.5); ctx.closePath(); ctx.fill();\n    ctx.textBaseline = \"middle\"; ctx.textAlign = it.dir > 0 ? \"right\" : \"left\";\n    ctx.fillText(it.t, xa - it.dir*5, y + 1);\n  }\n  ctx.restore();\n}\n\u003c/script>\n\u003cscript>\n\"use strict\";\nconst VS = 3, RS = 100, SEG = [{Z:100, T:1.5}, {Z:50, T:2.25}], RLOAD = 950/13, TMAX = 13.5, EPS = 1e-9;\nconst C = {fwd:\"#2456d6\", bwd:\"#d4442a\", tot:\"#141821\", mut:\"#6a7180\", grid:\"#eceef3\", axis:\"#a3a9b6\", vs:\"#7a3fd1\", vl:\"#0f8a5f\"};\nconst U = [0]; SEG.forEach((s, i) => U.push(U[i] + s.T)); const UT = U[SEG.length];\nconst S = {t:0, playing:false, speed:1};\n\n/* ---------- wave tracing ---------- */\nconst G = (a, b) => b === Infinity ? 1 : (b - a)/(b + a);\nconst PK = [];\n(function trace(){\n  const q = [{seg:0, dir:1, amp: VS*SEG[0].Z/(SEG[0].Z + RS), t0:0}], last = SEG.length - 1, GS = G(SEG[0].Z, RS), GL = G(SEG[last].Z, RLOAD);\n  while (q.length){\n    const p = q.shift(); PK.push(p);\n    const te = p.t0 + SEG[p.seg].T; if (te > TMAX + EPS) continue;\n    const add = (seg, dir, amp) => { if (Math.abs(amp) > 1e-12) q.push({seg, dir, amp, t0: te}); };\n    if (p.dir > 0){\n      if (p.seg === last) add(p.seg, -1, p.amp*GL);\n      else { const g = G(SEG[p.seg].Z, SEG[p.seg+1].Z); add(p.seg, -1, p.amp*g); add(p.seg+1, 1, p.amp*(1+g)); }\n    } else {\n      if (p.seg === 0) add(0, 1, p.amp*GS);\n      else { const g = G(SEG[p.seg].Z, SEG[p.seg-1].Z); add(p.seg, 1, p.amp*g); add(p.seg-1, -1, p.amp*(1+g)); }\n    }\n  }\n})();\nfunction segOf(u){ for (let i = 0; i \u003c SEG.length; i++) if (u \u003c U[i+1] - EPS) return i; return SEG.length - 1; }\nfunction V(u, t){\n  const s = segOf(u); let v = 0;\n  for (const p of PK){ if (p.seg !== s) continue;\n    const arr = p.t0 + (p.dir > 0 ? u - U[s] : U[s+1] - u);\n    if (t >= arr - EPS) v += p.amp; }\n  return v;\n}\nconst Vs = t => V(0, t), VL = t => V(UT, t);\nconst EV = [...new Set(PK.flatMap(p => [p.t0, p.t0 + SEG[p.seg].T]).filter(t => t \u003c= TMAX + EPS).map(t => +t.toFixed(6)))].sort((a, b) => a - b);\nfunction fronts(t){\n  return PK.filter(p => t >= p.t0 - EPS && t \u003c p.t0 + SEG[p.seg].T - EPS && t \u003c TMAX - EPS)\n    .map(p => ({...p, u: p.dir > 0 ? U[p.seg] + (t - p.t0) : U[p.seg+1] - (t - p.t0)}));\n}\n\n/* ---------- helpers ---------- */\nfunction dec(x, dp = 4){ if (Math.abs(x) \u003c 5e-10) x = 0; return (+x.toFixed(dp)).toString().replace(\"-\", \"−\"); }\nfunction frac(x){ for (let d = 1; d \u003c= 256; d++){ const n = Math.round(x*d); if (Math.abs(n/d - x) \u003c 1e-9) return (n \u003c 0 ? \"−\" : \"\") + Math.abs(n) + (d > 1 ? \"/\" + d : \"\"); } return null; }\nconst sh = x => { const d = dec(x); if (Math.abs(+d.replace(\"−\", \"-\") - x) \u003c 1e-9) return d; const f = frac(x); return f && f.length \u003c= 7 ? f : d; };\nconst sg = x => (x > 0 ? \"+\" : \"\") + sh(x);\nfunction setup(c){\n  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;\n  c.width = Math.round(w*dpr); c.height = Math.round(h*dpr);\n  const ctx = c.getContext(\"2d\"); ctx.setTransform(dpr,0,0,dpr,0,0); return {ctx, w, h};\n}\nconst R = {lo:0, hi:2, st:0.25};\nfunction yAxis(ctx, y, x0, x1, fs = 12){\n  ctx.font = fs + \"px system-ui,sans-serif\"; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\";\n  for (let v = R.lo; v \u003c= R.hi + 1e-9; v += R.st){\n    ctx.strokeStyle = Math.abs(v) \u003c 1e-9 ? C.axis : C.grid; ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.moveTo(x0, y(v)); ctx.lineTo(x1, y(v)); ctx.stroke();\n    ctx.fillStyle = C.mut; ctx.fillText(dec(v, 2), x0 - 6, y(v));\n  }\n}\nfunction pill(ctx, s, x, y, col, al = \"center\", fs = 13){\n  ctx.font = `600 ${fs}px system-ui,sans-serif`;\n  const w = ctx.measureText(s).width + 10, h = fs + 7, x0 = al === \"center\" ? x - w/2 : al === \"left\" ? x : x - w;\n  ctx.fillStyle = \"#fff\"; ctx.strokeStyle = col; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.roundRect(x0, y - h/2, w, h, 5); ctx.fill(); ctx.stroke();\n  ctx.fillStyle = col; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(s, x0 + w/2, y + .5);\n}\nfunction arrow(ctx, x1, y1, x2, y2, col){\n  ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();\n  const a = Math.atan2(y2 - y1, x2 - x1);\n  ctx.beginPath(); ctx.moveTo(x2, y2);\n  ctx.lineTo(x2 - 11*Math.cos(a - .42), y2 - 11*Math.sin(a - .42));\n  ctx.lineTo(x2 - 11*Math.cos(a + .42), y2 - 11*Math.sin(a + .42)); ctx.fill();\n}\nconst sub = k => String(k).split(\"\").map(d => \"₀₁₂₃₄₅₆₇₈₉\"[+d]).join(\"\");\n\n/* ---------- line view ---------- */\nfunction drawLine(){\n  const {ctx, w, h} = setup(document.getElementById(\"cLine\"));\n  const L = 60, Rm = 120, Tm = 56, B = 30;\n  const x = u => L + u/UT*(w - L - Rm), y = v => Tm + (R.hi - v)/(R.hi - R.lo)*(h - Tm - B);\n  ctx.fillStyle = \"#f7f8fb\"; ctx.fillRect(x(U[1]), Tm, x(UT) - x(U[1]), h - Tm - B);\n  yAxis(ctx, y, L, w - Rm);\n  ctx.strokeStyle = C.tot; ctx.lineWidth = 3;\n  for (const u of U){ ctx.beginPath(); ctx.moveTo(x(u), Tm - 4); ctx.lineTo(x(u), h - B + 4); ctx.stroke(); }\n  ctx.font = \"13px system-ui,sans-serif\"; ctx.fillStyle = C.mut; ctx.textAlign = \"center\"; ctx.textBaseline = \"top\";\n  ctx.fillText(\"Z₀₁ = 100 Ω, t_d1 = 1.5 ns\", x((U[0] + U[1])/2), h - B + 8); ctx.fillText(\"Z₀₂ = 50 Ω, t_d2 = 2.25 ns\", x((U[1] + U[2])/2), h - B + 8);\n  // profile\n  const N = 1400, pts = [];\n  for (let j = 0; j \u003c= N; j++){ const u = j/N*UT; pts.push([u, V(u, S.t)]); }\n  ctx.beginPath(); ctx.moveTo(x(0), y(0)); ctx.lineTo(x(0), y(pts[0][1]));\n  for (let j = 1; j \u003c= N; j++){ if (Math.abs(pts[j][1] - pts[j-1][1]) > 1e-12) ctx.lineTo(x(pts[j][0]), y(pts[j-1][1])); ctx.lineTo(x(pts[j][0]), y(pts[j][1])); }\n  ctx.lineTo(x(UT), y(0)); ctx.closePath(); ctx.fillStyle = \"rgba(36,86,214,.12)\"; ctx.fill();\n  ctx.beginPath(); ctx.moveTo(x(0), y(pts[0][1]));\n  for (let j = 1; j \u003c= N; j++){ if (Math.abs(pts[j][1] - pts[j-1][1]) > 1e-12) ctx.lineTo(x(pts[j][0]), y(pts[j-1][1])); ctx.lineTo(x(pts[j][0]), y(pts[j][1])); }\n  ctx.strokeStyle = C.tot; ctx.lineWidth = 3; ctx.stroke();\n  // plateau labels\n  ctx.font = \"600 14px system-ui,sans-serif\"; ctx.fillStyle = C.tot; ctx.textAlign = \"center\"; ctx.textBaseline = \"bottom\";\n  let s0 = 0;\n  for (let j = 1; j \u003c= N + 1; j++){\n    if (j === N + 1 || Math.abs(pts[j][1] - pts[s0][1]) > 1e-12 || U.slice(1, -1).some(u => pts[j-1][0] \u003c u && pts[j][0] >= u)){\n      const a = pts[s0][0], b = pts[j-1][0];\n      if ((b - a)/UT > 0.09) ctx.fillText(sh(pts[s0][1]) + \" V\", x((a + b)/2), y(pts[s0][1]) - 5);\n      s0 = j;\n    }\n  }\n  // traveling fronts\n  for (const f of fronts(S.t)){\n    const col = f.dir > 0 ? C.fwd : C.bwd, xf = x(f.u), ya = f.seg === 0 ? Tm - 34 : Tm - 12;\n    ctx.setLineDash([5, 4]); ctx.strokeStyle = col; ctx.lineWidth = 1.5;\n    ctx.beginPath(); ctx.moveTo(xf, ya); ctx.lineTo(xf, h - B); ctx.stroke(); ctx.setLineDash([]);\n    arrow(ctx, xf, ya, xf + f.dir*40, ya, col);\n    pill(ctx, sg(f.amp) + \" V\", xf + f.dir*46, ya, col, f.dir > 0 ? \"left\" : \"right\");\n  }\n  // end readouts\n  const vs = Vs(S.t), vl = VL(S.t);\n  ctx.font = \"600 15px system-ui,sans-serif\"; ctx.textBaseline = \"middle\";\n  ctx.fillStyle = C.vl; ctx.textAlign = \"left\"; ctx.fillText(\"V_L = \" + sh(vl) + \" V\", x(UT) + 12, y(vl));\n  ctx.beginPath(); ctx.arc(x(UT), y(vl), 5.5, 0, 7); ctx.fill();\n  ctx.fillStyle = C.vs; ctx.beginPath(); ctx.arc(x(0), y(vs), 5.5, 0, 7); ctx.fill();\n}\n\n/* ---------- bounce diagram ---------- */\nlet BG;\nfunction drawBounce(){\n  const {ctx, w, h} = setup(document.getElementById(\"cBounce\"));\n  const L = 62, Rm = 108, Tm = 58, B = 16;\n  const x = u => L + u/UT*(w - L - Rm), y = t => Tm + t/TMAX*(h - Tm - B);\n  BG = {y0: Tm, y1: h - B};\n  ctx.font = \"12px system-ui,sans-serif\"; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\";\n  for (const te of EV){\n    ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x(0), y(te)); ctx.lineTo(x(UT), y(te)); ctx.stroke();\n    ctx.fillStyle = C.mut; ctx.fillText(dec(te, 2) + \" ns\", x(0) - 8, y(te));\n  }\n  ctx.strokeStyle = C.tot;\n  U.forEach((u, i) => { ctx.lineWidth = i === 1 ? 2 : 3; ctx.setLineDash(i === 1 ? [3, 3] : []);\n    ctx.beginPath(); ctx.moveTo(x(u), y(0)); ctx.lineTo(x(u), y(TMAX)); ctx.stroke(); });\n  ctx.setLineDash([]);\n  ctx.font = \"13px system-ui,sans-serif\"; ctx.fillStyle = C.mut; ctx.textAlign = \"center\"; ctx.textBaseline = \"bottom\";\n  GHDR_(ctx, [{x:x(0), dir:-1, t:\"Γs = 0\", w:x(U[1]) - x(0)}, {x:x(U[1]), dir:1, t:\"Γ₁₂ = −1/3\", w:x(U[1]) - x(0)}, {x:x(U[1]), dir:-1, t:\"Γ₂₁ = +1/3\", w:x(UT) - x(U[1])}, {x:x(UT), dir:1, t:\"ΓL = +3/16\", w:x(UT) - x(U[1])}], Tm);\n  for (const p of PK){\n    const a = p.dir > 0 ? U[p.seg] : U[p.seg+1], b = p.dir > 0 ? U[p.seg+1] : U[p.seg], T = SEG[p.seg].T, t1 = p.t0 + T;\n    const tc = Math.min(t1, TMAX), uc = a + (b - a)*(tc - p.t0)/T, col = p.dir > 0 ? C.fwd : C.bwd;\n    ctx.strokeStyle = col; ctx.globalAlpha = .22; ctx.lineWidth = 2;\n    ctx.beginPath(); ctx.moveTo(x(a), y(p.t0)); ctx.lineTo(x(uc), y(tc)); ctx.stroke(); ctx.globalAlpha = 1;\n    if (S.t > p.t0){\n      const tp = Math.min(S.t, tc), up = a + (b - a)*(tp - p.t0)/T;\n      ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x(a), y(p.t0)); ctx.lineTo(x(up), y(tp)); ctx.stroke();\n    }\n    const tm = p.t0 + T/2;\n    if (tm \u003c TMAX) PQ_(ctx, sg(p.amp), x(a), y(p.t0), x(b), y(t1), col, 12, y(TMAX));\n  }\n  ctx.textAlign = \"left\"; ctx.textBaseline = \"middle\";\n  for (const p of PK){ const ta = p.t0 + SEG[p.seg].T;\n    if (!(p.seg === SEG.length - 1 && p.dir > 0 && ta \u003c= TMAX + EPS)) continue;\n    const done = S.t >= ta - EPS;\n    ctx.font = (done ? \"600 \" : \"\") + \"12.5px system-ui,sans-serif\"; ctx.fillStyle = done ? C.vl : \"#b3b8c3\";\n    ctx.fillText(\"V_L = \" + sh(VL(ta)), x(UT) + 8, y(ta));\n  }\n  PQF_(ctx);\n  const yt = y(S.t);\n  ctx.strokeStyle = \"#e0262f\"; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);\n  ctx.beginPath(); ctx.moveTo(x(0), yt); ctx.lineTo(x(UT), yt); ctx.stroke(); ctx.setLineDash([]);\n  for (const f of fronts(S.t)){\n    ctx.fillStyle = f.dir > 0 ? C.fwd : C.bwd; ctx.beginPath(); ctx.arc(x(f.u), yt, 6, 0, 7); ctx.fill();\n    ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2; ctx.stroke();\n  }\n}\n\n/* ---------- time plots ---------- */\nlet TG;\nfunction plotT(c, fn, col, name){\n  const {ctx, w, h} = setup(c);\n  const L = 48, Rm = 18, Tm = 24, B = 38;\n  const x = t => L + t/TMAX*(w - L - Rm), y = v => Tm + (R.hi - v)/(R.hi - R.lo)*(h - Tm - B);\n  TG = {x0: L, x1: w - Rm};\n  yAxis(ctx, y, L, w - Rm, 11.5);\n  ctx.font = \"11.5px system-ui,sans-serif\"; ctx.fillStyle = C.mut; ctx.textAlign = \"center\"; ctx.textBaseline = \"top\";\n  for (let k = 0; k \u003c= TMAX + EPS; k += 1.5){\n    ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x(k), Tm); ctx.lineTo(x(k), h - B); ctx.stroke();\n    ctx.fillText(dec(k, 1), x(k), h - B + 5);\n  }\n  ctx.fillText(\"t (ns)\", (L + w - Rm)/2, h - B + 20);\n  const path = () => {\n    ctx.beginPath(); let pv = fn(0); ctx.moveTo(x(0), y(pv));\n    for (let j = 1; j \u003c= 2000; j++){ const t = j/2000*TMAX, v = fn(t);\n      if (Math.abs(v - pv) > 1e-12){ ctx.lineTo(x(t), y(pv)); ctx.lineTo(x(t), y(v)); pv = v; } }\n    ctx.lineTo(x(TMAX), y(pv));\n  };\n  ctx.strokeStyle = col; ctx.globalAlpha = .22; ctx.lineWidth = 3; path(); ctx.stroke(); ctx.globalAlpha = 1;\n  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, x(S.t), h); ctx.clip(); ctx.lineWidth = 3.2; path(); ctx.stroke(); ctx.restore();\n  // plateau labels\n  ctx.font = \"600 11.5px system-ui,sans-serif\"; ctx.fillStyle = C.tot; ctx.textAlign = \"center\"; ctx.textBaseline = \"bottom\";\n  { const ch = [0, ...PK.filter(p => p.seg === 0 && p.dir \u003c 0).map(p => p.t0 + SEG[0].T).filter(t => t \u003c TMAX - EPS), TMAX];\n    ctx.font = \"600 13px system-ui,sans-serif\";\n    for (let i = 0; i \u003c ch.length - 1; i++){ const tm = (ch[i] + ch[i+1])/2, v = fn(tm);\n      if (i === ch.length - 2){ ctx.textAlign = \"right\"; ctx.textBaseline = \"top\"; ctx.fillText(sh(v) + \" ≈ \" + dec(v) + \" V\", x(TMAX) - 2, y(v) + 16); }\n      else ctx.fillText(sh(v) + \" V\", x(tm), y(v) - 5); }\n    ctx.textAlign = \"center\"; ctx.textBaseline = \"bottom\";\n    if (S.t >= 12 - EPS) pill(ctx, \"12 ns: Δ = +1/64 V\", x(12), y(fn(12.5)) - 40, col, \"right\", 12.5);\n  }\n  ctx.font = \"600 14px system-ui,sans-serif\"; ctx.fillStyle = col; ctx.textAlign = \"left\"; ctx.textBaseline = \"top\"; ctx.fillText(name, L + 6, 2);\n  const xc = x(S.t), v = fn(S.t);\n  ctx.strokeStyle = \"#e0262f\"; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);\n  ctx.beginPath(); ctx.moveTo(xc, Tm); ctx.lineTo(xc, h - B); ctx.stroke(); ctx.setLineDash([]);\n  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(xc, y(v), 5.5, 0, 7); ctx.fill(); ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2; ctx.stroke();\n}\n\n/* ---------- ui ---------- */\nconst $ = id => document.getElementById(id);\nfunction render(){\n  $(\"tr\").textContent = \"t = \" + S.t.toFixed(3) + \" ns\"; $(\"ts\").value = S.t;\n  $(\"bPlay\").textContent = S.playing ? \"❚❚\" : \"▶\";\n  drawLine(); drawBounce();\n  plotT($(\"cVs\"), Vs, C.vs, \"V_s(t) — TDR display\");\n}\nfunction setT(t){ S.t = Math.min(Math.max(t, 0), TMAX); render(); }\nlet last = null;\nfunction tick(ts){\n  if (!S.playing){ last = null; return; }\n  if (last !== null){ let t = S.t + (ts - last)/1000*S.speed; if (t >= TMAX){ t = TMAX; S.playing = false; } S.t = t; render(); }\n  last = ts; requestAnimationFrame(tick);\n}\nfunction play(on){ S.playing = on "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>2-12 · Multiple lines\u003c/title>\n\u003cstyle>\n:root{--ink:#141821;--mut:#6a7180;--line:#e4e6ec;--acc:#2456d6;--math:\"Cambria Math\",\"STIX Two Math\",\"Times New Roman\",serif}\n*{box-sizing:border-box}\nbody{margin:0;background:#fff;color:var(--ink);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\n.wrap{max-width:1300px;margin:0 auto;padding:22px 28px 60px}\n.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}\nh1{font-size:22px;margin:0 12px 0 0}\n.given{color:var(--mut);font-size:15px}\n.stmt{font-size:17px;margin:0 0 12px;max-width:1000px}\n.stmt i{font-family:var(--math)}\n.circ{display:block;margin:0 auto 10px;width:100%;max-width:620px}\nbutton{font:inherit;font-size:15px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;color:var(--ink)}\nbutton:hover{background:#f3f4f7}\n.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}\n#ts{flex:1;accent-color:var(--acc)}\n#tr{font-variant-numeric:tabular-nums;font-weight:600;min-width:118px;text-align:right}\ncanvas{display:block;width:100%}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}\n.col{display:flex;flex-direction:column;gap:4px}\n@media(max-width:900px){.two{grid-template-columns:1fr}}\nhr{border:0;border-top:1px solid var(--line);margin:30px 0 22px}\n.eq{font-family:var(--math);font-size:21px;text-align:center;margin:8px 0;line-height:2.2}\n.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 3px}\n.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}\n.fr>span:last-child{padding:0 4px}\n.box{border:2px solid var(--acc);border-radius:7px;padding:2px 12px}\ntable{border-collapse:collapse;margin:14px auto;font-variant f (cy + h/2 > it.ymax + 3) continue;\n      const r = {x0: cx - w/2 - 2, x1: cx + w/2 + 2, y0: cy - h/2 - 2, y1: cy + h/2 + 2};\n      let sc = 0;\n      for (const q of placed){ const ox = Math.min(r.x1, q.x1) - Math.max(r.x0, q.x0), oy = Math.min(r.y1, q.y1) - Math.max(r.y0, q.y0); if (ox > 0 && oy > 0) sc += 1000 + ox*oy; }\n      segs.forEach((s, j) => { if (j !== i && hit(r, s)) sc += 60; });\n      sc += Math.abs(f - 0.5)*20;\n      if (sc \u003c bestS){ bestS = sc; best = {cx, cy, r}; }\n    }\n    if (!best) return;\n    placed.push(best.r); pill(ctx, it.s, best.cx, best.cy, it.col, \"center\", it.fs);\n  });\n  PQL_ = [];\n}\n\u003c/script>\n\u003cscript>\n/* z-diagram for branched networks: every line gets its own panel, so profiles never sit on top of each other */\nfunction GLINE_(cfg){\n  const {ctx, w, h} = setup(document.getElementById(\"cLine\"));\n  const order = cfg.order, D = cfg.D || (() => 1), lo = cfg.lo, hi = cfg.hi, st = cfg.st;\n  const fm = v => { if (Math.abs(v) \u003c 5e-10) return \"0\";\n    if (cfg.fmt === \"frac\") for (let d = 1; d \u003c= 729; d++){ const n = Math.round(Math.abs(v)*d);\n      if (Math.abs(n/d - Math.abs(v)) \u003c 1e-9){ const s = n + (d > 1 ? \"/\" + d : \"\"); if (s.length \u003c= 7) return (v \u003c 0 ? \"−\" : \"\") + s; break; } }\n    return (+v.toFixed(4)).toString().replace(\"-\", \"−\"); };\n  const sgn = v => (v > 0 ? \"+\" : \"\") + fm(v);\n  const panelOf = ln => ln;\n  // rows needed for travelling-front labels (max simultaneous fronts in one panel over the whole run)\n  let rows = 1;\n  for (let j = 0; j \u003c= 300; j++){ const cnt = {}; for (const f of fronts(j/300*TMAX)){ cnt[f.ln] = (cnt[f.ln] || 0) + 1; rows = Math.max(rows, cnt[f.ln]); } }\n  rows += 1;\n  const L = 50, Rm = cfg.rm || 14, B = 44, gap = 30, Tm = 14 + 24*rows;\n  const totD = order.reduce((s, ln) => s + D(ln), 0), unit = (w - L - Rm - gap*(order.length - 1))/totD;\n  const px = {}, pw = {}; let xx = L;\n  for (const ln of order){ px[ln] = xx; pw[ln] = unit*D(ln); xx += pw[ln] + gap; }\n  const y = v => Tm + (hi - v)/(hi - lo)*(h - Tm - B);\n  const tint = c => { if (c === \"#141821\") return \"rgba(36,86,214,.12)\"; const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},.14)`; };\n  // y axis labels + per-panel grid\n  ctx.font = \"12px system-ui,sans-serif\"; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\"; ctx.fillStyle = \"#6a7180\";\n  for (let v = lo; v \u003c= hi + 1e-9; v += st) ctx.fillText((+v.toFixed(3)).toString().replace(\"-\", \"−\"), L - 8, y(v));\n  for (const ln of order){\n    const x0 = px[ln], x1 = x0 + pw[ln], col = cfg.col(ln);\n    for (let v = lo; v \u003c= hi + 1e-9; v += st){ ctx.strokeStyle = Math.abs(v) \u003c 1e-9 ? \"#a3a9b6\" : \"#eceef3\"; ctx.lineWidth = Math.abs(v) \u003c 1e-9 ? 1.3 : 1;\n      ctx.beginPath(); ctx.moveTo(x0, y(v)); ctx.lineTo(x1, y(v)); ctx.stroke(); }\n    // profile\n    const N = 500, pts = []; for (let j = 0; j \u003c= N; j++) pts.push(V(ln, j/N, S.t));\n    const path = first => { first ? ctx.lineTo(x0, y(pts[0])) : ctx.moveTo(x0, y(pts[0]));\n      for (let j = 1; j \u003c= N; j++){ const xj = x0 + j/N*pw[ln]; if (Math.abs(pts[j] - pts[j-1]) > 1e-12) ctx.lineTo(xj, y(pts[j-1])); ctx.lineTo(xj, y(pts[j])); } };\n    ctx.beginPath(); ctx.moveTo(x0, y(0)); path(true); ctx.lineTo(x1, y(0)); ctx.closePath(); ctx.fillStyle = tint(col); ctx.fill();\n    ctx.beginPath(); path(); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();\n    // boundaries\n    ctx.strokeStyle = col; ctx.lineWidth = 3;\n    for (const xb of [x0, x1]){ ctx.beginPath(); ctx.moveTo(xb, Tm - 4); ctx.lineTo(xb, h - B + 4); ctx.stroke(); }\n    // plateau labels\n    ctx.font = \"600 13.5px system-ui,sans-serif\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"bottom\"; ctx.fillStyle = col;\n    let s0 = 0;\n    for (let j = 1; j \u003c= N + 1; j++){\n      if (j === N + 1 || Math.abs(pts[j] - pts[s0]) > 1e-12){\n        const To(xb, y); ctx.lineTo(xb - it.dir*10, y - 5.5); ctx.lineTo(xb - it.dir*10, y + 5.5); ctx.closePath(); ctx.fill();\n    ctx.textBaseline = \"middle\"; ctx.textAlign = it.dir > 0 ? \"right\" : \"left\";\n    ctx.fillText(it.t, xa - it.dir*5, y + 1);\n  }\n  ctx.restore();\n}\n\u003c/script>\n\u003cscript>\n\"use strict\";\nconst VS = 1, RS = 120, TMAX = 7, EPS = 1e-9;\n// lines: 0 = source→J, 1 = J→V2, 2 = J→V3 ; local coordinate x∈[0,1] from first node to second\nconst LN = [{Z:120, name:\"line 1\"}, {Z:120, RL:120, name:\"line 2\"}, {Z:60, RL:120, name:\"line 3\"}];\nconst C = {fwd:\"#2456d6\", bwd:\"#d4442a\", tot:\"#141821\", mut:\"#6a7180\", grid:\"#eceef3\", axis:\"#a3a9b6\",\n           b:[\"#141821\", \"#0f8a5f\", \"#d97706\"], v:[\"#7a3fd1\", \"#0f8a5f\", \"#d97706\"]};\nconst S = {t:0, playing:false, speed:0.5};\n\n/* ---------- wave tracing on the tree ---------- */\nconst G = (zl, z0) => zl === Infinity ? 1 : (zl - z0)/(zl + z0);\nconst par = (a, b) => a*b/(a + b);\nconst PK = [];\n(function trace(){\n  const q = [{ln:0, dir:1, amp: VS*LN[0].Z/(LN[0].Z + RS), t0:0}];\n  while (q.length){\n    const p = q.shift(); PK.push(p);\n    const te = p.t0 + 1; if (te > TMAX + EPS) continue;\n    const add = (ln, dir, amp) => { if (Math.abs(amp) > 1e-12) q.push({ln, dir, amp, t0: te}); };\n    const atJ = (p.ln === 0 && p.dir > 0) || (p.ln > 0 && p.dir \u003c 0);\n    if (atJ){\n      const others = [0, 1, 2].filter(k => k !== p.ln);\n      const g = G(par(LN[others[0]].Z, LN[others[1]].Z), LN[p.ln].Z);\n      add(p.ln, -p.dir, p.amp*g);\n      for (const k of others) add(k, k === 0 ? -1 : 1, p.amp*(1 + g));\n    } else if (p.ln === 0){ add(0, 1, p.amp*G(RS, LN[0].Z)); }\n    else add(p.ln, -1, p.amp*G(LN[p.ln].RL, LN[p.ln].Z));\n  }\n})();\nfunction V(ln, x, t){\n  let v = 0;\n  for (const p of PK){ if (p.ln !== ln) continue; if (t >= p.t0 + (p.dir > 0 ? x : 1 - x) - EPS) v += p.amp; }\n  return v;\n}\nconst V1 = t => V(0, 0, t), V2 = t => V(1, 1, t), V3 = t => V(2, 1, t), VK = [null, V1, V2, V3];\nfunction fronts(t){\n  return PK.filter(p => t >= p.t0 - EPS && t \u003c p.t0 + 1 - EPS && t \u003c TMAX - EPS)\n    .map(p => ({...p, x: p.dir > 0 ? t - p.t0 : 1 - (t - p.t0)}));\n}\nconst EV = [...new Set(PK.flatMap(p => [p.t0, p.t0 + 1]).filter(t => t \u003c= TMAX + EPS))].sort((a, b) => a - b);\n\n/* ---------- helpers ---------- */\nfunction dec(x, dp = 4){ if (Math.abs(x) \u003c 5e-10) x = 0; return (+x.toFixed(dp)).toString().replace(\"-\", \"−\"); }\nfunction frac(x){ for (let d = 1; d \u003c= 256; d++){ const n = Math.round(x*d); if (Math.abs(n/d - x) \u003c 1e-9) return (n \u003c 0 ? \"−\" : \"\") + Math.abs(n) + (d > 1 ? \"/\" + d : \"\"); } return null; }\nconst sh = x => { const d = dec(x); if (Math.abs(+d.replace(\"−\", \"-\") - x) \u003c 1e-9) return d; const f = frac(x); return f && f.length \u003c= 7 ? f : d; };\nconst sg = x => (x > 0 ? \"+\" : \"\") + sh(x);\nfunction setup(c){\n  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;\n  c.width = Math.round(w*dpr); c.height = Math.round(h*dpr);\n  const ctx = c.getContext(\"2d\"); ctx.setTransform(dpr,0,0,dpr,0,0); return {ctx, w, h};\n}\nconst R = {lo:0, hi:0.6, st:0.1};\nfunction yAxis(ctx, y, x0, x1, fs = 12){\n  ctx.font = fs + \"px system-ui,sans-serif\"; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\";\n  for (let v = R.lo; v \u003c= R.hi + 1e-9; v += R.st){\n    ctx.strokeStyle = Math.abs(v) \u003c 1e-9 ? C.axis : C.grid; ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.moveTo(x0, y(v)); ctx.lineTo(x1, y(v)); ctx.stroke();\n    ctx.fillStyle = C.mut; ctx.fillText(dec(v, 1), x0 - 6, y(v));\n  }\n}\nfunction pill(ctx, s, x, y, col, al = \"center\", fs = 13){\n  ctx.font = `600 ${fs}px system-ui,sans-serif`;\n  const w = ctx.measureText(s).width + 10, h = fs + 7, x0 = al === \"center\" ? x - w/2 : al === \"left\" ? x : x - w;\n  ctx.fillStyle = \"#fff\"; ctx.strokeStyle = col; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.roundRect(x0, y - h/2, w, h, 5); ctx.fill(); ctx.stroke();\n  ctx.fillStyle = col; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(s, x0 + w/2, y + .5);\n}\nfunction arrow(ctx, x1, y1, x2, y2, col){\n  ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();\n  const a = Math.atan2(y2 - y1, x2 - x1);\n  ctx.beginPath(); ctx.moveTo(x2, y2);\n  ctx.lineTo(x2 - 11*Math.cos(a - .42), y2 - 11*Math.sin(a - .42));\n  ctx.lineTo(x2 - 11*Math.cos(a + .42), y2 - 11*Math.sin(a + .42)); ctx.fill();\n}\n\n/* ---------- line view: line 1 on [0,1], lines 2 & 3 overlaid on [1,2] ---------- */\nfunction drawLine(){ GLINE_({order:[0, 1, 2], lo:R.lo, hi:R.hi, st:R.st, fmt:\"frac\", col:k => C.b[k], name:k => `line ${k + 1} (${LN[k].Z} Ω)`, nodes:k => [[\"S\", \"J\"], [\"J\", \"load 2\"], [\"J\", \"load 3\"]][k], out:[{ln:0, x:0, n:\"V₁\", c:C.v[0]}, {ln:1, x:1, n:\"V₂\", c:C.v[1]}, {ln:2, x:1, n:\"V₃\", c:C.v[2]}]}); }\n\n/* ---------- bounce diagram: three panels ---------- */\nlet BG;\nfunction drawBounce(){\n  const {ctx, w, h} = setup(document.getElementById(\"cBounce\"));\n  const L = 52, Rm = 10, Tm = 88, B = 14, gap = 16, pw = (w - L - Rm - 2*gap)/3;\n  const px = k => L + k*(pw + gap), y = t => Tm + t/TMAX*(h - Tm - B);\n  BG = {y0: Tm, y1: h - B};\n  ctx.font = \"12px system-ui,sans-serif\"; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\";\n  for (let k = 0; k \u003c= TMAX; k++){ ctx.fillStyle = C.mut; ctx.fillText(k + \" t_d\", L - 6, y(k)); }\n  const ends = [[\"S\", \"J\"], [\"J\", \"load\"], [\"J\", \"load\"]];\n  const GE_ = [0, 1, 2].map(k => { const o = [0, 1, 2].filter(j => j !== k); return k === 0 ? [G(RS, LN[0].Z), G(par(LN[1].Z, LN[2].Z), LN[0].Z)] : [G(par(LN[o[0]].Z, LN[o[1]].Z), LN[k].Z), G(LN[k].RL, LN[k].Z)]; });\n  for (let k = 0; k \u003c 3; k++){\n    const x0 = px(k), x1 = x0 + pw;\n    for (let j = 0; j \u003c= TMAX; j++){ ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0, y(j)); ctx.lineTo(x1, y(j)); ctx.stroke(); }\n    ctx.strokeStyle = C.b[k]; ctx.lineWidth = 3;\n    ctx.beginPath(); ctx.moveTo(x0, y(0)); ctx.lineTo(x0, y(TMAX)); ctx.moveTo(x1, y(0)); ctx.lineTo(x1, y(TMAX)); ctx.stroke();\n    ctx.font = \"600 13px system-ui,sans-serif\"; ctx.fillStyle = C.b[k]; ctx.textAlign = \"center\"; ctx.textBaseline = \"bottom\";\n    ctx.fillText(`line ${k + 1} (${LN[k].Z} Ω)`, x0 + pw/2, Tm - 66);\n    ctx.font = \"11.5px system-ui,sans-serif\"; ctx.fillStyle = C.mut;\n    ctx.textAlign = \"left\"; ctx.fillText(ends[k][0], x0, Tm - 48); ctx.textAlign = \"right\"; ctx.fillText(ends[k][1], x1, Tm - 48);\n    GHDR_(ctx, [{x:x0, dir:-1, t:\"Γ = \" + GFR_(GE_[k][0]), w:pw}, {x:x1, dir:1, t:\"Γ = \" + GFR_(GE_[k][1]), w:pw}], Tm);\n  }\n  for (const p of PK){\n    const x0 = px(p.ln), xa = x0 + (p.dir > 0 ? 0 : pw), xb = x0 + (p.dir > 0 ? pw : 0);\n    const tc = Math.min(p.t0 + 1, TMAX); if (p.t0 >= TMAX - EPS) continue;\n    const col = p.dir > 0 ? C.fwd : C.bwd, xc = xa + (xb - xa)*(tc - p.t0);\n    ctx.strokeStyle = col; ctx.globalAlpha = .22; ctx.lineWidth = 2;\n    ctx.beginPath(); ctx.moveTo(xa, y(p.t0)); ctx.lineTo(xc, y(tc)); ctx.stroke(); ctx.globalAlpha = 1;\n    if (S.t > p.t0){ const tp = Math.min(S.t, tc), xp = xa + (xb - xa)*(tp - p.t0);\n      ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(xa, y(p.t0)); ctx.lineTo(xp, y(tp)); ctx.stroke(); }\n    if (p.t0 + .5 \u003c TMAX) PQ_(ctx, sg(p.amp), xa, y(p.t0), xb, y(p.t0 + 1), col, 12, y(TMAX));\n  }\n  PQF_(ctx);\n  const yt = y(S.t);\n  ctx.strokeStyle = \"#e0262f\"; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);\n  ctx.beginPath(); ctx.moveTo(px(0), yt); ctx.lineTo(px(2) + pw, yt); ctx.stroke(); ctx.setLineDash([]);\n  for (const f of fronts(S.t)){\n    ctx.fillStyle = f.dir > 0 ? C.fwd : C.bwd; ctx.beginPath(); ctx.arc(px(f.ln) + f.x*pw, yt, 6, 0, 7); ctx.fill();\n    ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2; ctx.stroke();\n  }\n}\n\n/* ---------- time plots ---------- */\nlet TG;\nfunction plotT(c, k){\n  const {ctx, w, h} = setup(c), fn = VK[k], col = C.v[k - 1];\n  const L = 44, Rm = 16, Tm = 22, B = 30;\n  const x = t => L + t/TMAX*(w - L - Rm), y = v => Tm + (R.hi - v)/(R.hi - R.lo)*(h - Tm - B);\n  TG = {x0: L, x1: w - Rm};\n  yAxis(ctx, y, L, w - Rm, 11);\n  ctx.font = \"11px system-ui,sans-serif\"; ctx.fillStyle = C.mut; ctx.textAlign = \"center\"; ctx.textBaseline = \"top\";\n  for (let j = 0; j \u003c= TMAX; j++){\n    ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x(j), Tm); ctx.lineTo(x(j), h - B); ctx.stroke();\n    ctx.fillText(j + (j === TMAX ? \" t_d\" : \"\"), x(j), h - B + 4);\n  }\n  const path = () => {\n    ctx.beginPath(); let pv = fn(0); ctx.moveTo(x(0), y(pv));\n    for (let j = 1; j \u003c= 1400; j++){ const t = j/1400*TMAX, v = fn(t);\n      if (Math.abs(v - pv) > 1e-12){ ctx.lineTo(x(t), y(pv)); ctx.lineTo(x(t), y(v)); pv = v; } }\n    ctx.lineTo(x(TMAX), y(pv));\n  };\n  ctx.strokeStyle = col; ctx.globalAlpha = .22; ctx.lineWidth = 3; path(); ctx.stroke(); ctx.globalAlpha = 1;\n  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, x(S.t), h); ctx.clip(); ctx.lineWidth = 3.2; path(); ctx.stroke(); ctx.restore();\n  const ch = [0, ...EV.filter(t => t > EPS && t \u003c TMAX - EPS && Math.abs(fn(t + 1e-3) - fn(t - 1e-3)) > 1e-12), TMAX];\n  ctx.font = \"600 12.5px system-ui,sans-serif\"; ctx.fillStyle = C.tot; ctx.textBaseline = \"bottom\";\n  for (let i = 0; i \u003c ch.length - 1; i++){ const tm = (ch[i] + ch[i+1])/2; ctx.fillText(sh(fn(tm)) + \" V\", x(tm), y(fn(tm)) - 4); }\n  ctx.font = \"600 14px system-ui,sans-serif\"; ctx.fillStyle = col; ctx.textAlign = \"left\"; ctx.textBaseline = \"top\"; ctx.fillText(`V${\"₀₁₂₃\"[k]}(t)`, L + 6, 2);\n  const xc = x(S.t), v = fn(S.t);\n  ctx.strokeStyle = \"#e0262f\"; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);\n  ctx.beginPath(); ctx.moveTo(xc, Tm); ctx.lineTo(xc, h - B); ctx.stroke(); ctx.setLineDash([]);\n  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(xc, y(v), 5, 0, 7); ctx.fill(); ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2; ctx.stroke();\n}\n\n/* ---------- ui ---------- */\nconst $ = id => document.getElementById(id);\nfunction render(){\n  $(\"tr\").innerHTML = \"t = \" + S.t.toFixed(3) + \" t\u003csub>d\u003c/sub>\"; $(\"ts\").value = S.t;\n  $(\"bPlay\").textContent = S.playing ? \"❚❚\" : \"▶\";\n  drawLine(); drawBounce();\n  document.querySelectorAll(\".tp\").forEach(c => plotT(c, +c.dataset.k));\n}\nfunction setT(t){ S.t = Math.min(Math.max(t, 0), TMAX); render(); }\nlet last = null;\nfunction tick(ts){\n  if (!S.playing){ last = null; return; }\n  if (last !== null){ let t = S.t + (ts - last)/1000*S.speed; if (t >= TMAX){ t = TMAX; S.playing = false; } S.t = t; render(); }\n  last = ts; requestAnimationFrame(tick);\n}\nfunction play(on){ S.playing = on === undefined ? !S.playing : on; if (S.playing){ if (S.t >= TMAX - 1e-6) S.t = 0; requestAnimationFrame(tick); } render(); }\nconst next = () => { play(false); const e = EV.find(t => t > S.t + 1e-6); setT(e === undefined ? TMAX : e); };\nconst prev = () => { play(false); const e = [...EV].reverse().find(t => t \u003c S.t - 1e-6); setT(e === undefined ? 0 : e); };\n$(\"bPlay\").onclick = () => play(); $(\"bNext\").onclick = next; $(\"bPrev\").onclick = prev;\n$(\"ts\").oninput = e => { play(false); setT(+e.target.value); };\nfunction drag(c, fn){\n  let d = false; const go = e => { const r = c.getBoundingClientRect(); fn(e.clientX - r.left, e.clientY - r.top); };\n  c.addEventListener(\"pointerdown\", e => { d = true; play(false); c.setPointerCapture(e.pointerId); go(e); });\n  c.addEventListener(\"pointermove\", e => d && go(e)); c.addEventListener(\"pointerup\", () => d = false);\n}\ndrag($(\"cBounce\"), (x, y) => setT((y - BG.y0)/(BG.y1 - BG.y0)*TMAX));\ndocument.querySelectorAll(\".tp\").forEach(c => drag(c, x => setT((x - TG.x0)/(TG.x1 - TG.x0)*TMAX)));\ndocument.addEventListener(\"keydown\", e => {\n  if (e.code === \"Space\"){ e.preventDefault(); play(); }\n  else if (e.key === \"ArrowRight\"){ e.preventDefault(); e.shiftKey ? setT(S.t + .01) : next(); }\n  else if (e.key === \"ArrowLeft\"){ e.preventDefault(); e.shiftKey ? setT(S.t - .01) : prev(); }\n});\nwindow.addEventListener(\"resize\", render);\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n",
"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>2-14 · Multiple lines\u003c/title>\n\u003cstyle>\n:root{--ink:#141821;--mut:#6a7180;--line:#e4e6ec;--acc:#2456d6;--math:\"Cambria Math\",\"STIX Two Math\",\"Times New Roman\",serif}\n*{box-sizing:border-box}\nbody{margin:0;background:#fff;color:var(--ink);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\n.wrap{max-width:1300px;margin:0 auto;padding:22px 28px 60px}\n.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}\nh1{font-size:22px;margin:0 12px 0 0}\n.given{color:var(--mut);font-size:15px;margin-right:auto}\n.stmt{font-size:17px;margin:0 0 12px;max-width:1000px}\n.stmt i{font-family:var(--math)}\n.circ{display:block;margin:0 auto 10px;width:100%;max-width:680px}\nbutton{font:inherit;font-size:15px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;color:var(--ink)}\nbutton:hover{background:#f3f4f7}\nbutton.on{background:var(--ink);color:#fff;border-color:var(--ink)}\n.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}\n#ts{flex:1;accent-color:var(--acc)}\n#tr{font-variant-numeric:tabular-nums;font-weight:600;min-width:118px;text-align:right}\ncanvas{display:block;width:100%}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}\n.col{display:flex;flex-direction:column;gap:4px}\n@media(max-width:900px){.two{grid-template-columns:1fr}}\nhr{border:0;border-top:1px solid var(--line);margin:30px 0 22px}\n.eq{font-family:var(--math);font-size:20px;text-align:center;margin:8px 0;line-height:2.2}\n.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 3px}\n.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}\n.fr>span:last-child{padding:0 4px}\nh3{font-size:17px;margin:22px 0 4px;text-al ex;align-items:center;justify-content:center;gap:1.2em;flex-wrap:nowrap;margin:0}\n.circ{display:block;margin:0 auto;width:100%;height:auto;max-width:var(--cw,36em);flex:0 1 auto}\n.figs .circ{margin:0;max-width:none;flex:1.9 1 0;min-width:0}\n.figs .tdr,.figs .vsfig{max-width:none;flex:1 1 0;min-width:0;height:auto}\n.sol{border-top:1px solid var(--line);padding-top:.35em;display:flex;flex-direction:column}\n.sol .eq{font-size:1.2em;line-height:1.9;margin:.18em 0;text-align:center}\n.eq{font-family:var(--math)}\n.sol .eq b{font-size:.85em}\nsub,sup{line-height:0}\n.fr{line-height:1.2;margin:0 .12em}\n.fr>span:first-child{border-bottom:.075em solid currentColor;padding:0 .2em .05em}\n.fr>span:last-child{padding:.05em .2em 0}\n.box{display:inline-block;vertical-align:middle;line-height:1.3;border:2px solid var(--acc);border-radius:.35em;padding:.12em .45em;margin:.12em 0;white-space:nowrap}\n.sol table{font-size:.9em;margin:.45em auto}\n.sol th,.sol td{padding:.28em .75em}\n.sol th{font-size:.92em}\n.sol h3{font-size:1em;margin:.6em 0 .05em}\n.sol .note{font-size:.85em;margin:.2em 0}\n.sol>p{margin:.2em 0}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\" style=\"--lw:40%;--cw:40.0em\">\n\u003cdiv class=\"top\">\n  \u003ch1>2-14 · Multiple lines\u003c/h1>\n  \u003cspan class=\"given\">5 V step, R\u003csub>s\u003c/sub> = 50 Ω · all lines 1 ns · AB = BC = CD = 50 Ω · R\u003csub>L1\u003c/sub> = R\u003csub>L2\u003c/sub> = R\u003csub>L3\u003c/sub> = 50 Ω\u003c/span>\n  \u003cbutton class=\"case\" data-z=\"50\">(a) Z\u003csub>01\u003c/sub> = Z\u003csub>02\u003c/sub> = 50 Ω\u003c/button>\n  \u003cbutton class=\"case\" data-z=\"25\">(b) Z\u003csub>01\u003c/sub> = Z\u003csub>02\u003c/sub> = 25 Ω\u003c/button>\n\u003c/div>\n\u003cdiv class=\"main\">\n\u003csection class=\"left\">\n\u003cp class=\"stmt\">For the distributed interconnect system shown, and for \u003ci>Z\u003c/i>\u003csub>01\u003c/sub> = \u003ci>Z\u003c/i>\u003csub>02\u003c/sub> = 50 Ω, find and sketch the three load voltages \u003ci>V\u003c/i>\u003csub>1\u003c/sub>(\u003ci>t\u003c/i>), \u003ci>V\u003c/i>\u003csub>2\u003c/sub>(\u003ci>t\u003c/i>), and \u003ci>V\u003c/i>\u003csub>3\u003c/sub>(\u003ci>t\u003c/i>) for a time interval of 5 ns. Assume each interconnect to have a one-way time delay of 1 ns. \u003cb>(b)\u003c/b> Repeat part (a) for \u003ci>Z\u003c/i>\u003csub>01\u003c/sub> = \u003ci>Z\u003c/i>\u003csub>02\u003c/sub> = 25 Ω.\u003c/p>\n\u003csvg class=\"circ\" viewBox=\"0 0 700 290\" font-family=\"system-ui,sans-serif\">\n  \u003cg stroke=\"#141821\" stroke-width=\"2\" fill=\"none\">\n    \u003ccircle cx=\"40\" cy=\"130\" r=\"22\"/>\n    \u003cpath d=\"M31 137 H40 V121 H49\" stroke-width=\"1.8\"/>\n    \u003cpath d=\"M40 108 V50 H74 l5 -8 l10 16 l10 -16 l10 16 l10 -16 l5 8 H146\"/>\n    \u003cpath d=\"M40 152 V200\"/>\u003cpath d=\"M24 200 H56 M30 206 H50 M36 212 H44\"/>\n    \u003cpath d=\"M154 50 H526\" stroke-width=\"3\"/>\n    \u003cpath d=\"M254 54 L376 196\" stroke-width=\"3\"/>\n    \u003cpath d=\"M394 54 L516 196\" stroke-width=\"3\"/>\n    \u003cpath d=\"M534 50 H560 l5 -8 l10 16 l10 -16 l10 16 l10 -16 l5 8 H640 V64\"/>\n    \u003cpath d=\"M624 64 H656 M630 70 H650 M636 76 H644\"/>\n    \u003cpath d=\"M380 204 V218 l10 6 l-20 10 l20 10 l-20 10 l20 10 l-20 10 l10 6 V272\"/>\n    \u003cpath d=\"M364 272 H396 M370 278 H390 M376 284 H384\"/>\n    \u003cpath d=\"M520 204 V218 l10 6 l-20 10 l20 10 l-20 10 l20 10 l-20 10 l10 6 V272\"/>\n    \u003cpath d=\"M504 272 H536 M510 278 H530 M516 284 H524\"/>\n  \u003c/g>\n  \u003cg fill=\"#fff\" stroke=\"#141821\" stroke-width=\"2\">\n    \u003ccircle cx=\"150\" cy=\"50\" r=\"4\"/>\u003ccircle cx=\"250\" cy=\"50\" r=\"4\"/>\u003ccircle cx=\"390\" cy=\"50\" r=\"4\"/>\u003ccircle cx=\"530\" cy=\"50\" r=\"4\"/>\n    \u003ccircle cx=\"380\" cy=\"200\" r=\"4\"/>\u003ccircle cx=\"520\" cy=\"200\" r=\"4\"/>\n  \u003c/g>\n  \u003ctext x=\"40\" y=\"102\" text-anchor=\"middle\" font-size=\"14\">+\u003c/text>\n  \u003ctext x=\"40\" y=\"170\" text-anchor=\"middle\" font-size=\"14\">−\u003c/text>\n  \u003ctext x=\"70\" y=\"128\" font-size=\"13\">5 V\u003c/text>\n  \u003ctext x=\"70\" y=\"146\" font-size=\"13\">0\u003c/text>\n  \u003ctext x=\"100\" y=\"32\" text-anchor=\"middle\" font-size=\"14\">50 Ω\u003c/text>\n  \u003cg font-size=\"15\" font-weight=\"600\" text-anchor=\"middle\">\u003ctext x=\"150\" y=\"34\">A\u003c/text>\u003ctext x=\"250\" y=\"34\">B\u003c/text>\u003ctext x=\"390\" y=\"34\">C\u003c/text>\u003ctext x=\"530\" y=\"34\">D\u003c/text>\u003ctext x=\"396\" y=\"196\">E\u003c/text>\u003ctext x=\"536\" y=\"196\">F\u003c/text>\u003c/g>\n  \u003cg font-size=\"13\" text-anchor=\"middle\" fill=\"#141821\">\u003ctext x=\"200\" y=\"70\">50 Ω\u003c/text>\u003ctext x=\"320\" y=\"70\">50 Ω\u003c/text>\u003ctext x=\"460\" y=\"70\">50 Ω\u003c/text>\u003c/g>\n  \u003ctext x=\"302\" y=\"134\" font-size=\"15\" font-style=\"italic\" transform=\"rotate(49 302 134)\">Z\u003ctspan font-size=\"11\" dy=\"3\">01\u003c/tspan>\u003c/text>\n  \u003ctext x=\"442\" y=\"134\" font-size=\"15\" font-style=\"italic\" transform=\"rotate(49 442 134)\">Z\u003ctspan font-size=\"11\" dy=\"3\">02\u003c/tspan>\u003c/text>\n  \u003ctext x=\"600\" y=\"30\" text-anchor=\"middle\" font-size=\"13\">R\u003ctspan font-size=\"10\" dy=\"3\">L3\u003c/tspan>\u003ctspan dy=\"-3\"> = 50 Ω\u003c/tspan>\u003c/text>\n  \u003ctext x=\"560\" y=\"80\" font-size=\"14\">+\u003c/text>\u003ctext x=\"590\" y=\"82\" font-size=\"14\" font-style=\"italic\">V\u003ctspan font-size=\"10\" dy=\"3\">3\u003c/tspan>\u003c/text>\u003ctext x=\"625\" y=\"80\" font-size=\"15\">−\u003c/text>\n  \u003ctext x=\"362\" y=\"250\" text-anchor=\"end\" font-size=\"13\">R\u003ctspan font-size=\"10\" dy=\"3\">L1\u003c/tspan>\u003ctspan dy=\"-3\"> = 50 Ω\u003c/tspan>\u003c/text>\n  \u003ctext x=\"402\" y=\"226\" font-size=\"14\">+\u003c/text>\u003ctext x=\"400\" y=\"250\" font-size=\"14\" font-style=\"italic\">V\u003ctspan font-size=\"10\" dy=\"3\">1\u003c/tspan>\u003c/text>\u003ctext x=\"403\" y=\"270\" font-size=\"15\">−\u003c/text>\n  \u003ctext x=\"542\" y=\"226\" font-size=\"14\">+\u003c/text>\u003ctext x=\"540\" y=\"250\" font-size=\"14\" font-style=\"italic\">V\u003ctspan font-size=\"10\" dy=\"3\">2\u003c/tspan>\u003c/text>\u003ctext x=\"543\" y=\"270\" font-size=\"15\">−\u003c/text>\n  \u003ctext x=\"572\" y=\"250\" font-size=\"13\">R\u003ctspan font-size=\"10\" dy=\"3\">L2\u003c/tspan>\u003ctspan dy=\"-3\"> = 50 Ω\u003c/tspan>\u003c/text>\n\u003c/svg>\n\u003cdiv class=\"sol\">\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003ci>V\u003c/i>\u003csup>+\u003c/sup> = 5 · \u003cspan class=\"fr\">\u003cspan>50\u003c/span>\u003cspan>50 + 50\u003c/span>\u003c/span> = 2.5 V,\u003c/span> \u003cspan class=\"sg arr\">\u003ci>Γ\u003c/i>\u003csub>A\u003c/sub> = 0\u003c/span>\u003c/div>\n\n\u003ch3>(a) Z\u003csub>01\u003c/sub> = Z\u003csub>02\u003c/sub> = 50 Ω\u003c/h3>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">at B, C:&ensp;\u003ci>Z\u003c/i>\u003csub>eq\u003c/sub> = 50∥50 = 25 Ω\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003ci>Γ\u003c/i> = −\u003cspan class=\"fr\">\u003cspan>1\u003c/span>\u003cspan>3\u003c/span>\u003c/span>,\u003c/span> \u003cspan class=\"sg arr\">\u003ci>τ\u003c/i> = \u003cspan class=\"fr\">\u003cspan>2\u003c/span>\u003cspan>3\u003c/span>\u003c/span>\u003c/span> \u003cspan class=\"sg gap\">loads matched:&ensp;\u003ci>Γ\u003c/i>\u003csub>E\u003c/sub> = \u003ci>Γ\u003c/i>\u003csub>F\u003c/sub> = \u003ci>Γ\u003c/i>\u003csub>D\u003c/sub> = 0\u003c/span>\u003c/div>\n\n\u003ch3>(b) Z\u003csub>01\u003c/sub> = Z\u003csub>02\u003c/sub> = 25 Ω\u003c/h3>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">from 50 Ω line:&ensp;\u003ci>Z\u003c/i>\u003csub>eq\u003c/sub> = 50∥25 = \u003cspan class=\"fr\">\u003cspan>50\u003c/span>\u003cspan>3\u003c/span>\u003c/span> Ω\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003ci>Γ\u003c/i> = −\u003cspan class=\"fr\">\u003cspan>1\u003c/span>\u003cspan>2\u003c/span>\u003c/span>, \u003ci>τ\u003c/i> = \u003cspan class=\"fr\">\u003cspan>1\u003c/span>\u003cspan>2\u003c/span>\u003c/span>\u003c/span> \u003cspan class=\"sg gap\">from 25 Ω branch:&ensp;\u003ci>Z\u003c/i>\u003csub>eq\u003c/sub> = 50∥50 = 25 Ω\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003ci>Γ\u003c/i> = 0, \u003ci>τ\u003c/i> = 1\u003c/span> \u003cspan class=\"sg gap\">\u003ci>Γ\u003c/i>\u003csub>E\u003c/sub> = \u003ci>Γ\u003c/i>\u003csub>F\u003c/sub> = \u003cspan class=\"fr\">\u003cspan>50 − 25\u003c/span>\u003cspan>50 + 25\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan>1\u003c/span>\u003cspan>3\u003c/span>\u003c/span>\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"right\">\n\u003cdiv class=\"bar\">\n  \u003cbutton id=\"bPrev\">◀\u003c/button>\n  \u003cbutton id=\"bPlay\" style=\"min-width:44px\">▶\u003c/button>\n  \u003cbutton id=\"bNext\">▶|\u003c/button>\n  \u003cinput type=\"range\" id=\"ts\" min=\"0\" max=\"6\" step=\"0.001\" value=\"0\">\n  \u003cspan id=\"tr\">t = 0.000 ns\u003c/span>\n\u003c/div>\n\u003cdiv class=\"cv line\">\u003ccanvas id=\"cLine\">\u003c/canvas>\u003c/div>\n\u003cdiv class=\"two\">\n  \u003cdiv class=\"cv\" style=\"flex:560 1 0\">\u003ccanvas id=\"cBounce\" style=\"cursor:ns-resize\">\u003c/canvas>\u003c/div>\n  \u003cdiv class=\"col\">\n    \u003cdiv class=\"cv\" style=\"flex:184 1 0\">\u003ccanvas class=\"tp\" data-k=\"1\" style=\"cursor:ew-resize\">\u003c/canvas>\u003c/div>\n    \u003cdiv class=\"cv\" style=\"flex:184 1 0\">\u003ccanvas class=\"tp\" data-k=\"2\" style=\"cursor:ew-resize\">\u003c/canvas>\u003c/div>\n    \u003cdiv class=\"cv\" style=\"flex:184 1 0\">\u003ccanvas class=\"tp\" data-k=\"3\" style=\"cursor:ew-resize\">\u003c/canvas>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c/section>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  /* shrink/grow the left column so statement + figure + solution always fit without scrolling */\n  const L = document.querySelector(\".left\");\n  function fits(){ return L.scrollHeight \u003c= L.clientHeight + 1 && L.scrollWidth \u003c= L.clientWidth + 1; }\n  function fit(){\n    let lo = 9, hi = 23;\n    for (let i = 0; i \u003c 14; i++){ const m = (lo + hi)/2; L.style.fontSize = m + \"px\"; if (fits()) lo = m; else hi = m; }\n    L.style.fontSize = lo + \"px\";\n    document.documentElement.dataset.fs = lo.toFixed(2);\n  }\n  window.__fit = fit;\n  fit();\n  if (document.fonts){ document.fonts.ready.then(() => { fit(); window.dispatchEvent(new Event(\"resize\")); }); }\n  window.addEventListener(\"resize\", fit);\n  /* slide navigation keys go to the deck */\n  const NAV = [\"PageDown\",\"PageUp\",\"ArrowDown\",\"ArrowUp\",\"Home\",\"End\",\"f\",\"F\",\"l\",\"L\"];\n  document.addEventListener(\"keydown\", e => {\n    if (!NAV.includes(e.key) || e.ctrlKey || e.metaKey || e.altKey) return;\n    e.preventDefault(); e.stopImmediatePropagation();\n    parent.postMessage({deckKey: e.key}, \"*\");\n  }, true);\n})();\n\u003c/script>\n\u003cscript>\n/* laser pointer: glowing red dot + short fading trail that follows the mouse (toggle with L) */\n(function(){\n  const cv = document.createElement(\"canvas\");\n  cv.style.cssText = \"position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:2147483647\";\n  const st = document.createElement(\"style\");\n  st.textContent = \"html.laser-on, html.laser-on *{cursor:none !important}\";\n  document.head.appendChild(st);\n  const add = () => document.body.appendChild(cv);\n  document.body ? add() : addEventListener(\"DOMContentLoaded\", add);\n  const ctx = cv.getContext(\"2d\");\n  let on = true, pts = [], cur = null, raf = 0, W = 0, H = 0;\n  const TRAIL = 260;\n  function size(){ const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = Math.round(W*d); cv.height = Math.round(H*d); ctx.setTransform(d, 0, 0, d, 0, 0); }\n  size(); addEventListener(\"resize\", () => { size(); draw(); });\n  function dot(x, y){\n    const g = ctx.createRadialGradient(x, y, 0, x, y, 20);\n    g.addColorStop(0, \"rgba(255,40,40,.55)\"); g.addColorStop(.45, \"rgba(255,30,30,.22)\"); g.addColorStop(1, \"rgba(255,0,0,0)\");\n    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill();\n    ctx.fillStyle = \"#ff1f1f\"; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill();\n    ctx.fillStyle = \"rgba(255,235,235,.95)\"; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 7); ctx.fill();\n  }\n  function draw(){\n    raf = 0;\n    ctx.clearRect(0, 0, W, H);\n    if (!on) return;\n    const now = performance.now();\n    pts = pts.filter(p => now - p.t \u003c TRAIL);\n    ctx.lineCap = \"round\"; ctx.lineJoin = \"round\";\n    for (let i = 1; i \u003c pts.length; i++){\n      const a = 1 - (now - pts[i].t)/TRAIL;\n      ctx.strokeStyle = `rgba(255,30,30,${(.55*a).toFixed(3)})`; ctx.lineWidth = 1 + 7*a;\n      ctx.beginPath(); ctx.moveTo(pts[i-1].x, pts[i-1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();\n    }\n    if (cur) dot(cur.x, cur.y);\n    if (pts.length > 1) raf = requestAnimationFrame(draw);\n  }\n  const kick = () => { if (!raf) raf = requestAnimationFrame(draw); };\n  addEventListener(\"pointermove\", e => {\n    if (!on) return;\n    cur = {x: e.clientX, y: e.clientY}; pts.push({x: cur.x, y: cur.y, t: performance.now()}); kick();\n  }, true);\n  const hide = () => { cur = null; pts = []; kick(); };\n  document.addEventListener(\"mouseleave\", hide);\n  document.addEventListener(\"mouseout\", e => { if (!e.relatedTarget || e.relatedTarget.tagName === \"IFRAME\") hide(); });\n  window.__laser = v => { on = v; document.documentElement.classList.toggle(\"laser-on\", on); if (!on) hide(); kick(); };\n  window.__laser(true);\n  addEventListener(\"message\", e => { if (e.data && typeof e.data.laser === \"boolean\") window.__laser(e.data.laser); });\n})();\n\u003c/script>\n\u003cscript>\n/* bounce-diagram amplitude labels: placed along their own wave line, never on top of another label or a crossing */\nlet PQL_ = [];\nfunction PQ_(ctx, s, xa, ya, xb, yb, col, fs, ymax){ PQL_.push({s, xa, ya, xb, yb, col, fs, ymax}); }\nfunction PQF_(ctx){\n  const segs = PQL_.map(it => { let xb = it.xb, yb = it.yb; if (yb > it.ymax){ const f = (it.ymax - it.ya)/(yb - it.ya); xb = it.xa + (xb - it.xa)*f; yb = it.ymax; } return [it.xa, it.ya, xb, yb]; });\n  const hit = (r, s) => { // Liang-Barsky segment / rectangle test\n    let t0 = 0, t1 = 1; const dx = s[2] - s[0], dy = s[3] - s[1];\n    for (const [p, q] of [[-dx, s[0] - r.x0], [dx, r.x1 - s[0]], [-dy, s[1] - r.y0], [dy, r.y1 - s[1]]]){\n      if (Math.abs(p) \u003c 1e-12){ if (q \u003c 0) return false; continue; }\n      const t = q/p; if (p \u003c 0){ if (t > t1) return false; if (t > t0) t0 = t; } else { if (t \u003c t0) return false; if (t \u003c t1) t1 = t; } }\n    return true; };\n  const F = [0.5, 0.38, 0.62, 0.28, 0.72, 0.44, 0.56, 0.2, 0.8, 0.33, 0.67];\n  const placed = [];\n  PQL_.forEach((it, i) => {\n    ctx.font = `600 ${it.fs}px system-ui,sans-serif`;\n    const w = ctx.measureText(it.s).width + 10, h = it.fs + 7;\n    let best = null, bestS = Infinity;\n    for (const f of F){\n      const cx = it.xa + (it.xb - it.xa)*f, cy = it.ya + (it.yb - it.ya)*f;\n      if (cy + h/2 > it.ymax + 3) continue;\n      const r = {x0: cx - w/2 - 2, x1: cx + w/2 + 2, y0: cy - h/2 - 2, y1: cy + h/2 + 2};\n      let sc = 0;\n      for (const q of placed){ const ox = Math.min(r.x1, q.x1) - Math.max(r.x0, q.x0), oy = Math.min(r.y1, q.y1) - Math.max(r.y0, q.y0); if (ox > 0 && oy > 0) sc += 1000 + ox*oy; }\n      segs.forEach((s, j) => { if (j !== i && hit(r, s)) sc += 60; });\n      sc += Math.abs(f - 0.5)*20;\n      if (sc \u003c bestS){ bestS = sc; best = {cx, cy, r}; }\n    }\n    if (!best) return;\n    placed.push(best.r); pill(ctx, it.s, best.cx, best.cy, it.col, \"center\", it.fs);\n  });\n  PQL_ = [];\n}\n\u003c/script>\n\u003cscript>\n/* z-diagram for branched networks: every line gets its own panel, so profiles never sit on top of each other */\nfunction GLINE_(cfg){\n  const {ctx, w, h} = setup(document.getElementById(\"cLine\"));\n  const order = cfg.order, D = cfg.D || (() => 1), lo = cfg.lo, hi = cfg.hi, st = cfg.st;\n  const fm = v => { if (Math.abs(v) \u003c 5e-10) return \"0\";\n    if (cfg.fmt === \"frac\") for (let d = 1; d \u003c= 729; d++){ const n = Math.round(Math.abs(v)*d);\n      if (Math.abs(n/d - Math.abs(v)) \u003c 1e-9){ const s = n + (d > 1 ? \"/\" + d : \"\"); if (s.length \u003c= 7) return (v \u003c 0 ? \"−\" : \"\") + s; break; } }\n    return (+v.toFixed(4)).toString().replace(\"-\", \"−\"); };\n  const sgn = v => (v > 0 ? \"+\" : \"\") + fm(v);\n  const panelOf = ln => ln;\n  // rows needed for travelling-front labels (max simultaneous fronts in one panel over the whole run)\n  let rows = 1;\n  for (let j = 0; j \u003c= 300; j++){ const cnt = {}; for (const f of fronts(j/300*TMAX)){ cnt[f.ln] = (cnt[f.ln] || 0) + 1; rows = Math.max(rows, cnt[f.ln]); } }\n  rows += 1;\n  const L = 50, Rm = cfg.rm || 14, B = 44, gap = 30, Tm = 14 + 24*rows;\n  const totD = order.reduce((s, ln) => s + D(ln), 0), unit = (w - L - Rm - gap*(order.length - 1))/totD;\n  const px = {}, pw = {}; let xx = L;\n  for (const ln of order){ px[ln] = xx; pw[ln] = unit*D(ln); xx += pw[ln] + gap; }\n  const y = v => Tm + (hi - v)/(hi - lo)*(h - Tm - B);\n  const tint = c => { if (c === \"#141821\") return \"rgba(36,86,214,.12)\"; const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},.14)`; };\n  // y axis labels + per-panel grid\n  ctx.font = \"12px system-ui,sans-serif\"; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\"; ctx.fillStyle = \"#6a7180\";\n  for (let v = lo; v \u003c= hi + 1e-9; v += st) ctx.fillText((+v.toFixed(3)).toString().replace(\"-\", \"−\"), L - 8, y(v));\n  for (const ln of order){\n    const x0 = px[ln], x1 = x0 + pw[ln], col = cfg.col(ln);\n    for (let v = lo; v \u003c= hi + 1e-9; v += st){ ctx.strokeStyl gn = e ? \"right\" : \"left\"; ctx.fillText(t, e ? x1 - 3 : x0 + 3, h - B + 6);\n    });\n    ctx.font = \"600 13px system-ui,sans-serif\"; ctx.fillStyle = col === \"#141821\" ? \"#4a5160\" : col; ctx.textAlign = \"center\";\n    ctx.fillText(cfg.name(ln), x0 + pw[ln]/2, h - B + 24);\n  }\n  // travelling fronts: each label goes to the first header row where it collides with nothing\n  const taken = [];\n  for (const f of fronts(S.t)){\n    const col = f.dir > 0 ? \"#2456d6\" : \"#d4442a\", xf = px[f.ln] + f.x*pw[f.ln];\n    const s = (cfg.pre ? cfg.pre(f.ln) : \"\") + sgn(f.amp) + \" V\";\n    ctx.font = \"600 12.5px system-ui,sans-serif\"; const pwd = ctx.measureText(s).width + 10;\n    let xp = xf + f.dir*34, al = f.dir > 0 ? \"left\" : \"right\";\n    if (f.dir > 0 && xp + pwd > w - 2){ xp = xf - 6; al = \"right\"; }\n    if (f.dir \u003c 0 && xp - pwd \u003c 2){ xp = xf + 6; al = \"left\"; }\n    const lo_ = Math.min(xf, al === \"left\" ? xp : xp - pwd) - 4, hi_ = Math.max(xf + f.dir*30, al === \"left\" ? xp + pwd : xp) + 4;\n    let r = 0; while (r \u003c rows - 1 && taken.some(q => q.r === r && q.a \u003c hi_ && lo_ \u003c q.b)) r++;\n    taken.push({r, a: lo_, b: hi_});\n    const ya = Tm - 14 - 24*r;\n    ctx.setLineDash([5, 4]); ctx.strokeStyle = col; ctx.lineWidth = 1.5;\n    ctx.beginPath(); ctx.moveTo(xf, ya); ctx.lineTo(xf, h - B); ctx.stroke(); ctx.setLineDash([]);\n    arrow(ctx, xf, ya, xf + f.dir*28, ya, col);\n    pill(ctx, s, xp, ya, col, al, 12.5);\n  }\n  // output readouts (dots; values are written under the node names)\n  for (const o of cfg.out){\n    const v = V(o.ln, o.x, S.t), xo = px[o.ln] + o.x*pw[o.ln];\n    ctx.fillStyle = o.c; ctx.beginPath(); ctx.arc(xo, y(v), 5.5, 0, 7); ctx.fill(); ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2; ctx.stroke();\n  }\n}\n\u003c/script>\n\n\u003cscript>\n/* reflection-coefficient headers for the bounce diagrams: arrow = direction of the incident wave */\nfunction GFR_(x){\n  if (Math.abs(x) \u003c 1e-9
