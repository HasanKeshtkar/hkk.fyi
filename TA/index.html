* ---------- wave tracing on the network (all delays = 1 ns) ---------- */\nconst par = zs => zs.length ? 1/zs.reduce((s, z) => s + 1/z, 0) : Infinity;\nfunction build(){\n  LN = [{n:[\"A\",\"B\"], Z:50, name:\"AB\"}, {n:[\"B\",\"C\"], Z:50, name:\"BC\"}, {n:[\"C\",\"D\"], Z:50, name:\"CD\"},\n        {n:[\"B\",\"E\"], Z:S.Z, name:\"BE\"}, {n:[\"C\",\"F\"], Z:S.Z, name:\"CF\"}];\n  const att = nd => LN.map((l, i) => ({i, end: l.n.indexOf(nd)})).filter(o => o.end >= 0);\n  PK = [];\n  let cur = new Map();\n  const put = (m, ln, dir, a) => { const k = ln + \"|\" + dir; m.set(k, (m.get(k) || 0) + a); };\n  { const a = att(\"A\"), zin = par(a.map(o => LN[o.i].Z)), v0 = VS*zin/(zin + NODE.A.R);\n    for (const o of a) put(cur, o.i, o.end === 0 ? 1 : -1, v0); }\n  for (let k = 0; k \u003c= TMAX; k++){\n    const nxt = new Map();\n    for (const [key, amp] of cur){\n      if (Math.abs(amp) \u003c 1e-12) continue;\n      const [ln, dir] = key.split(\"|\").map(Number);\n      PK.push({ln, dir, amp, t0:k});\n      const nd = LN[ln].n[dir > 0 ? 1 : 0], others = att(nd).filter(o => o.i !== ln);\n      const zs = others.map(o => LN[o.i].Z); if (NODE[nd].R !== undefined) zs.push(NODE[nd].R);\n      const zeq = par(zs), Z = LN[ln].Z, g = zeq === Infinity ? 1 : (zeq - Z)/(zeq + Z);\n      put(nxt, ln, -dir, amp*g);\n      for (const o of others) put(nxt, o.i, o.end === 0 ? 1 : -1, amp*(1 + g));\n    }\n    cur = nxt;\n  }\n  EV = [...new Set(PK.flatMap(p => [p.t0, p.t0 + 1]).filter(t => t \u003c= TMAX + EPS))].sort((a, b) => a - b);\n}\nfunction V(ln, x, t){\n  let v = 0;\n  for (const p of PK){ if (p.ln !== ln) continue; if (t >= p.t0 + (p.dir > 0 ? x : 1 - x) - EPS) v += p.amp; }\n  return v;\n}\nconst VK = [null, t => V(3, 1, t), t => V(4, 1, t), t => V(2, 1, t)];\nfunction fronts(t){\n  return PK.filter(p => t >= p.t0 - EPS && t \u003c p.t0 + 1 - EPS && t \u003c TMAX - EPS)\n    .map(p => ({...p, x: p.dir > 0 ? t - p.t0 : 1 - (t - p.t0)}));\n}\n\n/* ---------- helpers ---------  to be terminated with \u003ci>R\u003c/i>\u003csub>L\u003c/sub> = \u003ci>Z\u003c/i>\u003csub>02\u003c/sub> at the far end, determine \u003ci>Z\u003c/i>\u003csub>01\u003c/sub>, \u003ci>Z\u003c/i>\u003csub>02\u003c/sub>, the type (e.g., inductance, capacitance, resistance) of the unknown circuit element, and its value (i.e., nH, pF, or Ω). \u003cb>(b)\u003c/b> Find and sketch the voltage across this element.\u003c/p>\n\u003cdiv class=\"figs\">\n\u003csvg class=\"circ\" viewBox=\"0 0 700 215\" font-family=\"system-ui,sans-serif\">\n  \u003cg stroke=\"#141821\" stroke-width=\"2\" fill=\"none\">\n    \u003ccircle cx=\"50\" cy=\"118\" r=\"24\"/>\n    \u003cpath d=\"M40 126 H50 V108 H60\" stroke-width=\"1.8\"/>\n    \u003cpath d=\"M50 94 V52 H78 l5 -8 l10 16 l10 -16 l10 16 l10 -16 l5 8 H140\"/>\n    \u003cpath d=\"M50 142 V178 H140\"/>\n    \u003cpath d=\"M140 52 H330\" stroke-width=\"3\"/>\u003cpath d=\"M140 178 H600\" stroke-width=\"3\"/>\n    \u003crect x=\"336\" y=\"36\" width=\"34\" height=\"32\" rx=\"3\"/>\n    \u003cpath d=\"M376 52 H600\" stroke-width=\"3\"/>\n    \u003cpath d=\"M600 52 H640 V82 l10 6 l-20 10 l20 10 l-20 10 l20 10 l-20 10 l10 6 V178 H600\"/>\n  \u003c/g>\n  \u003cg fill=\"#fff\" stroke=\"#141821\" stroke-width=\"2\">\u003ccircle cx=\"140\" cy=\"52\" r=\"4\"/>\u003ccircle cx=\"140\" cy=\"178\" r=\"4\"/>\u003c/g>\n  \u003ctext x=\"353\" y=\"58\" text-anchor=\"middle\" font-size=\"17\">?\u003c/text>\n  \u003ctext x=\"353\" y=\"92\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6a7180\">unknown lumped\u003c/text>\n  \u003ctext x=\"353\" y=\"108\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6a7180\">series element\u003c/text>\n  \u003ctext x=\"50\" y=\"86\" text-anchor=\"middle\" font-size=\"15\">+\u003c/text>\n  \u003ctext x=\"50\" y=\"160\" text-anchor=\"middle\" font-size=\"15\">−\u003c/text>\n  \u003ctext x=\"20\" y=\"123\" font-size=\"15\" font-style=\"italic\" text-anchor=\"end\">V\u003ctspan font-size=\"11\" dy=\"4\">0\u003c/tspan>\u003c/text>\n  \u003ctext x=\"98\" y=\"34\" text-anchor=\"middle\" font-size=\"15\" font-style=\"italic\">R\u003ctspan font-size=\"11\" dy=\"4\">s\u003c/tspan>\u003c/text>\n  \u003ctext x=\"160\" y=\"82\" font-size=\"16\">+\u003c/text>\n  \u003ctext x=\"156\" y=\"122\" font-size=\"16\" font-style=\"italic\">V\u003ctspan font-size=\"12\" dy=\"4\">s\u003c/tspan>\u003c/text>\n  \u003ctext x=\"161\" y=\"160\" font-size=\"18\">−\u003c/text>\n  \u003ctext x=\"235\" y=\"40\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\">Z\u003ctspan font-size=\"12\" dy=\"4\">01\u003c/tspan>\u003c/text>\n  \u003ctext x=\"488\" y=\"40\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\">Z\u003ctspan font-size=\"12\" dy=\"4\">02\u003c/tspan>\u003c/text>\n  \u003ctext x=\"662\" y=\"124\" font-size=\"16\" font-style=\"italic\">Z\u003ctspan font-size=\"12\" dy=\"4\">02\u003c/tspan>\u003c/text>\n\u003c/svg>\n\u003csvg class=\"vsfig\" viewBox=\"0 0 380 200\" font-family=\"system-ui,sans-serif\">\n  \u003cg stroke=\"#141821\" stroke-width=\"1.6\" fill=\"none\">\n    \u003cpath d=\"M60 170 H360\"/>\u003cpath d=\"M354 166 l6 4 l-6 4\"/>\n    \u003cpath d=\"M70 180 V20\"/>\u003cpath d=\"M66 26 l4 -6 l4 6\"/>\n    \u003cpath d=\"M70 170 V110 H150 V40 C170 100 200 140 340 140\" stroke-width=\"2.4\"/>\n  \u003c/g>\n  \u003cg stroke=\"#9aa1af\" stroke-dasharray=\"4 4\">\u003cpath d=\"M70 40 H150\"/>\u003cpath d=\"M70 140 H340\"/>\u003cpath d=\"M150 110 V170\"/>\u003c/g>\n  \u003ctext x=\"80\" y=\"22\" font-size=\"14\" font-style=\"italic\">V\u003ctspan font-size=\"10\" dy=\"3\">s\u003c/tspan>\u003ctspan dy=\"-3\">(t)\u003c/tspan>\u003c/text>\n  \u003ctext x=\"62\" y=\"44\" text-anchor=\"end\" font-size=\"13\" font-style=\"italic\">V₀\u003c/text>\n  \u003ctext x=\"62\" y=\"114\" text-anchor=\"end\" font-size=\"13\" font-style=\"italic\">V₀/2\u003c/text>\n  \u003ctext x=\"62\" y=\"144\" text-anchor=\"end\" font-size=\"13\" font-style=\"italic\">V₀/4\u003c/text>\n  \u003ctext x=\"150\" y=\"188\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\">t₁\u003c/text>\n  \u003ctext x=\"200\" y=\"80\" font-size=\"13\" font-style=\"italic\">V₀e\u003ctspan font-size=\"10\" dy=\"-6\">−10(t−t₁)\u003c/tspan>\u003c/text>\n  \u003ctext x=\"340\" y=\"188\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\">t (ns)\u003c/text>\n\u003c/svg>\n\u003c/div>\n\u003cdiv class=\"sol\">\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003ci>V\u003c/i>\u003csub>s\u003c/sub>(0\u003csup>+\u003c/sup>) = \u003ci>V\u003c/i>\u003csub>0\u003c/sub>\u003cspan class=\"fr\">\u003cspan>\u003ci>Z\u003c/i>\u003csub>01\u003c/sub>\u003c/span>\u003cspan>\u003ci>Z\u003c/i>\u003csub>01\u003c/sub> + 50\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan>\u003ci>V\u003c/i>\u003csub>0\u003c/sub>\u003c/span>\u003cspan>2\u003c/span>\u003c/span>\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003cspan class=\"box\">\u003ci>Z\u003c/i>\u003csub>01\u003c/sub> = 50 Ω\u003c/span> &nbsp;(\u003ci>Γ\u003c/i>\u003csub>s\u003c/sub> = 0),\u003c/span> \u003cspan class=\"sg arr\">\u003ci>t\u003c/i>\u003csub>1\u003c/sub> = 2\u003ci>t\u003c/i>\u003csub>d1\u003c/sub>\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003ci>t\u003c/i> = \u003ci>t\u003c/i>\u003csub>1\u003c/sub>\u003csup>+\u003c/sup>:&ensp;\u003ci>V\u003c/i>\u003csub>s\u003c/sub> = \u003ci>V\u003c/i>\u003csub>0\u003c/sub>\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003ci>Γ\u003c/i>(0\u003csup>+\u003c/sup>) = +1 (open)\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003cspan class=\"box\">series inductor \u003ci>L\u003c/i>\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003ci>t\u003c/i> → ∞:&ensp;\u003ci>V\u003c/i>\u003csub>s\u003c/sub> = \u003cspan class=\"fr\">\u003cspan>\u003ci>V\u003c/i>\u003csub>0\u003c/sub>\u003c/span>\u003cspan>4\u003c/span>\u003c/span>\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003ci>Γ\u003c/i>(∞) = −\u003cspan class=\"fr\">\u003cspan>1\u003c/span>\u003cspan>2\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan>\u003ci>Z\u003c/i>\u003csub>02\u003c/sub> − 50\u003c/span>\u003cspan>\u003ci>Z\u003c/i>\u003csub>02\u003c/sub> + 50\u003c/span>\u003c/span>\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003cspan class=\"box\">\u003ci>Z\u003c/i>\u003csub>02\u003c/sub> = \u003cspan class=\"fr\">\u003cspan>50\u003c/span>\u003cspan>3\u003c/span>\u003c/span> ≈ 16.7 Ω\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003ci>τ\u003c/i> = \u003cspan class=\"fr\">\u003cspan>\u003ci>L\u003c/i>\u003c/span>\u003cspan>\u003ci>Z\u003c/i>\u003csub>01\u003c/sub> + \u003ci>Z\u003c/i>\u003csub>02\u003c/sub>\u003c/span>\u003c/span> = 0.1 ns\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003cspan class=\"box\">\u003ci>L\u003c/i> = 0.1 ns × \u003cspan class=\"fr\">\u003cspan>200\u003c/span>\u003cspan>3\u003c/span>\u003c/span> Ω ≈ 6.67 nH\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003ci>V\u003c/i>\u003csub>s\u003c/sub>(\u003ci>t\u003c/i>) = \u003cspan class=\"fr\">\u003cspan>\u003ci>V\u003c/i>\u003csub>0\u003c/sub>\u003c/span>\u003cspan>4\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan>3\u003ci>V\u003c/i>\u003csub>0\u003c/sub>\u003c/span>\u003cspan>4\u003c/span>\u003c/span>\u003ci>e\u003c/i>\u003csup>−10(\u003ci>t\u003c/i>−\u003ci>t\u003c/i>\u003csub>1\u003c/sub>)\u003c/sup>,\u003c/span> \u003cspan class=\"sg arr\">\u003ci>t\u003c/i> &gt; \u003ci>t\u003c/i>\u003csub>1\u003c/sub>\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003cb style=\"font-family:system-ui\">(b)\u003c/b>&ensp;the step reaches the element at \u003ci>t\u003c/i>\u003csub>d1\u003c/sub> = \u003ci>t\u003c/i>\u003csub>1\u003c/sub>/2; &nbsp;\u003ci>s\u003c/i> = \u003ci>t\u003c/i> − \u003ci>t\u003c/i>\u003csub>1\u003c/sub>/2,\u003c/span> \u003cspan class=\"sg arr\">\u003ci>τ\u003c/i> = 0.1 ns\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003ci>v\u003c/i>\u003csub>L\u003c/sub> = \u003ci>V\u003c/i>\u003csub>1\u003c/sub>(ℓ\u003csub>1\u003c/sub>) − \u003ci>V\u003c/i>\u003csub>2\u003c/sub>(0) = [\u003cspan class=\"fr\">\u003cspan>\u003ci>V\u003c/i>\u003csub>0\u003c/sub>\u003c/span>\u003cspan>4\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan>3\u003ci>V\u003c/i>\u003csub>0\u003c/sub>\u003c/span>\u003cspan>4\u003c/span>\u003c/span>\u003ci>e\u003c/i>\u003csup>−\u003ci>s\u003c/i>/\u003ci>τ\u003c/i>\u003c/sup>] − \u003cspan class=\"fr\">\u003cspan>\u003ci>V\u003c/i>\u003csub>0\u003c/sub>\u003c/span>\u003cspan>4\u003c/span>\u003c/span>(1 − \u003ci>e\u003c/i>\u003csup>−\u003ci>s\u003c/i>/\u003ci>τ\u003c/i>\u003c/sup>)\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003cspan class=\"box\">\u003ci>v\u003c/i>\u003csub>L\u003c/sub>(\u003ci>t\u003c/i>) = \u003ci>V\u003c/i>\u003csub>0\u003c/sub>\u003ci>e\u003c/i>\u003csup>−10(\u003ci>t\u003c/i> − \u003ci>t\u003c/i>\u003csub>1\u003c/sub>/2)\u003c/sup>\u003c/span>\u003c/span> \u003cspan class=\"sg gap\">\u003ci>t\u003c/i> &gt; \u003ci>t\u003c/i>\u003csub>1\u003c/sub>/2 &nbsp;(\u003ci>t\u003c/i> in ns)\u003c/span>\u003c/div>\n\u003cp class=\"note\">At \u003ci>s\u003c/i> = 0 the inductor is open, so the full Thevenin voltage 2·(V₀/2) = V₀ appears across it; it then decays with τ = L/(Z₀₁+Z₀₂).\u003c/p>\n\u003cp class=\"note\">The label V₀e\u003csup>−10(t−t₁)\u003c/sup> in the figure gives only the decay rate; the exact curve goes from V₀ down to V₀/4.\u003c/p>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"right\">\n\u003cdiv class=\"bar\">\n  \u003cbutton id=\"bPrev\">◀\u003c/button>\n  \u003cbutton id=\"bPlay\" style=\"min-width:44px\">▶\u003c/button>\n  \u003cbutton id=\"bNext\">▶|\u003c/button>\n  \u003cinput type=\"range\" id=\"ts\" min=\"0\" max=\"2\" step=\"0.001\" value=\"0\">\n  \u003cspan id=\"tr\">t = 0.000 ns\u003c/span>\n\u003c/div>\n\u003cdiv class=\"cv line\">\u003ccanvas id=\"cLine\">\u003c/canvas>\u003c/div>\n\u003cdiv class=\"two\">\n  \u003cdiv class=\"cv\" style=\"flex:470 1 0\">\u003ccanvas id=\"cBounce\" style=\"cursor:ns-resize\">\u003c/canvas>\u003c/div>\n  \u003cdiv class=\"col\">\n    \u003cdiv class=\"cv\" style=\"flex:232 1 0\">\u003ccanvas class=\"tp\" data-k=\"0\" style=\"cursor:ew-resize\">\u003c/canvas>\u003c/div>\n    \u003cdiv class=\"cv\" style=\"flex:232 1 0\">\u003ccanvas class=\"tp\" data-k=\"1\" style=\"cursor:ew-resize\">\u003c/canvas>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cp class=\"note\">Animation uses t₁ = 1 ns (t\u003csub>d1\u003c/sub> = 0.5 ns), t\u003csub>d2\u003c/sub> = 0.5 ns, V₀ = 1.\u003c/p>\n\n\u003c/section>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  /* shrink/grow the left column so statement + figure + solution always fit without scrolling */\n  const L = document.querySelector(\".left\");\n  function fits(){ return L.scrollHeight \u003c= L.clientHeight + 1 && L.scrollWidth \u003c= L.clientWidth + 1; }\n  function fit(){\n    let lo = 9, hi = 23;\n    for (let i = 0; i \u003c 14; i++){ const m = (lo + hi)/2; L.style.fontSize = m + \"px\"; if (fits()) lo = m; else hi = m; }\n    L.style.fontSize = lo + \"px\";\n    document.documentElement.dataset.fs = lo.toFixed(2);\n  }\n  window.__fit = fit;\n  fit();\n  if (document.fonts){ document.fonts.ready.then(() => { fit(); window.dispatchEvent(new Event(\"resize\")); }); }\n  window.addEventListener(\"resize\", fit);\n  /* slide navigation keys go to the deck */\n  const NAV = [\"PageDown\",\"PageUp\",\"ArrowDown\",\"ArrowUp\",\"Home\",\"End\",\"f\",\"F\",\"l\",\"L\"];\n  document.addEventListener(\"keydown\", e => {\n    if (!NAV.includes(e.key) || e.ctrlKey || e.metaKey || e.altKey) return;\n    e.preventDefault(); e.stopImmediatePropagation();\n    parent.postMessage({deckKey: e.key}, \"*\");\n  }, true);\n})();\n\u003c/script>\n\u003cscript>\n/* laser pointer: glowing red dot + short fading trail that follows the mouse (toggle with L) */\n(function(){\n  const cv = document.createElement(\"canvas\");\n  cv.style.cssText = \"position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:2147483647\";\n  const st = document.createElement(\"style\");\n  st.textContent = \"html.laser-on, html.laser-on *{cursor:none !important}\";\n  document.head.appendChild(st);\n  const add = () => document.body.appendChild(cv);\n  document.body ? add() : addEventListener(\"DOMContentLoaded\", add);\n  const ctx = cv.getContext(\"2d\");\n  let on = true, pts = [], cur = null, raf = 0, W = 0, H = 0;\n  const TRAIL = 260;\n  function size(){ const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = Math.round(W*d); cv.height = Math.round(H*d); ctx.setTransform(d, 0, 0, d, 0, 0); }\n  size(); addEventListener(\"resize\", () => { size(); draw(); });\n  function dot(x, y){\n    const g = ctx.createRadialGradient(x, y, 0, x, y, 20);\n    g.addColorStop(0, \"rgba(255,40,40,.55)\"); g.addColorStop(.45, \"rgba(255,30,30,.22)\"); g.addColorStop(1, \"rgba(255,0,0,0)\");\n    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill();\n    ctx.fillStyle = \"#ff1f1f\"; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill();\n    ctx.fillStyle = \"rgba(255,235,235,.95)\"; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 7); ctx.fill();\n  }\n  function draw(){\n    raf = 0;\n    ctx.clearRect(0, 0, W, H);\n    if (!on) return;\n    const now = performance.now();\n    pts = pts.filter(p => now - p.t \u003c TRAIL);\n    ctx.lineCap = \"round\"; ctx.lineJoin = \"round\";\n    for (let i = 1; i \u003c pts.length; i++){\n      const a = 1 - (now - pts[i].t)/TRAIL;\n      ctx.strokeStyle = `rgba(255,30,30,${(.55*a).toFixed(3)})`; ctx.lineWidth = 1 + 7*a;\n      ctx.beginPath(); ctx.moveTo(pts[i-1].x, pts[i-1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();\n    }\n    if (cur) dot(cur.x, cur.y);\n    if (pts.length > 1) raf = requestAnimationFrame(draw);\n  }\n  const kick = () => { if (!raf) raf = requestAnimationFrame(draw); };\n  addEventListener(\"pointermove\", e => {\n    if (!on) return;\n    cur = {x: e.clientX, y: e.clientY}; pts.push({x: cur.x, y: cur.y, t: performance.now()}); kick();\n  }, true);\n  const hide = () => { cur = null; pts = []; kick(); };\n  document.addEventListener(\"mouseleave\", hide);\n  document.addEventListener(\"mouseout\", e => { if (!e.relatedTarget || e.relatedTarget.tagName === \"IFRAME\") hide(); });\n  window.__laser = v => { on = v; document.documentElement.classList.toggle(\"laser-on\", on); if (!on) hide(); kick(); };\n  window.__laser(true);\n  addEventListener(\"message\", e => { if (e.data && typeof e.data.laser === \"boolean\") window.__laser(e.data.laser); });\n})();\n\u003c/script>\n\u003cscript>\n/* bounce-diagram amplitude labels: placed along their own wave line, never on top of another label or a crossing */\nlet PQL_ = [];\nfunction PQ_(ctx, s, xa, ya, xb, yb, col, fs, ymax){ PQL_.push({s, xa, ya, xb, yb, col, fs, ymax}); }\nfunction PQF_(ctx){\n  const segs = PQL_.map(it => { let xb = it.xb, yb = it.yb; if (yb > it.ymax){ const f = (it.ymax - it.ya)/(yb - it.ya); xb = it.xa + (xb - it.xa)*f; yb = it.ymax; } return [it.xa, it.ya, xb, yb]; });\n  const hit = (r, s) => { // Liang-Barsky segment / rectangle test\n    let t0 = 0, t1 = 1; const dx = s[2] - s[0], dy = s[3] - s[1];\n    for (const [p, q] of [[-dx, s[0] - r.x0], [dx, r.x1 - s[0]], [-dy, s[1] - r.y0], [dy, r.y1 - s[1]]]){\n      if (Math.abs(p) \u003c 1e-12){ if (q \u003c 0) return false; continue; }\n      const t = q/p; if (p \u003c 0){ if (t > t1) return false; if (t > t0) t0 = t; } else { if (t \u003c t0) return false; if (t \u003c t1) t1 = t; } }\n    return true; };\n  const F = [0.5, 0.38, 0.62, 0.28, 0.72, 0.44, 0.56, 0.2, 0.8, 0.33, 0.67];\n  const placed = [];\n  PQL_.forEach((it, i) => {\n    ctx.font = `600 ${it.fs}px system-ui,sans-serif`;\n    const w = ctx.measureText(it.s).width + 10, h = it.fs 5, \"V₀/2\"], [0.75, \"\"], [1, \"V₀\"]];\nfunction yAxis(ctx, y, x0, x1, fs = 12, lo = -0.25){\n  ctx.font = fs + \"px system-ui,sans-serif\"; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\";\n  for (const [v, s] of TICK){ if (v \u003c lo - 1e-9) continue;\n    ctx.strokeStyle = v === 0 ? C.axis : C.grid; ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.moveTo(x0, y(v)); ctx.lineTo(x1, y(v)); ctx.stroke();\n    ctx.fillStyle = C.mut; ctx.fillText(s, x0 - 6, y(v)); }\n}\nfunction pill(ctx, s, x, y, col, al = \"center\", fs = 13){\n  ctx.font = `600 ${fs}px system-ui,sans-serif`;\n  const w = ctx.measureText(s).width + 10, h = fs + 7, x0 = al === \"center\" ? x - w/2 : al === \"left\" ? x : x - w;\n  ctx.fillStyle = \"#fff\"; ctx.strokeStyle = col; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.roundRect(x0, y - h/2, w, h, 5); ctx.fill(); ctx.stroke();\n  ctx.fillStyle = col; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(s, x0 + w/2, y + .5);\n}\nfunction arrow(ctx, x1, y1, x2, y2, col){\n  ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();\n  const a = Math.atan2(y2 - y1, x2 - x1);\n  ctx.beginPath(); ctx.moveTo(x2, y2);\n  ctx.lineTo(x2 - 11*Math.cos(a - .42), y2 - 11*Math.sin(a - .42));\n  ctx.lineTo(x2 - 11*Math.cos(a + .42), y2 - 11*Math.sin(a + .42)); ctx.fill();\n}\n\n/* ---------- line view: line 1 on [0,1], L, line 2 on [G, G+1] ---------- */\nconst G = 1.1;\nfunction drawLine(){\n  const {ctx, w, h} = setup(document.getElementById(\"cLine\"));\n  const L = 64, Rm = 120, Tm = 50, B = 30, lo = -0.25, hi = 1.15;\n  const X = u => L + u/(G + 1)*(w - L - Rm), y = v => Tm + (hi - v)/(hi - lo)*(h - Tm - B);\n  yAxis(ctx, y, L, w - Rm);\n  ctx.strokeStyle = C.tot; ctx.lineWidth = 3;\n  for (const u of [0, 1, G, G + 1]){ ctx.beginPath(); ctx.moveTo(X(u), Tm - 4); ctx.lineTo(X(u), h - B + 4); ctx.stroke(); }\n  // inductor\n  const xm = (X(1) + X(G))/2, yc = y(0);\n  ctx.fillStyle = \"#fff\"; ctx.fillRect(X(1) + 3, Tm - 4, X(G) - X(1) - 6, h - Tm - B + 8);\n  ctx.strokeStyle = C.tot; ctx.lineWidth = 2; ctx.beginPath();\n  const lw = (X(G) - X(1) - 10)/4;\n  for (let k = 0; k \u003c 4; k++) ctx.arc(X(1) + 5 + lw*(k + .5), yc, lw/2, Math.PI, 0);\n  ctx.stroke();\n  ctx.font = \"600 14px system-ui,sans-serif\"; ctx.fillStyle = C.tot; ctx.textAlign = \"center\"; ctx.textBaseline = \"bottom\"; ctx.fillText(\"L\", xm, yc - lw/2 - 4);\n  ctx.font = \"13px system-ui,sans-serif\"; ctx.fillStyle = C.mut; ctx.textBaseline = \"top\";\n  ctx.fillText(\"line 1 (Z₀₁ = 50 Ω)\", X(.5), h - B + 8); ctx.fillText(\"line 2 (Z₀₂ = 50/3 Ω)\", X(G + .5), h - B + 8);\n  const N = 500;\n  const draw = (fn, off, col, wd, dash, fill) => {\n    ctx.beginPath(); ctx.moveTo(X(off), y(fn(0)));\n    for (let j = 1; j \u003c= N; j++) ctx.lineTo(X(off + j/N), y(fn(j/N)));\n    if (fill){ ctx.lineTo(X(off + 1), y(0)); ctx.lineTo(X(off), y(0)); ctx.closePath(); ctx.fillStyle = \"rgba(36,86,214,.12)\"; ctx.fill(); return; }\n    ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]);\n  };\n  draw(z => V1(z, S.t), 0, null, 0, null, true); draw(z => V2(z, S.t), G, null, 0, null, true);\n  if (S.t > TD1) draw(z => V1b(z, S.t), 0, C.bwd, 2, [6, 4]);\n  draw(z => V1(z, S.t), 0, C.tot, 3); draw(z => V2(z, S.t), G, C.tot, 3);\n  if (S.t > TD1){ ctx.font = \"600 12.5px system-ui,sans-serif\"; ctx.fillStyle = C.bwd; ctx.textAlign = \"left\"; ctx.textBaseline = \"top\";\n    ctx.fillText(\"- - reflected wave\", X(0) + 8, y(-0.25) + 4); }\n  // fronts\n  const ya = Tm - 22;\n  const front = (xf, dir, col, txt) => {\n    ctx.setLineDash([5, 4]); ctx.strokeStyle = col; ctx.lineWidth = 1.4;\n    ctx.beginPath(); ctx.moveTo(xf, ya); ctx.lineTo(xf, h - B); ctx.stroke(); ctx.setLineDash([]);\n    arrow(ctx, xf, ya, xf + dir*34, ya, col); pill(ctx, txt, xf + dir*40, ya, col, dir > 0 ? \"left\" : \"right\", 12.5);\n  };\n  if (S.t \u003c TD1) front(X(S.t/TD1), 1, C.fwd, \"V₀/2\");\n  else if (S.t \u003c 2*TD1){\n    front(X(1 - (S.t - TD1)/TD1), -1, C.bwd, \"Γ(0⁺) = +1\");\n    front(X(G + (S.t - TD1)/TD2), 1, C.tr, \"starts at 0\");\n  }\n  ctx.font = \"600 14px system-ui,sans-serif\"; ctx.textAlign = \"left\"; ctx.textBaseline = \"middle\";\n  const vl = VL(S.t); ctx.fillStyle = C.vl; ctx.textAlign = \"right\"; ctx.fillText(\"V(R_L) = \" + dec(vl) + \" V₀\", X(G + 1) - 10, y(vl) - 16);\n  ctx.fillStyle = C.vs; ctx.beginPath(); ctx.arc(X(0), y(Vs(S.t)), 5.5, 0, 7); ctx.fill();\n}\n\n/* ---------- lattice ---------- */\nlet BG;\nfunction drawBounce(){\n  const {ctx, w, h} = setup(document.getElementById(\"cBounce\"));\n  const L = 56, Rm = 16, Tm = 74, B = 14, gap = 22, pw = (w - L - Rm - gap)/2;\n  const x1 = z => L + z*pw, x2 = z => L + pw + gap + z*pw, y = t => Tm + t/TMAX*(h - Tm - B);\n  BG = {y0: Tm, y1: h - B};\n  ctx.font = \"12px system-ui,sans-serif\"; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\";\n  for (const t of EV){ ctx.strokeStyle = C.grid; ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.moveTo(x1(0), y(t)); ctx.lineTo(x2(1), y(t)); ctx.stroke();\n    ctx.fillStyle = C.mut; ctx.fillText(dec(t, 1) + \" ns\", L - 6, y(t)); }\n  ctx.strokeStyle = C.tot; ctx.lineWidth = 3;\n  for (const xx of [x1(0), x1(1), x2(0), x2(1)]){ ctx.beginPath(); ctx.moveTo(xx, y(0)); ctx.lineTo(xx, y(TMAX)); ctx.stroke(); }\n  ctx.font = \"600 13px system-ui,sans-serif\"; ctx.fillStyle = C.tot; ctx.textAlign = \"center\"; ctx.textBaseline = \"bottom\";\n  ctx.fillText(\"line 1\", x1(.5), Tm - 52); ctx.fillText(\"line 2\", x2(.5), Tm - 52); ctx.fillText(\"L\", (x1(1) + x2(0))/2, Tm - 52);\n  ctx.font = \"12px system-ui,sans-serif\"; ctx.fillStyle = C.mut;\n  GHDR_(ctx, [{x:x1(0), dir:-1, t:\"Γs = 0\", w:pw}, {x:x1(1), dir:1, t:\"Γ(0⁺) = +1 (L open)\", w:pw}, {x:x2(1), dir:1, t:\"Γ = 0 (matched)\", w:pw}], Tm);\n  const seg = (xa, ta, xb, tb, col, lbl, ly) => {\n    ctx.strokeStyle = col; ctx.globalAlpha = .22; ctx.lineWidth = 2;\n    ctx.beginPath(); ctx.moveTo(xa, y(ta)); ctx.lineTo(xb, y(tb)); ctx.stroke(); ctx.globalAlpha = 1;\n    if (S.t > ta){ const tp = Math.min(S.t, tb), xp = xa + (xb - xa)*(tp - ta)/(tb - ta);\n      ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(xa, y(ta)); ctx.lineTo(xp, y(tp)); ctx.stroke(); }\n    pill(ctx, lbl, (xa + xb)/2, y(ly), col, \"center\", 12);\n  };\n  seg(x1(0), 0, x1(1), TD1, C.fwd, \"V₀/2\", TD1/2);\n  seg(x1(1), TD1, x1(0), 2*TD1, C.bwd, \"−V₀/4 + ¾V₀e^(−s/τ)\", 1.5*TD1);\n  seg(x2(0), TD1, x2(1), TD1 + TD2, C.tr, \"¼V₀(1 − e^(−s/τ))\", TD1 + TD2/2 + .12);\n  const yt = y(S.t);\n  ctx.strokeStyle = \"#e0262f\"; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);\n  ctx.beginPath(); ctx.moveTo(x1(0), yt); ctx.lineTo(x2(1), yt); ctx.stroke(); ctx.setLineDash([]);\n  const dot = (xx, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(xx, yt, 6, 0, 7); ctx.fill(); ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2; ctx.stroke(); };\n  if (S.t \u003c TD1) dot(x1(S.t/TD1), C.fwd);\n  else if (S.t \u003c 2*TD1){ dot(x1(1 - (S.t - TD1)/TD1), C.bwd); dot(x2((S.t - TD1)/TD2), C.tr); }\n  ctx.font = \"12px system-ui,sans-serif\"; ctx.fillStyle = C.mut; ctx.textAlign = \"center\"; ctx.textBaseline = \"top\";\n  ctx.fillText(\"s = time since front left L\", x1(.5), y(1.55)); ctx.fillText(\"τ = L/(Z₀₁+Z₀₂) = 0.1 ns\", x1(.5), y(1.55) + 18);\n}\n\n/* ---------- time plots ---------- */\nlet TG;\nfunction plotT(c, k){\n  const {ctx, w, h} = setup(c), fn = k ? VEL : Vs, col = k ? C.vl : C.vs;\n  const L = 52, Rm = 16, Tm = 22, B = 32, lo = 0, hi = 1.15;\n  const x = t => L + t/TMAX*(w - L - Rm), y = v => Tm + (hi - v)/(hi - lo)*(h - Tm - B);\n  TG = {x0: L, x1: w - Rm};\n  yAxis(ctx, y, L, w - Rm, 11.5, 0);\n  ctx.font = \"11.5px system-ui,sans-serif\"; ctx.fillStyle = C.mut; ctx.textAlign = \"center\"; ctx.textBaseline = \"top\";\n  for (const t of EV){ ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x(t), Tm); ctx.lineTo(x(t), h - B); ctx.stroke();\n    ctx.fillText(dec(t, 1) + (t === 1 && !k ? \" = t₁\" : t === 0.5 && k ? \" = t₁/2\" : \"\"), x(t), h - B + 4); }\n  ctx.fillText(\"t (ns)\", (L + w - Rm)/2, h - B + 18);\n  const path = () => { ctx.beginPath(); ctx.moveTo(x(0), y(fn(0)));\n    let pv = fn(0);\n    for (let j = 1; j \u003c= 1600; j++){ const t = j/1600*TMAX, v = fn(t); if (Math.abs(v - pv) > .05) ctx.lineTo(x(t), y(pv)); ctx.lineTo(x(t), y(v)); pv = v; } };\n  ctx.strokeStyle = col; ctx.globalAlpha = .22; ctx.lineWidth = 3; path(); ctx.stroke(); ctx.globalAlpha = 1;\n  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, x(S.t), h); ctx.clip(); ctx.lineWidth = 3.2; path(); ctx.stroke(); ctx.restore();\n  ctx.font = \"600 13px system-ui,sans-serif\"; ctx.fillStyle = C.tot; ctx.textAlign = \"left\"; ctx.textBaseline = \"bottom\";\n  if (!k) ctx.fillText(\"V₀/4 + ¾V₀ e^(−10(t−t₁))\", x(1.12), y(0.62));\n  else ctx.fillText(\"V₀ e^(−10(t − t₁/2))\", x(0.66), y(0.6));\n  ctx.font = \"600 14px system-ui,sans-serif\"; ctx.fillStyle = col; ctx.textBaseline = \"top\"; ctx.fillText(k ? \"v_L(t)  across the inductor (part b)\" : \"V_s(t)\", L + 6, 2);\n  const xc = x(S.t), v = fn(S.t);\n  ctx.strokeStyle = \"#e0262f\"; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);\n  ctx.beginPath(); ctx.moveTo(xc, Tm); ctx.lineTo(xc, h - B); ctx.stroke(); ctx.setLineDash([]);\n  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(xc, y(v), 5, 0, 7); ctx.fill(); ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2; ctx.stroke();\n}\n\n/* ---------- ui ---------- */\nconst $ = id => document.getElementById(id);\nfunction render(){\n  $(\"tr\").textContent = \"t = \" + S.t.toFixed(3) + \" ns\"; $(\"ts\").value = S.t;\n  $(\"bPlay\").textContent = S.playing ? \"❚❚\" : \"▶\";\n  drawLine(); drawBounce();\n  document.querySelectorAll(\".tp\").forEach(c => plotT(c, +c.dataset.k));\n}\nfunction setT(t){ S.t = Math.min(Math.max(t, 0), TMAX); render(); }\nlet last = null;\nfunction tick(ts){\n  if (!S.playing){ last = null; return; }\n  if (last !== null){ let t = S.t + (ts - last)/1000*S.speed; if (t >= TMAX){ t = TMAX; S.playing = false; } S.t = t; render(); }\n  last = ts; requestAnimationFrame(tick);\n}\nfunction play(on){ S.playing = on === undefined ? !S.playing : on; if (S.playing){ if (S.t >= TMAX - 1e-6) S.t = 0; requestAnimationFrame(tick); } render(); }\nconst next = () => { play(false); const e = EV.find(t => t > S.t + 1e-6); setT(e === undefined ? TMAX : e); };\nconst prev = () => { play(false); const e = [...EV].reverse().find(t => t \u003c S.t - 1e-6); setT(e === undefined ? 0 : e); };\n$(\"bPlay\").onclick = () => play(); $(\"bNext\").onclick = next; $(\"bPrev\").onclick = prev;\n$(\"ts\").oninput = e => { play(false); setT(+e.target.value); };\nfunction drag(c, fn){\n  let d = false; const go = e => { const r = c.getBoundingClientRect(); fn(e.clientX - r.left, e.clientY - r.top); };\n  c.addEventListener(\"pointerdown\", e => { d = true; play(false); c.setPointerCapture(e.pointerId); go(e); });\n  c.addEventListener(\"pointermove\", e => d && go(e)); c.addEventListener(\"pointerup\", () => d = false);\n}\ndrag($(\"cBounce\"), (x, y) => setT((y - BG.y0)/(BG.y1 - BG.y0)*TMAX));\ndocument.querySelectorAll(\".tp\").forEach(c => drag(c, x => setT((x - TG.x0)/(TG.x1 - TG.x0)*TMAX)));\ndocument.addEventListener(\"keydown\", e => {\n  if (e.code === \"Space\"){ e.preventDefault(); play(); }\n  else if (e.key === \"ArrowRight\"){ e.preventDefault(); e.shiftKey ? setT(S.t + .01) : next(); }\n  else if (e.key === \"ArrowLeft\"){ e.preventDefault(); e.shiftKey ? setT(S.t - .01) : prev(); }\n});\nwindow.addEventListener(\"resize\", render);\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n",

dius:7px;padding:2px 12px}\nh3{font-size:17px;margin:22px 0 4px;text-align:center}\ntable{border-collapse:collapse;margin:10px auto;font-variant-numeric:tabular-nums}\nth,td{border:1px solid var(--line);padding:6px 14px;text-align:center}\nth{background:#f5f6f9;font-weight:600;font-size:14.5px}\n\n/*FONTS*/\n:root{--math:\"STIXT\",\"STIXM\",\"Cambria Math\",\"Times New Roman\",serif}\nhtml,body{height:100%;overflow:hidden}\n.wrap{max-width:none;height:100vh;margin:0;padding:10px 18px 12px;display:flex;flex-direction:column;gap:8px}\n.top{margin:0!important;flex:0 0 auto;gap:8px 12px}\nh1{font-size:21px;margin:0 6px 0 0;white-space:nowrap}\n.given{margin-right:auto;font-size:14.5px}\n.top button{font-size:14.5px;padding:4px 11px}\n.main{flex:1 1 0;min-height:0;display:grid;grid-template-columns:var(--lw,44%) minmax(0,1fr);gap:18px}\n.left{min-height:0;min-width:0;overflow:hidden;display:block;font-size:16px;padding-right:16px;border-right:1px solid var(--line)}\n.left>*{margin-bottom:.6em!important}\n.left>.sol{margin-bottom:0!important}\n.sg{display:inline-block;white-space:nowrap}\n.sg.gap{margin:0 .7em}\n.sg.arr{margin:0 .12em}\n.sg.lbl{display:inline;white-space:normal}\n.sg.arr+.sg.arr{margin-left:.12em}\n.right{min-height:0;min-width:0;display:flex;flex-direction:column;gap:6px}\n.bar{margin:0;flex:0 0 auto}\n.cv{position:relative;min-height:0;min-width:0}\n.cv>canvas{position:absolute;left:0;top:0;width:100%;height:100%}\n.cv.line{flex:0 0 30%}\n.two{flex:1 1 0;min-height:0;margin:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:12px}\n@media(max-width:900px){.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}\n.two>.cv{height:100%}\n.col{display:flex;flex-direction:column;gap:4px;min-height:0;height:100%}\n.right .note{font-size:13px;margin:0;flex:0 0 auto}\n/* left column: everything in em so the auto-fit scales it as one unit */\n.stmt{font-size:1em;line-height:1.45;margin:0;max-width:none}\n.stmt i,.eq i{font-family:var(--math);font-size:1.06em}\n.figs{display:flex;align-items:center;justify-content:center;gap:1.2em;flex-wrap:nowrap;margin:0}\n.circ{display:block;margin:0 auto;width:100%;height:auto;max-width:var(--cw,36em);flex:0 1 auto}\n.figs .circ{margin:0;max-width:none;flex:1.9 1 0;min-width:0}\n.figs .tdr,.figs .vsfig{max-width:none;flex:1 1 0;min-width:0;height:auto}\n.sol{border-top:1px solid var(--line);padding-top:.35em;display:flex;flex-direction:column}\n.sol .eq{font-size:1.2em;line-height:1.9;margin:.18em 0;text-align:center}\n.eq{font-family:var(--math)}\n.sol .eq b{font-size:.85em}\nsub,sup{line-height:0}\n.fr{line-height:1.2;margin:0 .12em}\n.fr>span:first-child{border-bottom:.075em solid currentColor;padding:0 .2em .05em}\n.fr>span:last-child{padding:.05em .2em 0}\n.box{display:inline-block;vertical-align:middle;line-height:1.3;border:2px solid var(--acc);border-radius:.35em;padding:.12em .45em;margin:.12em 0;white-space:nowrap}\n.sol table{font-size:.9em;margin:.45em auto}\n.sol th,.sol td{padding:.28em .75em}\n.sol th{font-size:.92em}\n.sol h3{font-size:1em;margin:.6em 0 .05em}\n.sol .note{font-size:.85em;margin:.2em 0}\n.sol>p{margin:.2em 0}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\" style=\"--lw:40%;--cw:38.8em\">\n\u003cdiv class=\"top\">\n  \u003ch1>2-35 · Step excitation\u003c/h1>\n  \u003cspan class=\"given\">5 V, R\u003csub>s\u003c/sub> = 2Z\u003csub>0\u003c/sub> · main line 2Z\u003csub>0\u003c/sub> (t\u003csub>d\u003c/sub>, then 2t\u003csub>d\u003c/sub>) · shorted stub Z\u003csub>0\u003c/sub>, t\u003csub>d\u003c/sub> · open load\u003c/span>\n  \u003cbutton class=\"case\" data-c=\"0\">(a) step\u003c/button>\n  \u003cbutton class=\"case\" data-c=\"1\">(b) pulse t\u003csub>w\u003c/sub> = 4t\u003csub>d\u003c/sub>\u003c/button>\n\u003c/div>\n\u003cdiv class=\"main\">\n\u003csection class=\"left\">\n\u003cp class=\"stmt\">The circuit shown is excited by a step-voltage source of amplitude 5 V and source resistance \u003ci>R\u003c/i>\u003csub>s\u003c/sub> = 2\u003ci>Z\u003c/i>\u003csub>0\u003c/sub>, starting at \u003ci>t\u003c/i> = 0. Note that the characteristic impedance of the shorted stub is half that of the main line and that the second segment of the main line is twice as long, so its one-way time delay is 2\u003ci>t\u003c/i>\u003csub>d\u003c/sub>. \u003cb>(a)\u003c/b> Assuming the load to be an open circuit (i.e., a very large resistance), sketch the load voltage \u003ci>V\u003c/i>\u003csub>L\u003c/sub>(\u003ci>t\u003c/i>) versus \u003ci>t\u003c/i> for 0 ≤ \u003ci>t\u003c/i> ≤ 11\u003ci>t\u003c/i>\u003csub>d\u003c/sub>. \u003cb>(b)\u003c/b> Repeat part (a) for the case when the input is a pulse of duration \u003ci>t\u003c/i>\u003csub>w\u003c/sub> = 4\u003ci>t\u003c/i>\u003csub>d\u003c/sub>.\u003c/p>\n\u003csvg class=\"circ\" viewBox=\"0 0 680 275\" font-family=\"system-ui,sans-serif\">\n  \u003cg stroke=\"#141821\" stroke-width=\"2\" fill=\"none\">\n    \u003ccircle cx=\"50\" cy=\"110\" r=\"24\"/>\n    \u003cpath d=\"M40 118 H50 V100 H60\" stroke-width=\"1.8\"/>\n    \u003cpath d=\"M50 86 V40 H78 l5 -8 l10 16 l10 -16 l10 16 l10 -16 l5 8 H146\"/>\n    \u003cpath d=\"M50 134 V180 H146\"/>\n    \u003cpath d=\"M154 40 H636\" stroke-width=\"3\"/>\u003cpath d=\"M154 180 H636\" stroke-width=\"3\"/>\n    \u003cpath d=\"M300 44 L438 196\" stroke-width=\"2.6\"/>\n    \u003cpath d=\"M300 184 L438 250\" stroke-width=\"2.6\"/>\n    \u003cpath d=\"M442 200 V246\"/>\n  \u003c/g>\n  \u003cg fill=\"#fff\" stroke=\"#141821\" stroke-width=\"2\">\n    \u003ccircle cx=\"150\" cy=\"40\" r=\"4\"/>\u003ccircle cx=\"150\" cy=\"180\" r=\"4\"/>\n    \u003ccircle cx=\"300\" cy=\"40\" r=\"4\"/>\u003ccircle cx=\"300\" cy=\"180\" r=\"4\"/>\n    \u003ccircle cx=\"442\" cy=\"198\" r=\"4\"/>\u003ccircle cx=\"442\" cy=\"250\" r=\"4\"/>\n    \u003ccircle cx=\"640\" cy=\"40\" r=\"4\"/>\u003ccircle cx=\"640\" cy=\"180\" r=\"4\"/>\n  \u003c/g>\n  \u003ctext x=\"50\" y=\"80\" text-anchor=\"middle\" font-size=\"15\">+\u003c/text>\n  \u003ctext x=\"50\" y=\"152\" text-anchor=\"middle\" font-size=\"15\">−\u003c/text>\n  \u003ctext x=\"22\" y=\"104\" font-size=\"14\" text-anchor=\"end\">5 V\u003c/text>\n  \u003ctext x=\"22\" y=\"124\" font-size=\"14\" text-anchor=\"end\">0\u003c/text>\n  \u003ctext x=\"98\" y=\"22\" text-anchor=\"middle\" font-size=\"14\" font-style=\"italic\">R\u003ctspan font-size=\"10\" dy=\"3\">s\u003c/tspan>\u003ctspan dy=\"-3\"> = 2Z\u003c/tspan>\u003ctspan font-size=\"10\" dy=\"3\">0\u003c/tspan>\u003c/text>\n  \u003ctext x=\"225\" y=\"116\" text-anchor=\"middle\" font-size=\"15\" font-style=\"italic\">2Z\u003ctspan font-size=\"11\" dy=\"3\">0\u003c/tspan>\u003ctspan dy=\"-3\">, t\u003c/tspan>\u003ctspan font-size=\"11\" dy=\"3\">d\u003c/tspan>\u003c/text>\n  \u003ctext x=\"545\" y=\"116\" text-anchor=\"middle\" font-size=\"15\" font-style=\"italic\">2Z\u003ctspan font-size=\"11\" dy=\"3\">0\u003c/tspan>\u003ctspan dy=\"-3\">, 2t\u003c/tspan>\u003ctspan font-size=\"11\" dy=\"3\">d\u003c/tspan>\u003c/text>\n  \u003ctext x=\"340\" y=\"232\" font-size=\"14\" font-style=\"italic\" transform=\"rotate(26 340 232)\">Z\u003ctspan font-size=\"10\" dy=\"3\">0\u003c/tspan>\u003ctspan dy=\"-3\">, t\u003c/tspan>\u003ctspan font-size=\"10\" dy=\"3\">d\u003c/tspan>\u003c/text>\n  \u003ctext x=\"652\" y=\"74\" font-size=\"15\">+\u003c/text>\n  \u003ctext x=\"650\" y=\"116\" font-size=\"15\" font-style=\"italic\">V\u003ctspan font-size=\"11\" dy=\"4\">L\u003c/tspan>\u003c/text>\n  \u003ctext x=\"653\" y=\"158\" font-size=\"16\">−\u003c/text>\n  \u003ctext x=\"300\" y=\"30\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6a7180\">J\u003c/text>\n\u003c/svg>\n\u003cdiv class=\"sol\">\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003ci>V\u003c/i>\u003csup>+\u003c/sup> = 5 · \u003cspan class=\"fr\">\u003cspan>2\u003ci>Z\u003c/i>\u003csub>0\u003c/sub>\u003c/span>\u003cspan>2\u003ci>Z\u003c/i>\u003csub>0\u003c/sub> + 2\u003ci>Z\u003c/i>\u003csub>0\u003c/sub>\u003c/span>\u003c/span> = 2.5 V,\u003c/span> \u003cspan class=\"sg arr\">\u003ci>Γ\u003c/i>\u003csub>s\u003c/sub> = 0\u003c/span> \u003cspan class=\"sg gap\">stub short:&ensp;\u003ci>Γ\u003c/i> = −1\u003c/span> \u003cspan class=\"sg gap\">load open:&ensp;\u003ci>Γ\u003c/i> = +1\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">at J from main line:&ensp;\u003ci>Z\u003c/i>\u003csub>0\u003c/sub> ∥ 2\u003ci>Z\u003c/i>\u003csub>0\u003c/sub> = \u003cspan class=\"fr\">\u003cspan>2\u003ci>Z\u003c/i>\u003csub>0\u003c/sub>\u003c/span>\u003cspan>3\u003c/span>\u003c/span>\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003ci>Γ\u003c/i> = −\u003cspan class=\"fr\">\u003cspan>1\u003c/span>\u003cspan>2\u003c/span>\u003c/span>, \u003ci>τ\u003c/i> = \u003cspan class=\"fr\">\u003cspan>1\u003c/span>\u003cspan>2\u003c/span>\u003c/span>\u003c/span> \u003cspan class=\"sg gap\">at J from stub:&ensp;2\u003ci>Z\u003c/i>\u003csub>0\u003c/sub> ∥ 2\u003ci>Z\u003c/i>\u003csub>0\u003c/sub> = \u003ci>Z\u003c/i>\u003csub>0\u003c/sub>\u003c/span> \u003cspan class=\"sg arr\">⇒&ensp;\u003ci>Γ\u003c/i> = 0, \u003ci>τ\u003c/i> = 1\u003c/span>\u003c/div>\n\n\n\u003ch3>(b) pulse t\u003csub>w\u003c/sub> = 4t\u003csub>d\u003c/sub>\u003c/h3>\n\u003cdiv class=\"eq\">\u003cspan class=\"sg gap\">\u003cspan class=\"box\">\u003ci>V\u003c/i>\u003csub>L,b\u003c/sub>(\u003ci>t\u003c/i>) = \u003ci>V\u003c/i>\u003csub>L,a\u003c/sub>(\u003ci>t\u003c/i>) − \u003ci>V\u003c/i>\u003csub>L,a\u003c/sub>(\u003ci>t\u003c/i> − 4\u003ci>t\u003c/i>\u003csub>d\u003c/sub>)\u003c/span>\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"right\">\n\u003cdiv class=\"bar\">\n  \u003cbutton id=\"bPrev\">◀\u003c/button>\n  \u003cbutton id=\"bPlay\" style=\"min-width:44px\">▶\u003c/button>\n  \u003cbutton id=\"bNext\">▶|\u003c/button>\n  \u003cinput type=\"range\" id=\"ts\" min=\"0\" max=\"11\" step=\"0.001\" value=\"0\">\n  \u003cspan id=\"tr\">t = 0.000 t\u003csub>d\u003c/sub>\u003c/span>\n\u003c/div>\n\u003cdiv class=\"cv line\">\u003ccanvas id=\"cLine\">\u003c/canvas>\u003c/div>\n\u003cdiv class=\"two\">\n  \u003cdiv class=\"cv\" style=\"flex:600 1 0\">\u003ccanvas id=\"cBounce\" style=\"cursor:ns-resize\">\u003c/canvas>\u003c/div>\n  \u003cdiv class=\"col\">\n    \u003cdiv class=\"cv\" style=\"flex:170 1 0\">\u003ccanvas class=\"tp\" data-k=\"0\" style=\"cursor:ew-resize\">\u003c/canvas>\u003c/div>\n    \u003cdiv class=\"cv\" style=\"flex:424 1 0\">\u003ccanvas class=\"tp\" data-k=\"1\" style=\"cursor:ew-resize\">\u003c/canvas>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c/section>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  /* shrink/grow the left column so statement + figure + solution always fit without scrolling */\n  const L = document.querySelector(\".left\");\n  function fits(){ return L.scrollHeight \u003c= L.clientHeight + 1 && L.scrollWidth \u003c= L.clientWidth + 1; }\n  function fit(){\n    let lo = 9, hi = 23;\n    for (let i = 0; i \u003c 14; i++){ const m = (lo + hi)/2; L.style.fontSize = m + \"px\"; if (fits()) lo = m; else hi = m; }\n    L.style.fontSize = lo + \"px\";\n    document.documentElement.dataset.fs = lo.toFixed(2);\n  }\n  window.__fit = fit;\n  fit();\n  if (document.fonts){ document.fonts.ready.then(() => { fit(); window.dispatchEvent(new Event(\"resize\")); }); }\n  window.addEventListener(\"resize\", fit);\n  /* slide navigation keys go to the deck */\n  const NAV = [\"PageDown\",\"PageUp\",\"ArrowDown\",\"ArrowUp\",\"Home\",\"End\",\"f\",\"F\",\"l\",\"L\"];\n  document.addEventListener(\"keydown\", e => {\n    if (!NAV.includes(e.key) || e.ctrlKey || e.metaKey || e.altKey) return;\n    e.preventDefault(); e.stopImmediatePropagation();\n    parent.postMessage({deckKey: e.key}, \"*\");\n  }, true);\n})();\n\u003c/script>\n\u003cscript>\n/* laser pointer: glowing red dot + short fading trail that follows the mouse (toggle with L) */\n(function(){\n  const cv = document.createElement(\"canvas\");\n  cv.style.cssText = \"position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:2147483647\";\n  const st = document.createElement(\"style\");\n  st.textContent = \"html.laser-on, html.laser-on *{cursor:none !important}\";\n  document.head.appendChild(st);\n  const add = () => document.body.appendChild(cv);\n  document.body ? add() : addEventListener(\"DOMContentLoaded\", add);\n  const ctx = cv.getContext(\"2d\");\n  let on = true, pts = [], cur = null, raf = 0, W = 0, H = 0;\n  const TRAIL = 260;\n  function size(){ const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = Math.round(W*d); cv.height = Math.round(H*d); ctx.setTransform(d, 0, 0, d, 0, 0); }\n  size(); addEventListener(\"resize\", () => { size(); draw(); });\n  function dot(x, y){\n    const g = ctx.createRadialGradient(x, y, 0, x, y, 20);\n    g.addColorStop(0, \"rgba(255,40,40,.55)\"); g.addColorStop(.45, \"rgba(255,30,30,.22)\"); g.addColorStop(1, \"rgba(255,0,0,0)\");\n    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill();\n    ctx.fillStyle = \"#ff1f1f\"; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill();\n    ctx.fillStyle = \"rgba(255,235,235,.95)\"; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 7); ctx.fill();\n  }\n  function draw(){\n    raf = 0;\n    ctx.clearRect(0, 0, W, H);\n    if (!on) return;\n    const now = performance.now();\n    pts = pts.filter(p => now - p.t \u003c TRAIL);\n    ctx.lineCap = \"round\"; ctx.lineJoin = \"round\";\n    for (let i = 1; i \u003c pts.length; i++){\n      const a = 1 - (now - pts[i].t)/TRAIL;\n      ctx.strokeStyle = `rgba(255,30,30,${(.55*a).toFixed(3)})`; ctx.lineWidth = 1 + 7*a;\n      ctx.beginPath(); ctx.moveTo(pts[i-1].x, pts[i-1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();\n    }\n    if (cur) dot(cur.x, cur.y);\n    if (pts.length > 1) raf = requestAnimationFrame(draw);\n  }\n  const kick = () => { if (!raf) raf = requestAnimationFrame(draw); };\n  addEventListener(\"pointermove\", e => {\n    if (!on) return;\n    cur = {x: e.clientX, y: e.clientY}; pts.push({x: cur.x, y: cur.y, t: performance.now()}); kick();\n  }, true);\n  const hide = () => { cur = null; pts = []; kick(); };\n  document.addEventListener(\"mouseleave\", hide);\n  document.addEventListener(\"mouseout\", e => { if (!e.relatedTarget || e.relatedTarget.tagName === \"IFRAME\") hide(); });\n  window.__laser = v => { on = v; document.documentElement.classList.toggle(\"laser-on\", on); if (!on) hide(); kick(); };\n  window.__laser(true);\n  addEventListener(\"message\", e => { if (e.data && typeof e.data.laser === \"boolean\") window.__laser(e.data.laser); });\n})();\n\u003c/script>\n\u003cscript>\n/* bounce-diagram amplitude labels: placed along their own wave line, never on top of another label or a crossing */\nlet PQL_ = [];\nfunction PQ_(ctx, s, xa, ya, xb, yb, col, fs, ymax){ PQL_.push({s, xa, ya, xb, yb, col, fs, ymax}); }\nfunction PQF_(ctx){\n  const segs = PQL_.map(it => { let xb = it.xb, yb = it.yb; if (yb > it.ymax){ const f = (it.ymax - it.ya)/(yb - it.ya); xb = it.xa + (xb - it.xa)*f; yb = it.ymax; } return [it.xa, it.ya, xb, yb]; });\n  const hit = (r, s) => { // Liang-Barsky segment / rectangle test\n    let t0 = 0, t1 = 1; const dx = s[2] - s[0], dy = s[3] - s[1];\n    for (const [p, q] of [[-dx, s[0] - r.x0], [dx, r.x1 - s[0]], [-dy, s[1] - r.y0], [dy, r.y1 - s[1]]]){\n      if (Math.abs(p) \u003c 1e-12){ if (q \u003c 0) return false; continue; }\n      const t = q/p; if (p \u003c 0){ if (t > t1) return false; if (t > t0) t0 = t; } else { if (t \u003c t0) return false; if (t \u003c t1) t1 = t; } }\n    return true; };\n  const F = [0.5, 0.38, 0.62, 0.28, 0.72, 0.44, 0.56, 0.2, 0.8, 0.33, 0.67];\n  const placed = [];\n  PQL_.forEach((it, i) => {\n    ctx.font = `600 ${it.fs}px system-ui,sans-serif`;\n    const w = ctx.measureText(it.s).width + 10, h = it.fs + 7;\n    let best = null, bestS = Infinity;\n    for (const f of F){\n      const cx = it.xa + (it.xb - it.xa)*f, cy = it.ya + (it.yb - it.ya)*f;\n      if (cy + h/2 > it.ymax + 3) continue;\n      const r = {x0: cx - w/2 - 2, x1: cx + w/2 + 2, y0: cy - h/2 - 2, y1: cy + h/2 + 2};\n      let sc = 0;\n      for (const q of placed){ const ox = Math.min(r.x1, q.x1) - Math.max(r.x0, q.x0), oy = Math.min(r.y1, q.y1) - Math.max(r.y0, q.y0); if (ox > 0 && oy > 0) sc += 1000 + ox*oy; }\n      segs.forEach((s, j) => { if (j !== i && hit(r, s)) sc += 60; });\n      sc += Math.abs(f - 0.5)*20;\n      if (sc \u003c bestS){ bestS = sc; best = {cx, cy, r}; }\n    }\n    if (!best) return;\n    placed.push(best.r); pill(ctx, it.s, best.cx, best.cy, it.col, \"center\", it.fs);\n  });\n  PQL_ = [];\n}\n\u003c/script>\n\u003cscript>\n/* z-diagram for branched networks: every line gets its own panel, so profiles never sit on top of each other */\nfunction GLINE_(cfg){\n  const {ctx, w, h} = setup(document.getElementById(\"cLine\"));\n  const order = cfg.order, D = cfg.D || (() => 1), lo = cfg.lo, hi = cfg.hi, st = cfg.st;\n  const fm = v => { if (Math.abs(v) \u003c 5e-10) return \"0\";\n    if (cfg.fmt === \"frac\") for (let d = 1; d \u003c= 729; d++){ const n = Math.round(Math.abs(v)*d);\n      if (Math.abs(n/d - Math.abs(v)) \u003c 1e-9){ const s = n + (d > 1 ? \"/\" + d : \"\"); if (s.length \u003c= 7) return (v \u003c 0 ? \"−\" : \"\") + s; break; } }\n    return (+v.toFixed(4)).toString().replace(\"-\", \"−\"); };\n  const sgn = v => (v > 0 ? \"+\" : \"\") + fm(v);\n  const panelOf = ln => ln;\n  // rows needed for travelling-front labels (max simultaneous fronts in one panel over the whole run)\n  let rows = 1;\n  for (let j = 0; j \u003c= 300; j++){ const cnt = {}; for (const f of fronts(j/300*TMAX)){ cnt[f.ln] = (cnt[f.ln] || 0) + 1; rows = Math.max(rows, cnt[f.ln]); } }\n  rows += 1;\n  const L = 50, Rm = cfg.rm || 14, B = 44, gap = 30, Tm = 14 + 24*rows;\n  const totD = order.reduce((s, ln) => s + D(ln), 0), unit = (w - L - Rm - gap*(order.length - 1))/totD;\n  const px = {} *6, y); ctx.stroke();\n    ctx.beginPath(); ctx.moveTo(xb, y); ctx.lineTo(xb - it.dir*10, y - 5.5); ctx.lineTo(xb - it.dir*10, y + 5.5); ctx.closePath(); ctx.fill();\n    ctx.textBaseline = \"middle\"; ctx.textAlign = it.dir > 0 ? \"right\" : \"left\";\n    ctx.fillText(it.t, xa - it.dir*5, y + 1);\n  }\n  ctx.restore();\n}\n\u003c/script>\n\u003cscript>\n\"use strict\";\nconst VS = 5, TMAX = 11, EPS = 1e-9;\n// impedances in units of Z0\nconst NODE = {S:{R:2}, J:{}, SH:{R:0}, LD:{}};\nconst LN = [{n:[\"S\",\"J\"], Z:2, D:1, name:\"main 1 (2Z₀)\"}, {n:[\"J\",\"SH\"], Z:1, D:1, name:\"stub (Z₀)\"}, {n:[\"J\",\"LD\"], Z:2, D:2, name:\"main 2 (2Z₀)\"}];\nconst C = {fwd:\"#2456d6\", bwd:\"#d4442a\", tot:\"#141821\", mut:\"#6a7180\", grid:\"#eceef3\", axis:\"#a3a9b6\", ln:[\"#141821\", \"#d97706\", \"#141821\"], src:\"#7a3fd1\", vl:\"#0f8a5f\"};\nconst S = {c:0, t:0, playing:false, speed:0.8};\nlet PK, EV, RL, RT;\n\n/* ---------- wave tracing (delays are integer multiples of t_d) ---------- */\nconst par = zs => { if (zs.some(z => z === 0)) return 0; return zs.length ? 1/zs.reduce((s, z) => s + 1/z, 0) : Infinity; };\nconst att = nd => LN.map((l, i) => ({i, end: l.n.indexOf(nd)})).filter(o => o.end >= 0);\nfunction build(){\n  const launch = Array.from({length: TMAX + 3}, () => new Map());\n  const put = (k, ln, dir, a) => { if (k > TMAX + 2) return; const m = launch[k], key = ln + \"|\" + dir; m.set(key, (m.get(key) || 0) + a); };\n  const v0 = VS*LN[0].Z/(LN[0].Z + NODE.S.R);\n  put(0, 0, 1, v0); if (S.c === 1) put(4, 0, 1, -v0);\n  PK = [];\n  for (let k = 0; k \u003c= TMAX + 2; k++){\n    for (const [key, amp] of launch[k]){\n      if (Math.abs(amp) \u003c 1e-12) continue;\n      const [ln, dir] = key.split(\"|\").map(Number); PK.push({ln, dir, amp, t0:k});\n      const ta = k + LN[ln].D; if (ta > TMAX + 2) continue;\n      const nd = LN[ln].n[dir > 0 ? 1 : 0], others = att(nd).filter(o => o.i !== ln);\n      const zs = others.map(o => LN[o.i].Z); if (NODE[nd].R !== - pv) > 1e-12){ ctx.lineTo(x(t), y(pv)); ctx.lineTo(x(t), y(v)); pv = v; } }\n    ctx.lineTo(x(TMAX), y(pv)); };\n  ctx.strokeStyle = col; ctx.globalAlpha = .22; ctx.lineWidth = 3; path(); ctx.stroke(); ctx.globalAlpha = 1;\n  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, x(S.t), h); ctx.clip(); ctx.lineWidth = 3.2; path(); ctx.stroke(); ctx.restore();\n  if (k){\n    const ch = [0, ...EV.filter(t => t > EPS && t \u003c TMAX - EPS && Math.abs(fn(t + 1e-3) - fn(t - 1e-3)) > 1e-12), TMAX];\n    ctx.font = \"600 13px system-ui,sans-serif\"; ctx.fillStyle = C.tot;\n    for (let i = 0; i \u003c ch.length - 1; i++){ const tm = (ch[i] + ch[i+1])/2, v = fn(tm), up = v >= 0;\n      ctx.textBaseline = up ? \"bottom\" : \"top\"; ctx.fillText(dec(v) + \" V\", x(tm), y(v) + (up ? -5 : 5)); }\n  }\n  ctx.font = \"600 14px system-ui,sans-serif\"; ctx.fillStyle = col; ctx.textAlign = \"left\"; ctx.textBaseline = \"top\";\n  ctx.fillText(k ? \"V_L(t)\" : \"source  \" + (S.c ? \"(pulse, t_w = 4t_d)\" : \"(step)\"), L + 6, 2);\n  const xc = x(S.t), v = fn(S.t);\n  ctx.strokeStyle = \"#e0262f\"; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);\n  ctx.beginPath(); ctx.moveTo(xc, Tm); ctx.lineTo(xc, h - B); ctx.stroke(); ctx.setLineDash([]);\n  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(xc, y(v), 5, 0, 7); ctx.fill(); ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2; ctx.stroke();\n}\n\n/* ---------- ui ---------- */\nconst $ = id => document.getElementById(id);\nfunction render(){\n  $(\"tr\").innerHTML = \"t = \" + S.t.toFixed(3) + \" t\u003csub>d\u003c/sub>\"; $(\"ts\").value = S.t;\n  $(\"bPlay\").textContent = S.playing ? \"❚❚\" : \"▶\";\n  document.querySelectorAll(\".case\").forEach(b => b.classList.toggle(\"on\", +b.dataset.c === S.c));\n  drawLine(); drawBounce();\n  document.querySelectorAll(\".tp\").forEach(c => plotT(c, +c.dataset.k));\n}\nfunction setT(t){ S.t = Math.min(Math.max(t, 0), TMAX); render(); }\nlet last = null;\nfunction tick(ts){\n  if (!S.playing){ last = null; return; }\n  if (last !== null){ let t = S.t + (ts - last)/1000*S.speed; if (t >= TMAX){ t = TMAX; S.playing = false; } S.t = t; render(); }\n  last = ts; requestAnimationFrame(tick);\n}\nfunction play(on){ S.playing = on === undefined ? !S.playing : on; if (S.playing){ if (S.t >= TMAX - 1e-6) S.t = 0; requestAnimationFrame(tick); } render(); }\nconst next = () => { play(false); const e = EV.find(t => t > S.t + 1e-6); setT(e === undefined ? TMAX : e); };\nconst prev = () => { play(false); const e = [...EV].reverse().find(t => t \u003c S.t - 1e-6); setT(e === undefined ? 0 : e); };\nconst setCase = c => { S.c = c; build(); render(); };\n$(\"bPlay\").onclick = () => play(); $(\"bNext\").onclick = next; $(\"bPrev\").onclick = prev;\n$(\"ts\").oninput = e => { play(false); setT(+e.target.value); };\ndocument.querySelectorAll(\".case\").forEach(b => b.onclick = () => setCase(+b.dataset.c));\nfunction drag(c, fn){\n  let d = false; const go = e => { const r = c.getBoundingClientRect(); fn(e.clientX - r.left, e.clientY - r.top); };\n  c.addEventListener(\"pointerdown\", e => { d = true; play(false); c.setPointerCapture(e.pointerId); go(e); });\n  c.addEventListener(\"pointermove\", e => d && go(e)); c.addEventListener(\"pointerup\", () => d = false);\n}\ndrag($(\"cBounce\"), (x, y) => setT((y - BG.y0)/(BG.y1 - BG.y0)*TMAX));\ndocument.querySelectorAll(\".tp\").forEach(c => drag(c, x => setT((x - TG.x0)/(TG.x1 - TG.x0)*TMAX)));\ndocument.addEventListener(\"keydown\", e => {\n  if (e.code === \"Space\"){ e.preventDefault(); play(); }\n  else if (e.key === \"ArrowRight\"){ e.preventDefault(); e.shiftKey ? setT(S.t + .01) : next(); }\n  else if (e.key === \"ArrowLeft\"){ e.preventDefault(); e.shiftKey ? setT(S.t - .01) : prev(); }\n  else if (e.key === \"1\" || e.key === \"2\") setCase(+e.key - 1);\n});\nwindow.addEventListener(\"resize\", render);\nbuild(); render();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n",
